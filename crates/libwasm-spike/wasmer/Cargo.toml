# SPDX-License-Identifier: Apache-2.0

[package]
name = "kungfu-libwasm-wasmer-spike"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "kf_libwasm_wasmer_spike"
path = "../src/lib.rs"
crate-type = ["cdylib"]

[workspace]

[features]
default = ["wasmer-engine"]
wasmtime-engine = []
wasmer-engine = []

[dependencies]
wasmer = { version = "=7.2.0", default-features = false, features = ["sys", "cranelift"] }
wat = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
