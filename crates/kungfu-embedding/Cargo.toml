# SPDX-License-Identifier: Apache-2.0
#
# kungfu-embedding — the safe Rust face of the libkungfu embedding C ABI.
#
# RFC docs/architecture/embedding-contract-face.md D7: the one shared borrowing
# layer over the versioned `kungfu_embedding_get_api` + `kf_embedding_api_v1`
# membrane (ADR-0045 gate 1 / ADR-0046 decision 5). Both the product trunk
# (crates/trunk, this stage) and the future native-authoring crate (kungfu-kfx,
# ADR-0045 gate 2) depend on this — one membrane, one safe wrapper, two consumers;
# never a second copy of the FFI seam.
#
# Deliberately a pure rlib: it declares the extern "C" bootstrap and the repr(C)
# tables but does NOT link libkungfu. Building the rlib leaves the extern symbol
# unresolved (deferred to the final binary), so this crate stays inside the shifu
# workspace CI gate without a built core in reach. The consumer that produces the
# binary (trunk's build.rs, in the product build where the core artifact location
# is known — the D6 first-party, same-build path) supplies the link search path
# and `-lkungfu`. That is exactly why host-spike, which links a sibling core, is
# workspace-excluded while this seam crate is not.

[package]
name = "kungfu-embedding"
version = "4.0.0-alpha.1"
description = "safe Rust wrapper over the libkungfu embedding C ABI (one membrane, two consumers)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# std-only on purpose, matching the repo's Rust dependency discipline: the whole
# crate is a thin, unsafe-confined borrowing layer over the C ABI.
[dependencies]
