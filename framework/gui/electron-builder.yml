appId: com.kungfu.app
productName: Kungfu
# asar:false so the native binding (.node) and kungfu dylibs can be require()d
# directly from Resources/kungfu at runtime.
asar: false
npmRebuild: false
# Bake the frozen first-party manifest (ADR-0013) into dist/kungfu before it is
# shipped to Resources/kungfu, so trust is granted by verifiable source.
beforePack: ./scripts/before-pack.cjs
afterPack: ./scripts/after-pack.cjs
files:
  - out/**/*
  - package.json
  - "!node_modules/@kungfu-tech/core{,/**}"
  - "!node_modules/@kungfu-tech/**/node_modules/@kungfu-tech/core{,/**}"
  - "!node_modules/@kungfu-tech/**/.venv{,/**}"
  - "!node_modules/@kungfu-tech/**/build{,/**}"
  - "!node_modules/@kungfu-tech/**/dist/kungfu{,/**}"
extraResources:
  # Ship the kungfu runtime (libkungfu.dylib + kungfu_electron.node) so the
  # packaged app loads the binding from Resources/kungfu, matching its rpath.
  - from: ../core/dist/kungfu
    to: kungfu
  # The CLI wrapper that "Install 'kungfu' Command in PATH" symlinks into
  # /usr/local/bin; it resolves the bundled runtime next to it and execs it.
  - from: resources/cli
    to: cli
  # The Ink reference TUI, bundled to a single ES module and run through
  # kungfu's embedded Node (libnode) via `kungfu cockpit`.
  - from: ../tui/dist
    to: tui
mac:
  # dir = the pack verb's unpacked app (fast, CI-friendly); dmg + zip = the
  # dist verb's installable artifacts. Unsigned pre-release (identity: null):
  # first launch needs right-click-Open or removing the quarantine attribute
  # — documented in docs/rewind.md.
  target:
    - dir
    - dmg
    - zip
  identity: null
linux:
  # executableName is required here: on Linux it otherwise defaults to the
  # package name (@kungfu-tech/gui), whose '@' and '/' are rejected as an
  # executable file name and break AppImage/snap packaging. dir = the pack
  # verb's fast unpacked app; AppImage = the dist verb's portable installer.
  # snap is intentionally not a target — it needs a snapcraft/mksquashfs
  # toolchain that is not part of this build host.
  executableName: kungfu
  category: Finance
  target:
    - dir
    - AppImage
win:
  # nsis = the dist verb's Windows installer; dir = the fast unpacked app.
  # executableName defaults to productName (Kungfu), already a valid file name.
  target:
    - dir
    - nsis
