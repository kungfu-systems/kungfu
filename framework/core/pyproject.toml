# SPDX-License-Identifier: Apache-2.0

# ============================================================================
# uv 迁移(goal 2026-06-26-kungfu-buildchain-modernization S1，阶段 A+B 完成)
# 单一真相源 = [project](PEP 621) + [tool.uv]：uv 接管 env+lock+install；
# wheel 由 setuptools 后端 + src/python/setup.py(读 [project]) 承担(已脱 poetry-core)。
# ============================================================================

[project]
name = "kungfu"
version = "0.0.0"
description = "Kungfu Core Library"
license = { text = "Apache-2.0" }
authors = [{ name = "Kungfu", email = "info@kungfu.link" }]
requires-python = ">=3.13,<3.14"
# [project].dependencies 就是 wheel 的 install_requires(setup.py 读 [project])：
# 只放 kungfu 包运行时真正 import 的东西——安装 kungfu wheel 的卫星环境不应被拖进
# conan/ruff/nuitka 整套构建工具链。工具链/引擎桥/历史种子在 [dependency-groups] dev
# (uv sync/run 默认安装 dev 组,开发与构建视图不变)。
dependencies = [
    # Console
    "click~=8.1.7",
    "jsonschema~=4.25.0",
    "psutil~=6.1.0",
    "tabulate~=0.9.0",
    # Rewind capture events (FlatBuffers python runtime, pure python)
    "flatbuffers>=25.2,<26",
]

[project.urls]
homepage = "https://kungfu.tech"
repository = "https://github.com/kungfu-systems/kungfu.git"

[dependency-groups]
# 开发/构建工具链——本地与 CI 的 uv sync/run 默认安装,不进 wheel install_requires。
dev = [
    # Compiler / checkers
    "ruff~=0.15.0",
    # static type checker — gradual baseline (see [tool.mypy]); verify selects
    # the exact 1.20.2 tool lane without syncing/installing the project. Lenient
    # by default so untyped modules do not fail; a module opts into real checking
    # as it gains annotations.
    "mypy~=1.13",
    # clang-format via PyPI wheel, same uv toolchain lane as ruff. Pinned exactly
    # (==) because a version bump changes C++ formatting output; an exact pin keeps
    # the result byte-identical across machines instead of the ambient system one.
    "clang-format==20.1.8",
    # Native build orchestrator. run-conan.js invokes `uv run --frozen conan`;
    # keep Conan in the locked uv environment instead of relying on runner-global tools.
    "conan>=2.22,<3.0.0",
    # cmake-js configures the core addon with `-G Ninja`; make the build tool
    # part of the uv environment so Windows CI does not depend on runner-global ninja.
    "ninja>=1.13,<2.0",
    # Regenerate the native pykungfu .pyi stubs as a build step (.gyp/gen-stubs.js
    # after the addon compiles + libnode colocates) so committed stubs/ track the
    # C++ binding instead of drifting. Type-check env uses the committed text stubs.
    "pybind11-stubgen~=2.5",
    # 产品打包器依赖已随分发链退役；nuitka pin 仅供 `engage nuitka` 桥
    # (KF-ADR-019f86da-4f90-7d41-a4a0-e6b01d4b31c6 Python-AOT KFX build)使用。
    "nuitka~=4.1.0",
    # engage bridges (pdm/scons/nuitka) belong to the KFX build boundary, not
    # the assembled product-host taxonomy.
    "pdm~=2.28.0",
    "pdm-pep517~=1.1.0",
    "scons~=4.8.0",
    "tomli-w~=1.0.0",
    "tomlkit~=0.13.0",
    # Tests
    "pytest>=9.0.3,<10.0.0",
    # 以下为历史 Pipfile/poetry 种子(kungfu 包代码无 import;保守保留在 dev,
    # 待各自消费者证伪后再逐批退役):
    "wcmatch~=10.0.0",
    # Numeric
    "numpy~=2.1.0",
    "pandas~=2.2.0",
    "scipy~=1.14.0",
    "statsmodels~=0.14.4",
    "openpyxl~=3.1.5",
    # Loose / transitive(放宽，3.13 自解析)
    "certifi",
    "chardet",
    "charset-normalizer",
    "importlib-metadata",
    "msgpack",
    "filelock",
    "ordered-set",
    "packaging",
    "platformdirs",
    "pluggy",
    "railroad-diagrams",
    "shellingham",
    "zipp",
    "authing~=5.1.0",
    "urllib3>=2.7.0,<3.0.0",
    "websockets~=13.1.0",
    "boto3~=1.35.0",
    "keyring~=25.5.0",
    "zstandard~=0.23.0",
    # was Pipfile [packages] seed
    "setuptools>=83.0.0,<84.0.0",
    "virtualenv>=20.36.1,<21.0.0",
    "wheel>=0.46.2,<0.47.0",
    "pip>=26.1,<27.0",
    "plotly>=6.8.0,<7.0.0",
    # was Pipfile [packages] os-specific（带平台 marker）
    "xattr==1.1.4 ; sys_platform != 'win32'",
    "cffi>=2.0.0,<3.0.0 ; sys_platform != 'win32'",
    "pycparser==2.22 ; sys_platform != 'win32'",
    "colorama==0.4.6 ; os_name == 'nt'",
    "pywin32-ctypes==0.2.3 ; sys_platform == 'win32'",
    "cryptography>=50.0.0,<51.0.0 ; sys_platform == 'linux'",
    "jeepney==0.8.0 ; sys_platform == 'linux'",
    "secretstorage==3.3.3 ; sys_platform == 'linux'",
]

# python 预检：ruff（S1 = ruff format，替代 black；line-length 88 对齐 black 默认风格）。
# ruff check（lint）已在 staged + changed-scope 门启用（scripts/check.mjs，select E/F 见
# [tool.ruff.lint]）；whole-tree 门（check:all）暂缓，待现存 lint 基线清零后再纳入。
[tool.ruff]
line-length = 88
target-version = "py313"
# 不格式化 vendored 依赖（.deps/* 如 pybind11）；black 当年用 `.` 误格式化过它们，此处收窄回正确范围。
# flatbuffers/flatc 生成物标 "do not modify"，不纳入格式化基线（重新生成会覆盖）：
#   PascalCase table 文件（保留手写的小写 __init__.py）+ *_fb.py（reflection_fb.py 等）。
extend-exclude = [".deps", "**/fb/[A-Z]*.py", "**/*_fb.py"]

# S2：引入 lint 门（之前无 python linter）。curated 采纳——
# select E/F（pycodestyle+pyflakes）；忽略 F403/F405（项目有意用 `from x import *`）；
# __init__.py 的 F401 例外（re-export 用途）。
[tool.ruff.lint]
select = ["E", "F"]
# E501(行长)交给 formatter，不 lint（formatter 已折 88，剩余多为长字符串/注释/URL 无法折）；
# F403/F405 = 项目有意用 `from x import *`。
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

# Static type checking — gradual/baseline. Signatures are still largely
# un-annotated, so `disallow_untyped_defs` stays off (that is a big-bang wall of
# ~700 errors). But function *bodies* are checked: an unannotated def used to be
# skipped wholesale, which meant most of the package was passing by not being
# looked at. Native pykungfu and unstubbed third-party libs have no stubs, so
# missing imports are ignored. The package is error-clean; keep it that way —
# fix or annotate a module rather than silencing it. The per-module overrides
# below are narrow exceptions, each justified where it is declared.
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ['(^|/)(fb|generated)/', '_fb\.py$', '(^|/)\.deps/']
# Check the bodies of un-annotated functions. Without this, "no issues found"
# mostly measured how little was annotated, not how correct the code was.
check_untyped_defs = true
# Checked surface, in one place so verify and source-acceptance cannot drift
# apart. Paths are relative to this file (framework/core). The core package is
# the bulk; the three siblings are small but load-bearing — kungfu_sdk is the
# public Python SDK surface, guest-harness backs the capability guest contract,
# and work-control-actions carries extension domain logic. All are error-free
# under this baseline, so listing them locks that in rather than fixing debt.
files = [
    "src/python/kungfu",
    "../storage/python/kungfu_sdk",
    "../api/src/capability/guest-harness",
    "../../extensions/work-control/work-control-actions",
]
# The native pykungfu binding is not compiled in the type-check env; type
# consumers against committed .pyi stubs (stubs/pykungfu/, generated from the
# compiled binding via pybind11-stubgen) instead of falling back to Any.
mypy_path = "stubs"

# The stubs are machine-generated from the real binary, so their *types* are
# accurate; but stubgen emits expression noise (overload dupes, `...` in
# signatures, forward-ref name-defined). Trust the stub types, do not report the
# stub's own internal issues. Track the remaining pykungfu stub typing work separately.
[[tool.mypy.overrides]]
module = "pykungfu.*"
ignore_errors = true

# Vendored CPython site.py plus PDM's PEP582 sitecustomize. Every flagged
# attribute exists at run time and is what the module is *for*: `__cached__` on
# a module object, and `sys._framework` / `sys._base_executable` / `sys._home`,
# which CPython sets on framework builds and venv bootstrap. typeshed simply
# does not declare these private interpreter attributes. Nothing here is ours to
# annotate, and asserting them away would defeat the file's purpose.
[[tool.mypy.overrides]]
module = "kungfu.cli.site"
disable_error_code = ["attr-defined"]

# A deliberate AbstractEventLoop implementation for the live runtime. Two
# unfixable-from-here classes of error:
#   - override: typeshed types call_soon/call_later/... with a TypeVarTuple that
#     binds callback args to *args. An un-annotated override can never satisfy
#     `*args: *_Ts`, so every one is flagged even though arity and keywords match
#     exactly. (create_task, which really did drop name=/context=, was fixed in
#     the code rather than silenced here.)
#   - attr-defined: the loop drives asyncio.TimerHandle through its documented-
#     by-CPython private fields (`_when`, `_scheduled`), which are real —
#     TimerHandle.__slots__ contains them — but undeclared in typeshed.
[[tool.mypy.overrides]]
module = "kungfu.runtime.live.event_loop"
disable_error_code = ["override", "attr-defined"]

# The engage bridge stamps `ctx.bridging` onto click's Context, an external
# class we cannot annotate. The attribute is set and read only within this
# bridge. (KF-ADR-019f86da-4f90-73ff-9543-f0a4f0beef05 retires the engage bridges; this override retires with them.)
[[tool.mypy.overrides]]
module = "kungfu.cli.commands.engage"
disable_error_code = ["attr-defined"]

[tool.uv]
# 钉 uv 自管 standalone CPython(而非系统/发行版 python)：跨机一致,且根治 nuitka 在
# Debian/系统 python(flavor 'Debian Python')下冻结段错误(SIGSEGV);新机由 uv 自动下载对应
# standalone 解释器,freeze 行为可复现。
python-preference = "only-managed"
# pypi index 不在仓内硬编码(开源安全,避免内网/镜像耦合)：走用户全局 ~/.config/uv/uv.toml 的
# index-url,或环境变量 UV_DEFAULT_INDEX(可由 shifu 的 cache-proxy 配置统一提供);
# 二者皆未配置则用官方 PyPI。需要 CN 镜像/局域网 devpi 时在用户侧配置,不污染本仓。

# S1 阶段 B：脱 poetry-core，单一真相源收敛到 [project]/[tool.uv]。
# wheel build 由 setuptools 后端 + src/python/setup.py（读 [project]）承担。
[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"
