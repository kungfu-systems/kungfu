[package]
name = "xinfa"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "The verified context compiler for human-agent software development"
publish = false

[dependencies]
serde_json = "1.0.145"
sha2 = "0.10.9"

[lib]
name = "xinfa"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "xinfa"
path = "src/main.rs"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
