# SPDX-License-Identifier: Apache-2.0

name: Dev Delivery Warrant Terminal

on:
  pull_request_target:
    types: [closed, dequeued, synchronize]
    branches:
      - dev/v*/v*

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      active: ${{ steps.terminal.outputs.active }}
      active-source-head-sha: ${{ steps.terminal.outputs.active-source-head-sha }}
      queued: ${{ steps.terminal.outputs.queued }}
      queued-candidate-id: ${{ steps.terminal.outputs.queued-candidate-id }}
      queued-source-head-sha: ${{ steps.terminal.outputs.queued-source-head-sha }}
      queue-state-root: ${{ steps.terminal.outputs.queue-state-root }}
      outcome: ${{ steps.terminal.outputs.outcome }}
      current-base-sha: ${{ steps.terminal.outputs.current-base-sha }}
      replay-tree-sha: ${{ steps.terminal.outputs.replay-tree-sha }}
      merge-group-head-sha: ${{ steps.terminal.outputs.merge-group-head-sha }}
      merge-group-tree-sha: ${{ steps.terminal.outputs.merge-group-tree-sha }}
      required-context-roots-json: ${{ steps.terminal.outputs.required-context-roots-json }}
      terminal-evidence-root: ${{ steps.terminal.outputs.terminal-evidence-root }}
      reason: ${{ steps.terminal.outputs.reason }}
    steps:
      - name: Check out protected Buildchain runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: 4dabecd7056e168f7345d460e3729465a932db9c
          path: .buildchain/runtime
          persist-credentials: false

      - name: Bind the protected terminal event
        id: terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: |
          set -euo pipefail
          mkdir -p .buildchain/dev-delivery-terminal
          observation=.buildchain/dev-delivery-terminal/observation.json
          # shifu-entry-contract: allow protected Buildchain Warrant observation without executing consumer source
          node .buildchain/runtime/scripts/dev-delivery-warrant.mjs observe \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$TARGET_BRANCH" \
            --output "$observation"

          active_match="$(jq -r \
            --argjson pr "$EXPECTED_PR" \
            '.observation.activeWarrant.pullRequestNumber == $pr
             and .observation.activeCandidate.pullRequestNumber == $pr
             and .observation.activeCandidate.candidateId == .observation.activeWarrant.candidateId' \
            "$observation")"
          queued_matches="$(jq -c \
            --argjson pr "$EXPECTED_PR" \
            '[.observation.queued[]? | select(.pullRequestNumber == $pr)]' \
            "$observation")"
          queued_count="$(jq -r 'length' <<<"$queued_matches")"
          if [ "$active_match" != "true" ] && [ "$queued_count" -eq 0 ]; then
            {
              echo "active=false"
              echo "queued=false"
            } >> "$GITHUB_OUTPUT"
            echo "No matching active Warrant or queued candidate; already-settled deliveries are terminal no-ops."
            exit 0
          fi
          if [ "$active_match" = "true" ] && [ "$queued_count" -ne 0 ]; then
            echo "The same PR cannot be both active and queued." >&2
            exit 1
          fi
          if [ "$active_match" != "true" ] && [ "$queued_count" -ne 1 ]; then
            echo "Expected exactly one queued candidate for terminal cancellation." >&2
            exit 1
          fi

          if [ "$active_match" = "true" ]; then
            recorded_head="$(jq -er '.observation.activeWarrant.sourceHead' "$observation")"
            {
              echo "active=true"
              echo "queued=false"
              echo "active-source-head-sha=$recorded_head"
            } >> "$GITHUB_OUTPUT"
          else
            recorded_head="$(jq -er '.[0].sourceHead' <<<"$queued_matches")"
            {
              echo "active=false"
              echo "queued=true"
              echo "queued-candidate-id=$(jq -er '.[0].candidateId' <<<"$queued_matches")"
              echo "queued-source-head-sha=$recorded_head"
              echo "queue-state-root=$(jq -er '.observation.stateRoot' "$observation")"
            } >> "$GITHUB_OUTPUT"
          fi
          # GitHub may emit pull_request_target:dequeued immediately before the
          # closed event for a successfully merged queue entry. The payload's
          # merged fact is terminal authority and must win that event race.
          if [ "$MERGED" = "true" ] && [ "$recorded_head" = "$EXPECTED_HEAD" ]; then
            outcome=merged
          elif [ "$EVENT_ACTION" = "dequeued" ] && [ "$recorded_head" = "$EXPECTED_HEAD" ]; then
            outcome=dequeued
          else
            outcome=cancelled
          fi
          {
            echo "outcome=$outcome"
            echo "reason=protected pull request event: $EVENT_ACTION"
          } >> "$GITHUB_OUTPUT"

          if [ "$active_match" != "true" ] && [ "$outcome" = "merged" ]; then
            echo "A queued candidate cannot consume a merged terminal event." >&2
            exit 1
          fi

          if [ "$outcome" = "merged" ]; then
            test "${#MERGE_SHA}" -eq 40
            case "$MERGE_SHA" in
              *[!0-9a-f]*) echo "merged terminal event lacks an exact merge commit" >&2; exit 1 ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$MERGE_SHA" \
              > .buildchain/dev-delivery-terminal/merge-commit.json
            merge_tree="$(jq -er '.tree.sha' .buildchain/dev-delivery-terminal/merge-commit.json)"
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.conclusion == "success") | {kind:"check",name:.name,headSha:.head_sha,conclusion:.conclusion,completedAt:.completed_at}' \
              > .buildchain/dev-delivery-terminal/success-contexts.jsonl
            gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/status" \
              --jq '.statuses[] | select(.state == "success") | {kind:"status",name:.context,headSha:.sha,conclusion:.state,completedAt:.updated_at}' \
              >> .buildchain/dev-delivery-terminal/success-contexts.jsonl
            test -s .buildchain/dev-delivery-terminal/success-contexts.jsonl
            context_roots='[]'
            while IFS= read -r context; do
              canonical="$(jq -cS . <<<"$context")"
              root="sha256:$(printf '%s' "$canonical" | sha256sum | awk '{print $1}')"
              context_roots="$(jq -cn --argjson roots "$context_roots" --arg root "$root" '$roots + [$root] | unique | sort')"
            done < <(jq -cS . .buildchain/dev-delivery-terminal/success-contexts.jsonl | sort)
            printf '%s\n' "$context_roots" > .buildchain/dev-delivery-terminal/context-roots.json
            context_roots="$(cat .buildchain/dev-delivery-terminal/context-roots.json)"
            test "$context_roots" != "[]"
            {
              echo "current-base-sha=$MERGE_SHA"
              echo "replay-tree-sha=$merge_tree"
              echo "merge-group-head-sha=$MERGE_SHA"
              echo "merge-group-tree-sha=$merge_tree"
              echo "required-context-roots-json=$context_roots"
              echo "terminal-evidence-root="
            } >> "$GITHUB_OUTPUT"
          else
            evidence="$(jq -cnS \
              --arg action "$EVENT_ACTION" \
              --argjson pr "$EXPECTED_PR" \
              --arg recordedHead "$recorded_head" \
              --arg observedHead "$EXPECTED_HEAD" \
              --arg base "$TARGET_BRANCH" \
              --arg outcome "$outcome" \
              --arg closedAt "$CLOSED_AT" \
              '{schema:"kungfu.dev-delivery-terminal-event/v1",action:$action,pullRequest:$pr,recordedSourceHead:$recordedHead,observedSourceHead:$observedHead,protectedBase:$base,outcome:$outcome,closedAt:$closedAt}')"
            evidence_root="sha256:$(printf '%s' "$evidence" | sha256sum | awk '{print $1}')"
            {
              echo "current-base-sha="
              echo "replay-tree-sha="
              echo "merge-group-head-sha="
              echo "merge-group-tree-sha="
              echo "required-context-roots-json=[]"
              echo "terminal-evidence-root=$evidence_root"
            } >> "$GITHUB_OUTPUT"
          fi

  close:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: kungfu-systems/buildchain/.github/workflows/dev-delivery-warrant-close.yml@4dabecd7056e168f7345d460e3729465a932db9c
    with:
      buildchain-ref: 4dabecd7056e168f7345d460e3729465a932db9c
      target-branch: ${{ github.event.pull_request.base.ref }}
      expected-pr-number: ${{ github.event.pull_request.number }}
      expected-head-sha: ${{ needs.prepare.outputs.active-source-head-sha }}
      outcome: ${{ needs.prepare.outputs.outcome }}
      current-base-sha: ${{ needs.prepare.outputs.current-base-sha }}
      replay-tree-sha: ${{ needs.prepare.outputs.replay-tree-sha }}
      merge-group-head-sha: ${{ needs.prepare.outputs.merge-group-head-sha }}
      merge-group-tree-sha: ${{ needs.prepare.outputs.merge-group-tree-sha }}
      required-context-roots-json: ${{ needs.prepare.outputs.required-context-roots-json }}
      terminal-evidence-root: ${{ needs.prepare.outputs.terminal-evidence-root }}
      reason: ${{ needs.prepare.outputs.reason }}
    secrets:
      github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}

  cancel-queued:
    needs: prepare
    if: needs.prepare.outputs.queued == 'true'
    uses: kungfu-systems/buildchain/.github/workflows/dev-delivery-warrant-cancel.yml@4dabecd7056e168f7345d460e3729465a932db9c
    with:
      buildchain-ref: 4dabecd7056e168f7345d460e3729465a932db9c
      target-branch: ${{ github.event.pull_request.base.ref }}
      expected-pr-number: ${{ github.event.pull_request.number }}
      expected-candidate-id: ${{ needs.prepare.outputs.queued-candidate-id }}
      expected-source-head-sha: ${{ needs.prepare.outputs.queued-source-head-sha }}
      observed-source-head-sha: ${{ github.event.pull_request.head.sha }}
      expected-old-state-root: ${{ needs.prepare.outputs.queue-state-root }}
      event-action: ${{ github.event.action }}
      outcome: ${{ needs.prepare.outputs.outcome }}
      terminal-evidence-root: ${{ needs.prepare.outputs.terminal-evidence-root }}
      reason: ${{ needs.prepare.outputs.reason }}
    secrets:
      github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
