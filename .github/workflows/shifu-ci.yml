# SPDX-License-Identifier: Apache-2.0
#
# CI for the two small standalone Rust workspaces: the Shifu launcher under
# crates/ and the extraction-first Xinfa compiler. Deliberately independent of
# the Buildchain lifecycle so their producer contracts are checked directly on
# every supported host toolchain.

name: shifu CI

on:
  pull_request:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
    paths:
      - "crates/**"
      - "xinfa/**"
      - "scripts/check-shifu-workspace.mjs"
      - "scripts/shifu-gate-*.mjs"
      - "package.json"
      - "shifu.gates.json"
      - ".github/workflows/shifu-ci.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-22.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Run Shifu workspace Gate (POSIX)
        if: runner.os != 'Windows'
        run: ./shifu gate run shifu.workspace --capability rust
      - name: Run Shifu workspace Gate (Windows)
        if: runner.os == 'Windows'
        run: .\shifu.cmd gate run shifu.workspace --capability rust
      - name: Verify Xinfa producer contracts (POSIX)
        if: runner.os != 'Windows'
        run: ./shifu xinfa:check
      - name: Verify Xinfa producer contracts (Windows)
        if: runner.os == 'Windows'
        run: .\shifu.cmd xinfa:check
