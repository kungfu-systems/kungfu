# SPDX-License-Identifier: Apache-2.0
#
# CI for the Rust workspace under crates/ (currently the shifu launcher).
# Deliberately independent of the buildchain lifecycle: crates/ sits in front of
# the toolchain the buildchain lifecycle provisions, so it gets a small,
# fast, GitHub-hosted gate of its own.

name: shifu CI

on:
  pull_request:
    branches:
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
    paths:
      - "crates/**"
      - "scripts/check-shifu-workspace.mjs"
      - "scripts/shifu-gate-*.mjs"
      - "package.json"
      - "shifu.gates.json"
      - ".github/workflows/shifu-ci.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-22.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Run Shifu workspace Gate (POSIX)
        if: runner.os != 'Windows'
        run: ./shifu gate run shifu.workspace --capability rust
      - name: Run Shifu workspace Gate (Windows)
        if: runner.os == 'Windows'
        run: .\shifu.cmd gate run shifu.workspace --capability rust
