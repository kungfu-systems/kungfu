# SPDX-License-Identifier: Apache-2.0

name: Dev post-merge advisory

on:
  push:
    branches:
      - dev/v*/v*
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact protected Dev commit to observe
        required: true
        type: string

concurrency:
  group: dev-post-merge-advisory-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Bind exact merged Dev authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      merge-group-run-id: ${{ steps.source.outputs.run-id }}
      native-required: ${{ steps.source.outputs.native-required }}
      target-sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out exact protected Dev head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact advisory target
        id: target
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            dev/v*/v*) ;;
            *) echo "Post-merge advisory requires a protected Dev channel ref." >&2; exit 1 ;;
          esac
          if [ "$REF_PROTECTED" != true ]; then
            echo "Post-merge advisory requires a protected Dev channel ref." >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Advisory target must be one exact lowercase commit SHA." >&2
            exit 1
          fi
          target_sha="$(git rev-parse "${REQUESTED_TARGET_SHA}^{commit}")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$target_sha" = "$(git rev-parse HEAD)"
          else
            git merge-base --is-ancestor "$target_sha" HEAD
            git checkout --detach "$target_sha"
          fi
          test "$(git rev-parse HEAD)" = "$target_sha"
          git diff --quiet
          git diff --cached --quiet
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Locate exact successful merge-group authority
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_run=""
          runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/affected-native-pr.yml/runs" \
              -f event=merge_group \
              -f head_sha="$TARGET_SHA" \
              -f per_page=20 \
              --jq '.workflow_runs | sort_by([.created_at, .id]) | reverse | .[].id'
          )"
          for run_id in $runs; do
            run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status,.conclusion] | @tsv')"
            [ "$run_state" = $'completed\tsuccess' ] || continue
            required_count="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                -f filter=latest -f per_page=100 \
                --jq '[.jobs[] | select(.name == "affected-native / linux" and .status == "completed" and .conclusion == "success")] | length'
            )"
            [ "$required_count" -eq 1 ] || continue
            plan_count="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.expired == false and .name == \"dev-candidate-plan-${TARGET_SHA}\")] | length"
            )"
            if [ "$plan_count" -gt 1 ]; then
              echo "Exact Dev candidate plan is ambiguous in run ${run_id}." >&2
              exit 1
            fi
            [ "$plan_count" -eq 1 ] || continue
            source_run="$run_id"
            break
          done
          if [ -z "$source_run" ]; then
            echo "No exact successful merge-group authority is available for ${TARGET_SHA}." >&2
            exit 1
          fi
          gh run download "$source_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name "dev-candidate-plan-${TARGET_SHA}" \
            --dir product/qualification/dev-post-merge-advisory/input
          plan=product/qualification/dev-post-merge-advisory/input/plan.json
          test -s "$plan"
          native_required=false
          if [ "$(jq '.closureComponents | length' "$plan")" -gt 0 ]; then
            native_required=true
          fi
          {
            echo "run-id=${source_run}"
            echo "native-required=${native_required}"
          } >> "$GITHUB_OUTPUT"
      - name: Retain exact advisory input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-post-merge-advisory-input-${{ steps.target.outputs.sha }}
          path: product/qualification/dev-post-merge-advisory/input/plan.json
          if-no-files-found: error
          retention-days: 14

  production_graph_parity:
    name: Production Graph parity advisory / linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact merged Dev head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.target-sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install verifier dependencies
        run: ./shifu install --frozen-lockfile
      - name: Run additive protected-CI shadow lane
        run: >-
          ./shifu production-graph:local-ci-parity run
          --lane protected-ci
          --output-dir "$RUNNER_TEMP/production-graph-parity"
      - name: Verify retained parity artifact
        run: >-
          ./shifu production-graph:local-ci-parity verify
          --artifact-dir "$RUNNER_TEMP/production-graph-parity"
      - name: Upload retained parity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-graph-parity-advisory-${{ needs.prepare.outputs.target-sha }}
          path: ${{ runner.temp }}/production-graph-parity
          if-no-files-found: error
          retention-days: 14

  qualified_core_candidate:
    name: Qualified Core advisory / ${{ matrix.row }}
    needs: prepare
    if: ${{ needs.prepare.outputs.native-required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: darwin-arm64-cp313
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
            node_platform: darwin
            node_arch: arm64
          - row: linux-x86_64-cp313
            runner: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
            node_platform: linux
            node_arch: x64
            cc: gcc-14
            cxx: g++-14
          - row: windows-x86_64-cp313
            runner: windows-2022
            runner_os: Windows
            runner_arch: X64
            node_platform: win32
            node_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      KUNGFU_BUILD_PROFILE: full
    steps:
      - name: Check out exact merged Dev head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.target-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Download exact advisory input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-post-merge-advisory-input-${{ needs.prepare.outputs.target-sha }}
          path: product/qualification/qualified-core/input
      - name: Build and seal minimum relocatable Assignment Core candidate
        uses: ./.github/actions/qualified-core-candidate-build
        with:
          row: ${{ matrix.row }}
          runner-label: ${{ matrix.runner }}
          runner-os: ${{ matrix.runner_os }}
          runner-arch: ${{ matrix.runner_arch }}
          node-platform: ${{ matrix.node_platform }}
          node-arch: ${{ matrix.node_arch }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          producer-event: push
          producer-workflow-path: .github/workflows/dev-post-merge-advisory.yml
      - name: Upload non-authoritative candidate transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-assignment-core-candidate-${{ needs.prepare.outputs.target-sha }}-${{ matrix.row }}
          path: product/qualification/qualified-core/candidate
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
