# SPDX-License-Identifier: Apache-2.0

name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - alpha/v*/v*

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: alpha-build-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@675b4f2a51af7e5f2aac58011c7ede0313b2b105
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
      BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_ROLE_ARN }}
      BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_UPLOAD_ROLE_ARN }}
      BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN: ${{ secrets.BUILDCHAIN_ARTIFACT_RELAY_S3_DOWNLOAD_ROLE_ARN }}
    with:
      buildchain-ref: 675b4f2a51af7e5f2aac58011c7ede0313b2b105
      buildchain-contract-expected-channel: alpha
      buildchain-contract-expected-major: v3
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","platform":"linux","runner":"[\"ubuntu-24.04\"]","capabilities":["node","native-toolchain","product-artifacts","rust"],"environment":{"CC":"gcc-14","CXX":"g++-14"}},{"id":"linux-arm64","name":"Linux ARM64","platform":"linux","runner":"[\"ubuntu-24.04-arm\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]},{"id":"macos-arm64","name":"macOS ARM64","platform":"macos","runner":"[\"macos-15\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]},{"id":"windows-x64","name":"Windows x64","platform":"windows","runner":"[\"windows-2022\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]}]
      self-hosted-offline-fallback: false
      install-command: node .github/actions/require-alpha-preflight/windows-alpha-sccache.mjs && node scripts/buildchain-install.mjs
      fail-fast: true
      setup-rust: true
      rust-toolchain: "1.96.0"
      artifact-name: kungfu
      artifact-paths: |
        product/release
        product/dist/cli/kungfu-episodes-cli-linux-x64
      pre-upload-transport-smoke-scenario-path: .buildchain/auditable-demo-transport-smoke.json
      pre-upload-transport-smoke-artifact-root: .
      github-artifact-attestation-subject-path: product/release/cli/kungfu-episodes-cli-linux-x64.tar.gz
      github-artifact-attestation-signer-sha: 375b2d4b8a904776453773a33b4c4e4556c8c999
      github-artifact-attestation-platform-id: linux-x64
      artifact-signing-request-upload-no-proxy: ${{ vars.BUILDCHAIN_ARTIFACT_SIGNING_REQUEST_UPLOAD_NO_PROXY }}
      expected-artifacts-json: >-
        {"minFiles":2,"minTotalBytes":1,"requiredPaths":["product/release/qualification/layer-qualification-summary.json","product/release/qualification/platform-qualification-manifest.json"]}
      require-install: true
      require-build: true
      require-verify: true
      lifecycle-timeout-minutes: 180
      verify-command: node scripts/run-shifu-lifecycle.mjs cache-apply alpha:qualify
      release-candidate: true
      publish-channel: alpha
      artifact-transfer-mode: s3-to-github-artifacts
      artifact-retention-days: 14
      checkout-cache-mode: "off"
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      checkout-history-mode: full
      checkout-cache-github-timeout-seconds: 1200
      shifu-cache-profile-ref: docs/shifu/windows-alpha-sccache.cache-profile.json
      shifu-cache-profile-digest: sha256:581c430b959c0b45272031cad85a3fae740a6398abf7c1051d1d43b098ee0adb
      compiler-cache-provider: sccache
      compiler-cache-platforms-json: '["windows-x64"]'
      compiler-cache-required: true
      buildchain-contract-lock-path: .buildchain/alpha-contract-lock.json
      buildchain-contract-compatibility-policy: major-compatible
