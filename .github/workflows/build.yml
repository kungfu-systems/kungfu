# SPDX-License-Identifier: Apache-2.0

name: Build

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - alpha/v*/v*
      - release/v*/v*
  # Manual runs validate lifecycle changes (e.g. the ./shifu entrypoint
  # switch) on the full platform matrix without waiting for an alpha PR.
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain train or exact SHA for trusted manual validation"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@b0733e799eeb1c44caccd6da92ebae4646a1bde4
    secrets: inherit
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || '' }}
      runner-preset: kungfu-v4-self-hosted
      setup-rust: true
      rust-toolchain: "1.95.0"
      rustup-dist-server: https://rsproxy.cn
      rustup-update-root: https://rsproxy.cn/rustup
      cargo-registry-index: ${{ vars.BUILDCHAIN_CARGO_REGISTRY_INDEX }}
      artifact-name: kungfu
      artifact-paths: |
        product/release
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":1}
      require-install: true
      require-build: true
      require-verify: true
      # This workflow only fires on alpha/release PRs, so it is the recurring
      # heavy gate (kungfu has no nightly). Override the default lifecycle verify
      # (.buildchain/buildchain.toml runs quick `verify`) with the kungfu::view
      # memory-safety long-run: `--fuzz` adds the libFuzzer stage over the three
      # FlatBuffers access entries under ASan/UBSan (ADR-0039 residual risk); a
      # new crash fails verify and blocks the alpha. The ASan/UBSan corpus-replay
      # tier runs on every platform (MSVC /fsanitize=address on Windows); the
      # libFuzzer long-run is the Linux gate and soft-skips where libFuzzer is
      # absent. KUNGFU_FUZZ_SECONDS bounds the per-target run.
      #
      # Wrapped in `bash -c`: an explicit verify-command runs under the
      # platform default shell (cmd.exe on Windows) and does not inherit the
      # lifecycle stage's shell or [lifecycle.env], so the shell and the env
      # are inlined here to match the .buildchain/buildchain.toml stages.
      verify-command: >-
        bash -c "KUNGFU_BUILDCHAIN_NO_OPTIONAL=1 KUNGFU_BUILDCHAIN_SOURCE_BUILD=1
        SHIFU_NATIVE=1 SHIFU_REQUIRE_MSVC=1 KUNGFU_FUZZ_SECONDS=90
        ./shifu verify --fuzz &&
        ./shifu episode:qualify:release -- --output
        product/release/qualification/episode-release-evidence.json"
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'release/') && 'release' || 'alpha' }}
      artifact-transfer-mode: s3-to-github-artifacts
      artifact-retention-days: 14
      checkout-cache-mode: auto
      checkout-cache-mirror-url-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_MIRROR_URL_TEMPLATE }}
      checkout-cache-reference-repository-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_REFERENCE_REPOSITORY_TEMPLATE }}
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
