# SPDX-License-Identifier: Apache-2.0

name: Dev PR Auto Merge

on:
  workflow_run:
    workflows:
      - Core affected native
    types:
      - completed
  schedule:
    # Recovery patrol for ready PRs whose final signal did not emit a usable event.
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      expected-pr-number:
        description: Exact PR number for targeted Agent admission; 0 runs a cadence patrol
        required: false
        type: number
        default: 0
      expected-head-sha:
        description: Exact 40-character PR head for targeted Agent admission
        required: false
        type: string
        default: ""
      dry-run:
        description: Evaluate eligible PRs without admitting them to the merge queue
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-pr-auto-merge-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  resolve-target:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      target-branch: ${{ steps.target.outputs.target-branch }}
      expected-pr-number: ${{ steps.target.outputs.expected-pr-number }}
      expected-head-sha: ${{ steps.target.outputs.expected-head-sha }}
    steps:
      - name: Resolve the active dev channel and exact PR target
        id: target
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DISPATCH_PR_NUMBER: ${{ inputs.expected-pr-number }}
          DISPATCH_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: |
          set -euo pipefail
          case "$DEFAULT_BRANCH" in
            dev/v*/v*) ;;
            *)
              echo "repository default branch is not a dev channel: $DEFAULT_BRANCH" >&2
              exit 1
              ;;
          esac

          expected_pr_number=""
          expected_head_sha=""
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_EVENT" = "pull_request" ]; then
            pr_count="$(jq -r 'if type == "array" then length else -1 end' <<<"$WORKFLOW_PULL_REQUESTS")"
            if [ "$pr_count" != "1" ]; then
              echo "workflow_run must resolve to exactly one pull request; got: $pr_count" >&2
              exit 1
            fi
            expected_pr_number="$(jq -r '.[0].number' <<<"$WORKFLOW_PULL_REQUESTS")"
            expected_head_sha="$WORKFLOW_HEAD_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_pr_number="${DISPATCH_PR_NUMBER:-0}"
            expected_head_sha="$DISPATCH_HEAD_SHA"
            if { [ "$expected_pr_number" = "0" ] && [ -n "$expected_head_sha" ]; } ||
              { [ "$expected_pr_number" != "0" ] && [ -z "$expected_head_sha" ]; }; then
              echo "expected-pr-number and expected-head-sha must be provided together" >&2
              exit 1
            fi
            if [ "$expected_pr_number" = "0" ]; then
              expected_pr_number=""
            fi
          fi

          if [ -n "$expected_pr_number" ]; then
            case "$expected_pr_number" in
              *[!0-9]*|0) echo "expected PR number must be a positive integer" >&2; exit 1 ;;
            esac
            if [ "${#expected_head_sha}" -ne 40 ]; then
              echo "expected head must be an exact lowercase 40-character commit SHA" >&2
              exit 1
            fi
            case "$expected_head_sha" in
              *[!0-9a-f]*)
                echo "expected head must be an exact lowercase 40-character commit SHA" >&2
                exit 1
                ;;
            esac
          fi

          echo "target-branch=$DEFAULT_BRANCH" >>"$GITHUB_OUTPUT"
          echo "expected-pr-number=$expected_pr_number" >>"$GITHUB_OUTPUT"
          echo "expected-head-sha=$expected_head_sha" >>"$GITHUB_OUTPUT"

  delivery-contract:
    needs: resolve-target
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      assignment-root: ${{ steps.contract.outputs.assignment-root }}
      initiative-root: ${{ steps.contract.outputs.initiative-root }}
      source-identity-root: ${{ steps.contract.outputs.source-identity-root }}
      source-patch-root: ${{ steps.contract.outputs.source-patch-root }}
      plan-root: ${{ steps.contract.outputs.plan-root }}
      closure-root: ${{ steps.contract.outputs.closure-root }}
      dependency-root: ${{ steps.contract.outputs.dependency-root }}
      toolchain-root: ${{ steps.contract.outputs.toolchain-root }}
      affected-paths-json: ${{ steps.contract.outputs.affected-paths-json }}
      shard-evidence-roots-json: ${{ steps.contract.outputs.shard-evidence-roots-json }}
      delivery-class: ${{ steps.contract.outputs.delivery-class }}
      priority: ${{ steps.contract.outputs.priority }}
      input-root: ${{ steps.contract.outputs.input-root }}
    steps:
      - name: Check out protected consumer adapter
        if: >-
          github.event_name == 'workflow_run' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact source qualification descriptor
        if: >-
          github.event_name == 'workflow_run' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-affected-native-proof-descriptor-${{ github.event.workflow_run.id }}
          path: .buildchain/dev-delivery-input
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Project Buildchain Warrant inputs
        id: contract
        if: >-
          github.event_name == 'workflow_run' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > .buildchain/dev-delivery-input/pull-request.json
          test "$EXPECTED_HEAD" = "$(jq -r '.head.sha' .buildchain/dev-delivery-input/pull-request.json)"
          # shifu-entry-contract: allow source-only Warrant input projection before Gate dependencies are runnable
          node scripts/dev-delivery-warrant-input.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request .buildchain/dev-delivery-input/pull-request.json \
            --descriptor .buildchain/dev-delivery-input/descriptor.json \
            --plan .buildchain/dev-delivery-input/plan.json \
            --output .buildchain/dev-delivery-input/warrant-input.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload exact Warrant input projection
        if: steps.contract.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-delivery-warrant-input-${{ needs.resolve-target.outputs.expected-head-sha }}
          path: .buildchain/dev-delivery-input/
          if-no-files-found: error
          retention-days: 30

  admission:
    needs:
      - resolve-target
      - delivery-contract
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: write
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@4f491a61dd2a4ba127ddbb8d67c6b51a903b1567
    with:
      buildchain-ref: 4f491a61dd2a4ba127ddbb8d67c6b51a903b1567
      target-branch: ${{ needs.resolve-target.outputs.target-branch }}
      expected-pr-number: ${{ fromJSON(needs.resolve-target.outputs.expected-pr-number || '0') }}
      expected-head-sha: ${{ needs.resolve-target.outputs.expected-head-sha }}
      diagnostic-context: Buildchain delivery intent
      delivery-warrant-mode: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)) && 'required' || 'off' }}
      assignment-root: ${{ needs.delivery-contract.outputs.assignment-root }}
      initiative-root: ${{ needs.delivery-contract.outputs.initiative-root }}
      source-identity-root: ${{ needs.delivery-contract.outputs.source-identity-root }}
      source-patch-root: ${{ needs.delivery-contract.outputs.source-patch-root }}
      plan-root: ${{ needs.delivery-contract.outputs.plan-root }}
      closure-root: ${{ needs.delivery-contract.outputs.closure-root }}
      dependency-root: ${{ needs.delivery-contract.outputs.dependency-root }}
      toolchain-root: ${{ needs.delivery-contract.outputs.toolchain-root }}
      affected-paths-json: ${{ needs.delivery-contract.outputs.affected-paths-json || '[]' }}
      shard-evidence-roots-json: ${{ needs.delivery-contract.outputs.shard-evidence-roots-json || '[]' }}
      delivery-class: ${{ needs.delivery-contract.outputs.delivery-class || 'native-proof-required' }}
      delivery-priority: ${{ needs.delivery-contract.outputs.priority || 'ordinary' }}
      warrant-lease-seconds: 5400
      required-status-checks: |-
        Candidate source acceptance / check
        affected-native / linux
      queue-admission-context: Queue admission lease
      ready-label: state/ready
      block-labels: state/blocked,blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/
      require-approval: true
      same-repository-only: true
      max-merges: 1
      merge-method: rebase
      landing-mode: queue
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets:
      github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
