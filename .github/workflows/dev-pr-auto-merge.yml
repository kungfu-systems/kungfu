# SPDX-License-Identifier: Apache-2.0

name: Dev PR Auto Merge

on:
  repository_dispatch:
    types: [buildchain-dev-delivery-wake]
  workflow_run:
    workflows:
      - Core affected native
    types:
      - completed
  pull_request_target:
    branches:
      - dev/v*/v*
    types: [labeled, unlabeled, ready_for_review]
  pull_request_review:
    branches:
      - dev/v*/v*
    types: [submitted, dismissed]
  schedule:
    # Recovery patrol for ready PRs whose final signal did not emit a usable event.
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      expected-pr-number:
        description: Exact PR number for targeted Agent admission; 0 runs a cadence patrol
        required: false
        type: number
        default: 0
      expected-head-sha:
        description: Exact 40-character PR head for targeted Agent admission
        required: false
        type: string
        default: ""
      source-workflow-run-id:
        description: Exact source-accepted Core affected native run that produced the source descriptor
        required: false
        type: number
        default: 0
      dry-run:
        description: Evaluate eligible PRs without admitting them to the merge queue
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-pr-auto-merge-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  resolve-target:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target-branch: ${{ steps.target.outputs.target-branch }}
      expected-pr-number: ${{ steps.target.outputs.expected-pr-number }}
      expected-head-sha: ${{ steps.target.outputs.expected-head-sha }}
      source-workflow-run-id: ${{ steps.target.outputs.source-workflow-run-id }}
    steps:
      - name: Resolve the active dev channel and exact PR target
        id: target
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          DISPATCH_PR_NUMBER: ${{ inputs.expected-pr-number }}
          DISPATCH_HEAD_SHA: ${{ inputs.expected-head-sha }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source-workflow-run-id }}
          DISPATCH_DRY_RUN: ${{ inputs.dry-run }}
          WAKE_TARGET_BRANCH: ${{ github.event.client_payload.candidate.targetBranch }}
          WAKE_PR_NUMBER: ${{ github.event.client_payload.candidate.pullRequestNumber }}
          WAKE_HEAD_SHA: ${{ github.event.client_payload.candidate.sourceHead }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$DEFAULT_BRANCH" in
            dev/v*/v*) ;;
            *)
              echo "repository default branch is not a dev channel: $DEFAULT_BRANCH" >&2
              exit 1
              ;;
          esac

          expected_pr_number=""
          expected_head_sha=""
          source_workflow_run_id=""
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_EVENT" = "pull_request" ]; then
            pr_count="$(jq -r 'if type == "array" then length else -1 end' <<<"$WORKFLOW_PULL_REQUESTS")"
            if [ "$pr_count" != "1" ]; then
              echo "workflow_run must resolve to exactly one pull request; got: $pr_count" >&2
              exit 1
            fi
            expected_pr_number="$(jq -r '.[0].number' <<<"$WORKFLOW_PULL_REQUESTS")"
            expected_head_sha="$WORKFLOW_HEAD_SHA"
            source_workflow_run_id="$WORKFLOW_RUN_ID"
          elif [ "$EVENT_NAME" = "pull_request_target" ] || [ "$EVENT_NAME" = "pull_request_review" ]; then
            expected_pr_number="$EVENT_PR_NUMBER"
            expected_head_sha="$EVENT_PR_HEAD_SHA"
            source_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/affected-native-pr.yml/runs" \
              -f head_sha="$expected_head_sha" \
              -f event=pull_request \
              -f status=completed \
              -f per_page=100)"
            source_workflow_run_id="$(jq -er \
              --argjson pullRequest "$expected_pr_number" \
              --arg head "$expected_head_sha" \
              '[.workflow_runs[]
                | select(.head_sha == $head)
                | select(any(.pull_requests[]?; .number == $pullRequest))]
               | sort_by(.id) | last | .id' <<<"$source_runs")"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$WAKE_TARGET_BRANCH" != "$DEFAULT_BRANCH" ]; then
              echo "wake target branch does not match the protected default branch" >&2
              exit 1
            fi
            expected_pr_number="$WAKE_PR_NUMBER"
            expected_head_sha="$WAKE_HEAD_SHA"
            source_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/affected-native-pr.yml/runs" \
              -f head_sha="$expected_head_sha" \
              -f event=pull_request \
              -f status=completed \
              -f per_page=100)"
            source_workflow_run_id="$(jq -er \
              --argjson pullRequest "$expected_pr_number" \
              --arg head "$expected_head_sha" \
              '[.workflow_runs[]
                | select(.head_sha == $head)
                | select(any(.pull_requests[]?; .number == $pullRequest))]
               | sort_by(.id) | last | .id' <<<"$source_runs")"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_pr_number="${DISPATCH_PR_NUMBER:-0}"
            expected_head_sha="$DISPATCH_HEAD_SHA"
            source_workflow_run_id="${DISPATCH_SOURCE_RUN_ID:-0}"
            if { [ "$expected_pr_number" = "0" ] && [ -n "$expected_head_sha" ]; } ||
              { [ "$expected_pr_number" != "0" ] && [ -z "$expected_head_sha" ]; }; then
              echo "expected-pr-number and expected-head-sha must be provided together" >&2
              exit 1
            fi
            if [ "$expected_pr_number" = "0" ]; then
              expected_pr_number=""
              if [ "$source_workflow_run_id" != "0" ]; then
                echo "source-workflow-run-id requires an exact targeted PR and head" >&2
                exit 1
              fi
            elif [ "$DISPATCH_DRY_RUN" = "false" ] && [ "$source_workflow_run_id" = "0" ]; then
              echo "executing targeted admission requires source-workflow-run-id" >&2
              exit 1
            fi
            if [ "$source_workflow_run_id" = "0" ]; then
              source_workflow_run_id=""
            fi
          fi

          if [ -n "$expected_pr_number" ]; then
            case "$expected_pr_number" in
              *[!0-9]*|0) echo "expected PR number must be a positive integer" >&2; exit 1 ;;
            esac
            if [ "${#expected_head_sha}" -ne 40 ]; then
              echo "expected head must be an exact lowercase 40-character commit SHA" >&2
              exit 1
            fi
            case "$expected_head_sha" in
              *[!0-9a-f]*)
                echo "expected head must be an exact lowercase 40-character commit SHA" >&2
                exit 1
                ;;
            esac
          fi
          if [ -n "$source_workflow_run_id" ]; then
            case "$source_workflow_run_id" in
              *[!0-9]*|0) echo "source workflow run ID must be a positive integer" >&2; exit 1 ;;
            esac
          fi

          {
            echo "target-branch=$DEFAULT_BRANCH"
            echo "expected-pr-number=$expected_pr_number"
            echo "expected-head-sha=$expected_head_sha"
            echo "source-workflow-run-id=$source_workflow_run_id"
          } >>"$GITHUB_OUTPUT"

  delivery-contract:
    needs: resolve-target
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      KUNGFU_FNM_DIST_MIRROR: ${{ vars.KUNGFU_FNM_DIST_MIRROR }}
      KUNGFU_FNM_SHA256: ${{ vars.KUNGFU_FNM_SHA256 }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      assignment-root: ${{ steps.contract.outputs.assignment-root }}
      initiative-root: ${{ steps.contract.outputs.initiative-root }}
      source-identity-root: ${{ steps.contract.outputs.source-identity-root }}
      source-patch-root: ${{ steps.contract.outputs.source-patch-root }}
      plan-root: ${{ steps.contract.outputs.plan-root }}
      closure-root: ${{ steps.contract.outputs.closure-root }}
      dependency-root: ${{ steps.contract.outputs.dependency-root }}
      toolchain-root: ${{ steps.contract.outputs.toolchain-root }}
      environment-root: ${{ steps.environment.outputs.environment-root }}
      affected-paths-json: ${{ steps.contract.outputs.affected-paths-json }}
      shard-evidence-roots-json: ${{ steps.contract.outputs.shard-evidence-roots-json }}
      delivery-class: ${{ steps.contract.outputs.delivery-class }}
      priority: ${{ steps.contract.outputs.priority }}
      input-root: ${{ steps.contract.outputs.input-root }}
      project-cut-proof-json: ${{ steps.project-cut.outputs.project-cut-proof-json }}
      active-lease-context: ${{ steps.contract.outputs.active-lease-context }}
      native-proof-json: ${{ steps.native-proof.outputs.native-proof-json }}
    steps:
      - name: Check out protected consumer adapter
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Buildchain delivery runtime
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: 4dabecd7056e168f7345d460e3729465a932db9c
          path: .buildchain/dev-delivery-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 24 for exact delivery proof
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install exact Buildchain delivery runtime
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        working-directory: .buildchain/dev-delivery-runtime
        shell: bash
        # shifu-entry-contract: allow bootstrapping the separately checked-out exact Buildchain runtime
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify exact source qualification run
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve-target.outputs.source-workflow-run-id }}
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
        run: |
          set -euo pipefail
          mkdir -p .buildchain/dev-delivery-input
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > .buildchain/dev-delivery-input/source-workflow-run.json
          jq -e \
            --argjson run "$SOURCE_RUN_ID" \
            --argjson pullRequest "$EXPECTED_PR" \
            --arg head "$EXPECTED_HEAD" \
            '.id == $run
             and .name == "Core affected native"
             and .path == ".github/workflows/affected-native-pr.yml"
             and .event == "pull_request"
             and .status == "completed"
             and .head_sha == $head
             and (.pull_requests | length) == 1
             and .pull_requests[0].number == $pullRequest' \
            .buildchain/dev-delivery-input/source-workflow-run.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > .buildchain/dev-delivery-input/source-workflow-jobs.json
          jq -e \
            '[.jobs[]
              | select(.name == "Candidate source acceptance / check")
              | select(.status == "completed" and .conclusion == "success")]
             | length == 1' \
            .buildchain/dev-delivery-input/source-workflow-jobs.json >/dev/null

      - name: Download exact source qualification descriptor
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-affected-native-proof-descriptor-${{ needs.resolve-target.outputs.source-workflow-run-id }}
          path: .buildchain/dev-delivery-input
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-target.outputs.source-workflow-run-id }}
          github-token: ${{ github.token }}

      - name: Project Buildchain Warrant inputs
        id: contract
        if: >-
          needs.resolve-target.outputs.source-workflow-run-id != '' &&
          needs.resolve-target.outputs.expected-pr-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > .buildchain/dev-delivery-input/pull-request.json
          test "$EXPECTED_HEAD" = "$(jq -r '.head.sha' .buildchain/dev-delivery-input/pull-request.json)"
          # shifu-entry-contract: allow source-only Warrant input projection before Gate dependencies are runnable
          node scripts/dev-delivery-warrant-input.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request .buildchain/dev-delivery-input/pull-request.json \
            --descriptor .buildchain/dev-delivery-input/descriptor.json \
            --plan .buildchain/dev-delivery-input/plan.json \
            --output .buildchain/dev-delivery-input/warrant-input.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Bind exact hosted native environment
        id: environment
        if: steps.contract.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Derive the environment contract from the protected proof descriptor,
          # without executing candidate code before Warrant admission.
          # shifu-entry-contract: allow dependency-free protected descriptor rooting during workflow bootstrap
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { digest } from './scripts/affected-native-proof.mjs';

          const descriptor = JSON.parse(
            fs.readFileSync('.buildchain/dev-delivery-input/descriptor.json', 'utf8'),
          );
          const environmentRoot = digest({
            schema: 'kungfu.github-hosted-native-environment/v1',
            platformTier: descriptor.identity.platformTier,
            toolchain: descriptor.identity.toolchain,
          });
          if (!/^sha256:[0-9a-f]{64}$/u.test(environmentRoot)) {
            throw new Error('hosted native environment root is invalid');
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `environment-root=${environmentRoot}\n`,
          );
          // shifu-entry-contract: allow the dependency-free rooting heredoc terminator
          NODE

      - name: Resolve optional exact native proof artifact
        id: native-proof-artifact
        if: steps.contract.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve-target.outputs.source-workflow-run-id }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
        run: |
          set -euo pipefail
          artifact_name="core-dev-delivery-source-proof-$EXPECTED_HEAD"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          match_count="$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<<"$artifacts")"
          if [ "$match_count" -gt 1 ]; then
            echo "multiple exact native proof artifacts found for $EXPECTED_HEAD" >&2
            exit 1
          fi
          if [ "$match_count" = "0" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .buildchain/dev-delivery-input/source-native-proof
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir .buildchain/dev-delivery-input/source-native-proof
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Materialize optional reusable semantic native proof
        id: native-proof
        if: steps.native-proof-artifact.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
          TARGET_BRANCH: ${{ needs.resolve-target.outputs.target-branch }}
        run: |
          set -euo pipefail
          artifact=.buildchain/dev-delivery-input/source-native-proof
          source_proof="$artifact/proof.json"
          coordinate="$artifact/coordinate.json"
          warrant_input=.buildchain/dev-delivery-input/warrant-input.json

          # Source qualification is not native-execution authority. A reusable
          # Native Qualification Proof v3 must bind the exact environment before
          # process spawn through a Buildchain native execution receipt. Older
          # source artifacts cannot supply that receipt, so they fail closed to
          # the reusable controller's fenced full-native path.
          if [ ! -f "$source_proof" ] || [ ! -f "$coordinate" ]; then
            echo "native-proof-json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --argjson pullRequest "$EXPECTED_PR" \
            --arg head "$EXPECTED_HEAD" \
            '.schema == "kungfu.dev-delivery-source-coordinate/v1"
             and .repository == $repository
             and .protectedBase == $branch
             and .pullRequestNumber == $pullRequest
             and .sourceHeadSha == $head
             and (.sourceBaseSha | test("^[0-9a-f]{40}$"))
             and (.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))' \
            "$coordinate" >/dev/null
          # shifu-entry-contract: allow exact pinned Buildchain Source Proof verification in protected CI
          node .buildchain/dev-delivery-runtime/scripts/dev-delivery-proof.mjs verify-source \
            --source-proof "$source_proof" \
            --output .buildchain/dev-delivery-input/source-proof-verification.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --arg head "$EXPECTED_HEAD" \
            --slurpfile input "$warrant_input" \
            '.repository == $repository
             and .protectedBase == $branch
             and .sourceHead == $head
             and .sourceIdentityRoot == $input[0].sourceIdentityRoot
             and .sourcePatchRoot == $input[0].sourcePatchRoot
             and .planRoot == $input[0].planRoot
             and .closureRoot == $input[0].closureRoot
             and .dependencyRoot == $input[0].dependencyRoot
             and .toolchainRoot == $input[0].toolchainRoot
             and .affectedPaths == $input[0].affectedPaths' \
            "$source_proof" >/dev/null
          echo "native-proof-json=" >> "$GITHUB_OUTPUT"

      - name: Produce exact Project Cut replay proof
        id: project-cut
        if: steps.contract.outcome == 'success'
        shell: bash
        env:
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
          TARGET_BRANCH: ${{ needs.resolve-target.outputs.target-branch }}
        run: |
          set -euo pipefail
          pull_request=.buildchain/dev-delivery-input/pull-request.json
          warrant_input=.buildchain/dev-delivery-input/warrant-input.json
          qualification=.buildchain/dev-delivery-input/project-cut-qualification.json
          qualification_output=.buildchain/dev-delivery-input/project-cut-qualification.log
          proof=.buildchain/dev-delivery-input/project-cut-proof.json

          test "$GITHUB_REPOSITORY" = "$(jq -r '.head.repo.full_name' "$pull_request")"
          test "$TARGET_BRANCH" = "$(jq -r '.base.ref' "$pull_request")"
          test "$EXPECTED_HEAD" = "$(jq -r '.head.sha' "$pull_request")"
          current_base="$(git rev-parse 'HEAD^{commit}')"
          remote_base="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk 'NR == 1 { print $1 }')"
          test "${#remote_base}" -eq 40
          test "$current_base" = "$remote_base"
          git fetch --no-tags origin "$EXPECTED_HEAD"
          test "$EXPECTED_HEAD" = "$(git rev-parse "$EXPECTED_HEAD^{commit}")"

          ./shifu project-cut:queue-admission -- \
            --base "$current_base" \
            --head "$EXPECTED_HEAD" \
            | tee "$qualification_output"
          tail -n 1 "$qualification_output" > "$qualification"
          jq -e \
            --arg base "$current_base" \
            --arg head "$EXPECTED_HEAD" \
            '.schema == "project.cut.merge-queue-admission/v1"
             and .ok == true
             and .decision == "qualified"
             and .baseCommitOid == $base
             and .headCommitOid == $head
             and (.reasonCodes | length) == 0' \
            "$qualification" >/dev/null

          context_roots="$(jq -c '[.inputRoot, .sourcePatchRoot] + .shardEvidenceRoots | unique | sort' "$warrant_input")"
          # shifu-entry-contract: allow invoking the separately checked-out exact Buildchain proof runtime
          node .buildchain/dev-delivery-runtime/scripts/dev-delivery-proof.mjs replay-proof \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$TARGET_BRANCH" \
            --pull-request "$EXPECTED_PR" \
            --source-head "$EXPECTED_HEAD" \
            --source-patch-root "$(jq -r '.sourcePatchRoot' "$warrant_input")" \
            --current-base "$current_base" \
            --replay-tree "$(jq -r '.candidateTreeOid' "$qualification")" \
            --qualification-receipt "$qualification" \
            --required-context-roots-json "$context_roots" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$proof"
          # shifu-entry-contract: allow invoking the separately checked-out exact Buildchain proof runtime
          node .buildchain/dev-delivery-runtime/scripts/dev-delivery-proof.mjs verify-replay \
            --source-proof "$proof" \
            --output .buildchain/dev-delivery-input/project-cut-verification.json
          {
            echo 'project-cut-proof-json<<BUILDCHAIN_PROJECT_CUT_EOF'
            jq -c . "$proof"
            echo 'BUILDCHAIN_PROJECT_CUT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact Warrant input projection
        if: steps.contract.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-delivery-warrant-input-${{ needs.resolve-target.outputs.expected-head-sha }}
          path: .buildchain/dev-delivery-input/
          if-no-files-found: error
          retention-days: 30

  admission:
    needs:
      - resolve-target
      - delivery-contract
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: write
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@4dabecd7056e168f7345d460e3729465a932db9c
    with:
      buildchain-ref: 4dabecd7056e168f7345d460e3729465a932db9c
      target-branch: ${{ needs.resolve-target.outputs.target-branch }}
      expected-pr-number: ${{ fromJSON(needs.resolve-target.outputs.expected-pr-number || '0') }}
      expected-head-sha: ${{ needs.resolve-target.outputs.expected-head-sha }}
      source-workflow-run-id: ${{ fromJSON(needs.resolve-target.outputs.source-workflow-run-id || '0') }}
      handoff-workflow-id: dev-pr-auto-merge.yml
      source-workflow-id: affected-native-pr.yml
      diagnostic-context: Buildchain delivery intent
      delivery-warrant-mode: ${{ (github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch' || github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)) && 'required' || 'off' }}
      assignment-root: ${{ needs.delivery-contract.outputs.assignment-root }}
      initiative-root: ${{ needs.delivery-contract.outputs.initiative-root }}
      source-identity-root: ${{ needs.delivery-contract.outputs.source-identity-root }}
      source-patch-root: ${{ needs.delivery-contract.outputs.source-patch-root }}
      project-cut-proof-json: ${{ needs.delivery-contract.outputs.project-cut-proof-json }}
      plan-root: ${{ needs.delivery-contract.outputs.plan-root }}
      closure-root: ${{ needs.delivery-contract.outputs.closure-root }}
      dependency-root: ${{ needs.delivery-contract.outputs.dependency-root }}
      toolchain-root: ${{ needs.delivery-contract.outputs.toolchain-root }}
      environment-root: ${{ needs.delivery-contract.outputs.environment-root }}
      affected-paths-json: ${{ needs.delivery-contract.outputs.affected-paths-json || '[]' }}
      shard-evidence-roots-json: ${{ needs.delivery-contract.outputs.shard-evidence-roots-json || '[]' }}
      native-proof-json: ${{ needs.delivery-contract.outputs.native-proof-json }}
      native-command: >-
        KUNGFU_FNM_DIST_MIRROR=${{ vars.KUNGFU_FNM_DIST_MIRROR }}
        KUNGFU_FNM_SHA256=${{ vars.KUNGFU_FNM_SHA256 }}
        ./shifu dev-delivery:native-under-warrant --
        --repository ${{ github.repository }}
        --target-branch ${{ needs.resolve-target.outputs.target-branch }}
        --pull-request ${{ needs.resolve-target.outputs.expected-pr-number }}
        --expected-head ${{ needs.resolve-target.outputs.expected-head-sha }}
        --status-context 'affected-native / linux'
        --output ../dev-delivery/kungfu-native-receipt.json
      native-heartbeat-seconds: 300
      delivery-class: ${{ needs.delivery-contract.outputs.delivery-class || 'native-proof-required' }}
      delivery-priority: ${{ needs.delivery-contract.outputs.priority || 'ordinary' }}
      warrant-lease-seconds: 5400
      required-status-checks: |-
        Candidate source acceptance / check
      queue-admission-context: Queue admission lease
      active-lease-context: ${{ needs.delivery-contract.outputs.active-lease-context }}
      ready-label: state/ready
      block-labels: state/blocked,blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/
      require-approval: true
      same-repository-only: true
      max-merges: 1
      merge-method: rebase
      landing-mode: queue
      # Qualification must finish before the GitHub Actions-owned source run
      # can be retried under its exact active Warrant. The second reusable call
      # below owns landing only after that native retry is read back.
      defer-landing: true
      dry-run: false
    secrets:
      github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}

  native-check-bridge:
    name: Requalify source CheckRun under Warrant
    needs:
      - resolve-target
      - admission
    if: >-
      needs.admission.result == 'success' &&
      needs.resolve-target.outputs.expected-pr-number != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry-run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    outputs:
      check-run-id: ${{ steps.publish.outputs.check-run-id }}
      receipt-root: ${{ steps.publish.outputs.receipt-root }}
      source-run-attempt: ${{ steps.publish.outputs.source-run-attempt }}
    steps:
      - name: Download exact qualified Warrant evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: buildchain-dev-delivery-warrant-*-${{ needs.resolve-target.outputs.expected-pr-number }}
          path: .buildchain/native-check-bridge/warrant
          merge-multiple: true

      - name: Re-run failed source jobs under the qualified Warrant
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ needs.resolve-target.outputs.expected-pr-number }}
          EXPECTED_HEAD: ${{ needs.resolve-target.outputs.expected-head-sha }}
          SOURCE_RUN_ID: ${{ needs.resolve-target.outputs.source-workflow-run-id }}
          TARGET_BRANCH: ${{ needs.resolve-target.outputs.target-branch }}
        run: |
          set -euo pipefail
          evidence=.buildchain/native-check-bridge/warrant
          warrant="$evidence/warrant.json"
          test -f "$warrant"

          live_pr="$evidence/live-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR" > "$live_pr"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --argjson pullRequest "$EXPECTED_PR" \
            --arg head "$EXPECTED_HEAD" \
            --argjson sourceRun "$SOURCE_RUN_ID" \
            '.schema == "kungfu.buildchain.dev-delivery-command-result/v1"
             and .mode == "execute"
             and (.after.commitSha | test("^[0-9a-f]{40}$"))
             and (.after.stateRoot | test("^sha256:[0-9a-f]{64}$"))
             and .after.stateRoot == .observation.stateRoot
             and .warrant == .observation.activeWarrant
             and .observation.activeCandidate.candidateId == .warrant.candidateId
             and .warrant.schema == "kungfu.buildchain.dev-delivery-warrant/v1"
             and .warrant.repository == $repository
             and .warrant.protectedBase == $branch
             and .warrant.pullRequestNumber == $pullRequest
             and .warrant.sourceHead == $head
             and .warrant.sourceWorkflowRunId == $sourceRun
             and .warrant.phase == "qualified"
             and (.warrant.fencingToken | test("^sha256:[0-9a-f]{64}$"))
             and (.warrant.nativeProofRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.warrant.nativeProofReuseRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.receiptRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.warrant.expiresAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) > now' \
            "$warrant" >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --arg head "$EXPECTED_HEAD" \
            '.head.repo.full_name == $repository
             and .head.sha == $head
             and .base.ref == $branch
             and .state == "open"' \
            "$live_pr" >/dev/null

          native_root="$(jq -er '.warrant.nativeProofRoot' "$warrant")"
          qualification_root="$(jq -er '.receiptRoot' "$warrant")"
          state_root="$(jq -er '.after.stateRoot' "$warrant")"
          state_commit="$(jq -er '.after.commitSha' "$warrant")"
          source_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/job/"
          source_run_prior="$evidence/source-workflow-run-prior.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$source_run_prior"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$EXPECTED_HEAD" \
            --argjson sourceRun "$SOURCE_RUN_ID" \
            '.id == $sourceRun
             and .name == "Core affected native"
             and .path == ".github/workflows/affected-native-pr.yml"
             and .event == "pull_request"
             and .head_repository.full_name == $repository
             and .head_sha == $head
             and .status == "completed"
             and (.conclusion == "failure" or .conclusion == "success")
             and (.run_attempt | type == "number" and . >= 1)' \
            "$source_run_prior" >/dev/null

          source_checks="$evidence/source-check-runs.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?check_name=affected-native%20%2F%20linux&filter=latest&per_page=100" \
            > "$source_checks"
          source_check_prior="$evidence/source-check-run-prior.json"
          jq -e \
            --arg head "$EXPECTED_HEAD" \
            --arg sourceRunUrl "$source_run_url" \
            '[.check_runs[]
              | select(.name == "affected-native / linux")
              | select(.head_sha == $head)
              | select(.app.id == 15368)
              | select(.details_url | startswith($sourceRunUrl))]
             | select(length == 1)
             | .[0]
             | select(.status == "completed")
             | select(.conclusion == "failure" or .conclusion == "success")' \
            "$source_checks" > "$source_check_prior"

          prior_attempt="$(jq -er '.run_attempt' "$source_run_prior")"
          prior_run_conclusion="$(jq -er '.conclusion' "$source_run_prior")"
          prior_check_run_id="$(jq -er '.id' "$source_check_prior")"
          prior_check_conclusion="$(jq -er '.conclusion' "$source_check_prior")"
          rerun_triggered=false
          expected_attempt="$prior_attempt"
          source_run="$source_run_prior"
          if [ "$prior_run_conclusion" = "failure" ]; then
            if [ "$prior_check_conclusion" != "failure" ]; then
              echo "failed source run does not expose the expected failed native CheckRun" >&2
              exit 1
            fi
            if [ "$prior_attempt" != "1" ]; then
              echo "qualified Warrant source bridge permits exactly one retry from the initial source attempt; observed attempt: $prior_attempt" >&2
              exit 1
            fi
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs" \
              >/dev/null
            rerun_triggered=true
            expected_attempt="$((prior_attempt + 1))"
            source_run="$evidence/source-workflow-run.json"
            completed=false
            for _ in $(seq 1 100); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$source_run"
              observed_attempt="$(jq -er '.run_attempt' "$source_run")"
              observed_status="$(jq -er '.status' "$source_run")"
              if [ "$observed_attempt" -gt "$expected_attempt" ]; then
                echo "source workflow advanced beyond the single authorized retry" >&2
                exit 1
              fi
              if [ "$observed_attempt" = "$expected_attempt" ] && [ "$observed_status" = "completed" ]; then
                completed=true
                break
              fi
              sleep 30
            done
            if [ "$completed" != "true" ]; then
              echo "source workflow retry did not complete within the bounded wait" >&2
              exit 1
            fi
          fi

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$EXPECTED_HEAD" \
            --argjson sourceRun "$SOURCE_RUN_ID" \
            --argjson expectedAttempt "$expected_attempt" \
            '.id == $sourceRun
             and .name == "Core affected native"
             and .path == ".github/workflows/affected-native-pr.yml"
             and .event == "pull_request"
             and .head_repository.full_name == $repository
             and .head_sha == $head
             and .run_attempt == $expectedAttempt
             and .status == "completed"
             and .conclusion == "success"' \
            "$source_run" >/dev/null

          source_jobs="$evidence/source-workflow-jobs.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$source_jobs"
          jq -e \
            '[.jobs[] | select(.name == "Provisional Delivery Warrant admission / linux")]
             | select(length == 1)
             | .[0]
             | select(.status == "completed" and .conclusion == "success")' \
            "$source_jobs" >/dev/null
          jq -e \
            '[.jobs[] | select(.name == "affected-native / linux")]
             | select(length == 1)
             | .[0]
             | select(.status == "completed" and .conclusion == "success")' \
            "$source_jobs" >/dev/null

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/check-runs?check_name=affected-native%20%2F%20linux&filter=latest&per_page=100" \
            > "$source_checks"
          source_check="$evidence/source-check-run.json"
          jq -e \
            --arg head "$EXPECTED_HEAD" \
            --arg sourceRunUrl "$source_run_url" \
            '[.check_runs[]
              | select(.name == "affected-native / linux")
              | select(.head_sha == $head)
              | select(.app.id == 15368)
              | select(.details_url | startswith($sourceRunUrl))]
             | select(length == 1)
             | .[0]
             | select(.status == "completed" and .conclusion == "success")' \
            "$source_checks" > "$source_check"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          receipt="$evidence/receipt.json"
          jq -nS \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --argjson pullRequest "$EXPECTED_PR" \
            --arg head "$EXPECTED_HEAD" \
            --argjson sourceWorkflowRunId "$SOURCE_RUN_ID" \
            --argjson producerWorkflowRunId "$GITHUB_RUN_ID" \
            --argjson producerRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg nativeProofRoot "$native_root" \
            --arg qualificationReceiptRoot "$qualification_root" \
            --arg warrantStateRoot "$state_root" \
            --arg warrantStateCommit "$state_commit" \
            --arg generatedAt "$generated_at" \
            --argjson sourceWorkflowRunPriorAttempt "$prior_attempt" \
            --arg priorRunConclusion "$prior_run_conclusion" \
            --argjson sourceWorkflowRunAttempt "$expected_attempt" \
            --argjson rerunTriggered "$rerun_triggered" \
            --argjson priorCheckRunId "$prior_check_run_id" \
            --arg priorCheckConclusion "$prior_check_conclusion" \
            --slurpfile checkRun "$source_check" \
            '{schema:"kungfu.dev-delivery-native-check-rerun/v1",repository:$repository,protectedBase:$branch,pullRequestNumber:$pullRequest,sourceHead:$head,sourceWorkflowRunId:$sourceWorkflowRunId,sourceWorkflowRunPriorAttempt:$sourceWorkflowRunPriorAttempt,sourceWorkflowRunPriorConclusion:$priorRunConclusion,sourceWorkflowRunAttempt:$sourceWorkflowRunAttempt,rerunTriggered:$rerunTriggered,producerWorkflowRunId:$producerWorkflowRunId,producerRunAttempt:$producerRunAttempt,nativeProofRoot:$nativeProofRoot,qualificationReceiptRoot:$qualificationReceiptRoot,warrantStateRoot:$warrantStateRoot,warrantStateCommit:$warrantStateCommit,generatedAt:$generatedAt,sourceCheckRunPrior:{id:$priorCheckRunId,conclusion:$priorCheckConclusion},checkRun:{id:$checkRun[0].id,nodeId:$checkRun[0].node_id,name:$checkRun[0].name,headSha:$checkRun[0].head_sha,status:$checkRun[0].status,conclusion:$checkRun[0].conclusion,appId:$checkRun[0].app.id,detailsUrl:$checkRun[0].details_url,startedAt:$checkRun[0].started_at,completedAt:$checkRun[0].completed_at}}' \
            > "$receipt.body.json"
          receipt_root="sha256:$(sha256sum "$receipt.body.json" | cut -d' ' -f1)"
          jq --arg receiptRoot "$receipt_root" '. + {receiptRoot:$receiptRoot}' \
            "$receipt.body.json" > "$receipt"
          rm "$receipt.body.json"
          {
            echo "check-run-id=$(jq -er '.id' "$source_check")"
            echo "receipt-root=$receipt_root"
            echo "source-run-attempt=$expected_attempt"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact native CheckRun bridge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-delivery-native-check-bridge-${{ needs.resolve-target.outputs.expected-head-sha }}
          path: .buildchain/native-check-bridge/warrant/receipt.json
          if-no-files-found: error
          retention-days: 30

  landing:
    needs:
      - resolve-target
      - delivery-contract
      - admission
      - native-check-bridge
    if: >-
      needs.admission.result == 'success' &&
      needs.native-check-bridge.result == 'success'
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: write
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@4dabecd7056e168f7345d460e3729465a932db9c
    with:
      buildchain-ref: 4dabecd7056e168f7345d460e3729465a932db9c
      target-branch: ${{ needs.resolve-target.outputs.target-branch }}
      expected-pr-number: ${{ fromJSON(needs.resolve-target.outputs.expected-pr-number) }}
      expected-head-sha: ${{ needs.resolve-target.outputs.expected-head-sha }}
      source-workflow-run-id: ${{ fromJSON(needs.resolve-target.outputs.source-workflow-run-id) }}
      handoff-workflow-id: dev-pr-auto-merge.yml
      source-workflow-id: affected-native-pr.yml
      diagnostic-context: Buildchain delivery intent
      delivery-warrant-mode: required
      assignment-root: ${{ needs.delivery-contract.outputs.assignment-root }}
      initiative-root: ${{ needs.delivery-contract.outputs.initiative-root }}
      source-identity-root: ${{ needs.delivery-contract.outputs.source-identity-root }}
      source-patch-root: ${{ needs.delivery-contract.outputs.source-patch-root }}
      project-cut-proof-json: ${{ needs.delivery-contract.outputs.project-cut-proof-json }}
      plan-root: ${{ needs.delivery-contract.outputs.plan-root }}
      closure-root: ${{ needs.delivery-contract.outputs.closure-root }}
      dependency-root: ${{ needs.delivery-contract.outputs.dependency-root }}
      toolchain-root: ${{ needs.delivery-contract.outputs.toolchain-root }}
      environment-root: ${{ needs.delivery-contract.outputs.environment-root }}
      affected-paths-json: ${{ needs.delivery-contract.outputs.affected-paths-json || '[]' }}
      shard-evidence-roots-json: ${{ needs.delivery-contract.outputs.shard-evidence-roots-json || '[]' }}
      native-proof-json: ${{ needs.delivery-contract.outputs.native-proof-json }}
      native-command: >-
        KUNGFU_FNM_DIST_MIRROR=${{ vars.KUNGFU_FNM_DIST_MIRROR }}
        KUNGFU_FNM_SHA256=${{ vars.KUNGFU_FNM_SHA256 }}
        ./shifu dev-delivery:native-under-warrant --
        --repository ${{ github.repository }}
        --target-branch ${{ needs.resolve-target.outputs.target-branch }}
        --pull-request ${{ needs.resolve-target.outputs.expected-pr-number }}
        --expected-head ${{ needs.resolve-target.outputs.expected-head-sha }}
        --status-context 'affected-native / linux'
        --output ../dev-delivery/kungfu-native-receipt.json
      native-heartbeat-seconds: 300
      delivery-class: ${{ needs.delivery-contract.outputs.delivery-class || 'native-proof-required' }}
      delivery-priority: ${{ needs.delivery-contract.outputs.priority || 'ordinary' }}
      warrant-lease-seconds: 5400
      required-status-checks: |-
        Candidate source acceptance / check
      queue-admission-context: Queue admission lease
      active-lease-context: ${{ needs.delivery-contract.outputs.active-lease-context }}
      ready-label: state/ready
      block-labels: state/blocked,blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/
      require-approval: true
      same-repository-only: true
      max-merges: 1
      merge-method: rebase
      landing-mode: queue
      defer-landing: false
      dry-run: false
    secrets:
      github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
