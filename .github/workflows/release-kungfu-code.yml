# SPDX-License-Identifier: Apache-2.0
#
# Release the kungfu-code launcher: build the 3-platform prebuilt binaries and
# publish them as a GitHub release tagged kungfu-code-v<version>.
#
# The version single source of truth is crates/kungfu-code/Cargo.toml; the tag
# must match it (verified below). The kungfu-code / kungfu-code.cmd shims and
# fresh machines download these assets, so users never need a Rust toolchain.
# Linux builds target musl for a fully static binary that runs on any distro.

name: Release kungfu-code

on:
  push:
    tags:
      - "kungfu-code-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: kungfu-code-macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: kungfu-code-linux-x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: kungfu-code-windows-x64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/kungfu-code/Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME#kungfu-code-v}"
          if [ "$ver" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/kungfu-code/Cargo.toml version $ver" >&2
            exit 1
          fi
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add "${{ matrix.target }}"
          sudo apt-get update -y && sudo apt-get install -y musl-tools
      - name: Add target
        if: ${{ !contains(matrix.target, 'musl') }}
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        run: cargo build --release -p kungfu-code --target "${{ matrix.target }}"
        working-directory: crates
      - name: Stage asset
        run: |
          mkdir -p dist
          src="crates/target/${{ matrix.target }}/release/kungfu-code"
          if [ "${{ runner.os }}" = "Windows" ]; then src="${src}.exe"; fi
          cp "$src" "dist/${{ matrix.asset }}"
      - name: Checksum
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt kungfu-code launcher binaries (macos-arm64, linux-x64 static/musl, windows-x64). Fetched automatically by the kungfu-code shims; see docs/rust-adoption.md."
