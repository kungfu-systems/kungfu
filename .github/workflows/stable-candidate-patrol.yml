# SPDX-License-Identifier: Apache-2.0

name: Stable Candidate Patrol

on:
  schedule:
    # 03:00 Asia/Shanghai. The exact alpha must also complete the 24-hour soak.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      release-now:
        description: Exact non-revoked Alpha selected by explicit human authority
        required: false
        default: ""
      create-pull-request:
        description: Create or reuse the exact source-lock stable candidate PR
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  resolve-version-line:
    runs-on: ubuntu-24.04
    outputs:
      stable-branch: ${{ steps.resolve.outputs.stable-branch }}
      candidate-ledger: ${{ steps.resolve.outputs.candidate-ledger }}
    steps:
      - name: Check out version-line authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: resolve
        name: Derive exact stable runtime refs
        run: ./shifu version-line:resolve --github-output "$GITHUB_OUTPUT"

  stable:
    needs: resolve-version-line
    # The workflow and default runtime select the governed Buildchain v4 Alpha channel.
    uses: kungfu-systems/buildchain/.github/workflows/public-ops-stable-candidate-patrol.yml@v4-alpha
    with:
      buildchain-ref: v4-alpha
      target-branch: ${{ needs.resolve-version-line.outputs.stable-branch }}
      ledger-ref: ${{ needs.resolve-version-line.outputs.candidate-ledger }}
      release-now: ${{ inputs.release-now }}
      auto-approve: false
      auto-merge: true
      merge-method: rebase
      # Scheduled patrols may create the protected source-lock PR. Manual
      # dispatch remains evidence-only unless the operator explicitly enables
      # PR creation; neither path publishes before that PR is reviewed/merged.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.create-pull-request }}
    secrets:
      promotion-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
