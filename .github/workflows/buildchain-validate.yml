name: Buildchain Validate

# Preflight: validate .buildchain/buildchain.toml version-state and lifecycle declarations
# without running any lifecycle command. Fast, side-effect free.

on:
  pull_request:
    branches-ignore:
      - "dev/v*/v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate .buildchain/buildchain.toml
        uses: kungfu-systems/buildchain/actions/validate-config@v4-alpha
        with:
          require-version-state: "true"
          require-lifecycle-stages: "install,check,build,verify"
