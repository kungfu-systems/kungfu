# SPDX-License-Identifier: Apache-2.0

name: Release Alpha

on:
  pull_request:
    types: [closed]
    branches:
      - alpha/v*/v*
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Successful Build workflow run ID to publish
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the release script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_RUN_ID: ${{ inputs.candidate-run-id || '' }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${MANUAL_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow build.yml --event pull_request --status success --commit "${CANDIDATE_HEAD_SHA}" --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          printf 'run-id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Aggregate artifacts and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        # shifu-entry-contract: allow the GitHub-only release tail to run without installing the product toolchain
        run: node scripts/publish-alpha-run.mjs "${{ steps.candidate.outputs.run-id }}"
