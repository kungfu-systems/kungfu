# SPDX-License-Identifier: Apache-2.0

name: Release - New Version

on:
  workflow_dispatch:
    inputs:
      target-ref:
        description: "Alpha or release channel ref whose existing candidate evidence will be rehearsed"
        required: true
        type: string
      target-sha:
        description: "Exact candidate source SHA to rehearse without publication or ref mutation"
        required: true
        type: string
      preflight-run-id:
        description: "Optional exact diagnostic preflight run for the candidate SHA"
        required: false
        default: ""
        type: string
      resume-candidate-repository:
        description: "Exact repository that owns an existing sealed candidate run"
        required: false
        default: ""
        type: string
      resume-candidate-run-id:
        description: "Exact successful Build run to recover without rebuilding"
        required: false
        default: ""
        type: string
      resume-candidate-source-sha:
        description: "Exact source commit recorded by the existing candidate"
        required: false
        default: ""
        type: string
      resume-expected-workflow-file:
        description: "Exact Build workflow file recorded by the existing candidate"
        required: false
        default: ""
        type: string
      resume-expected-workflow-name:
        description: "Exact Build workflow display name recorded by the existing candidate"
        required: false
        default: ""
        type: string
      resume-expected-source-tree:
        description: "Exact source tree recorded by the existing candidate"
        required: false
        default: ""
        type: string
      resume-expected-candidate-runtime-sha:
        description: "Exact Buildchain runtime recorded by the existing candidate"
        required: false
        default: ""
        type: string
      resume-buildchain-runtime-sha:
        description: "Exact Buildchain tooling SHA resolved by the recovery train"
        required: false
        default: ""
        type: string
      resume-transaction-id:
        description: "Optional exact durable publication transaction identity to resume"
        required: false
        default: ""
        type: string
      resume-publication-gate-controller-sha:
        description: "Exact Kungfu commit that owns the read-only recovery Gate controller"
        required: false
        default: ""
        type: string
      publish-transaction-override:
        description: "Allow only the matching durable transaction to resume"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [closed]
    branches:
      - alpha/v*/v*
      - release/v*/v*

permissions:
  contents: read

jobs:
  promotion-contract:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.resume-candidate-run-id == '') || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-source-sha: ${{ steps.candidate.outputs.source-sha }}
      candidate-source-tree: ${{ steps.preflight.outputs.source-tree }}
      preflight-run-id: ${{ steps.preflight.outputs.run-id }}
      preflight-receipt-root: ${{ steps.preflight.outputs.receipt-root }}
      promotion-sha: ${{ steps.candidate.outputs.promotion-sha }}
      promotion-tree: ${{ steps.promotion-tree.outputs.tree }}
    steps:
      - name: Resolve immutable Alpha candidate and promotion commits
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target-sha }}
          PROMOTION_SHA: ${{ inputs.target-sha || github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROMOTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "source-sha=$CANDIDATE_SHA"
            echo "promotion-sha=$PROMOTION_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Alpha candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.candidate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Verify portable release provenance authority
        run: ./shifu check:durable-provenance-authority

      - name: Reuse exact development qualification receipt
        id: preflight
        if: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') }}
        uses: ./.github/actions/require-alpha-preflight
        with:
          source-sha: ${{ steps.candidate.outputs.source-sha }}
          receipt-run-id: ${{ inputs.preflight-run-id || '' }}

      - name: Checkout immutable promotion result
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.candidate.outputs.promotion-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Alpha candidate tree survives channel merge
        id: promotion-tree
        if: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') }}
        env:
          CANDIDATE_TREE: ${{ steps.preflight.outputs.source-tree }}
        run: |
          set -euo pipefail
          promotion_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$promotion_tree" = "$CANDIDATE_TREE"
          echo "tree=$promotion_tree" >> "$GITHUB_OUTPUT"

      - name: Rehearse the Kungfu promotion contract for a pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          surface=product-stable
          if [[ "$TARGET_REF" == alpha/* ]]; then
            surface=product-alpha
          fi
          ./shifu release:publication:admit -- --surface "$surface" --operation publication
          ./shifu gate run governance.promotion-rehearsal

      - name: Rehearse the Kungfu promotion contract for a manual dry-run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_REF: ${{ inputs.target-ref }}
        run: |
          set -euo pipefail
          surface=product-stable
          if [[ "$TARGET_REF" == alpha/* ]]; then
            surface=product-alpha
          fi
          ./shifu release:publication:admit -- --surface "$surface" --operation rehearsal
          ./shifu release:promotion:rehearse

  recovery-preflight:
    name: Verify immutable Alpha recovery coordinates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume-candidate-run-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a bounded Alpha recovery identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REPOSITORY: ${{ inputs.resume-candidate-repository }}
          CANDIDATE_RUN_ID: ${{ inputs.resume-candidate-run-id }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.resume-candidate-source-sha }}
          EXPECTED_WORKFLOW_FILE: ${{ inputs.resume-expected-workflow-file }}
          EXPECTED_WORKFLOW_NAME: ${{ inputs.resume-expected-workflow-name }}
          EXPECTED_SOURCE_TREE: ${{ inputs.resume-expected-source-tree }}
          EXPECTED_CANDIDATE_RUNTIME_SHA: ${{ inputs.resume-expected-candidate-runtime-sha }}
          RECOVERY_RUNTIME_SHA: ${{ inputs.resume-buildchain-runtime-sha }}
          RECOVERY_GATE_CONTROLLER_SHA: ${{ inputs.resume-publication-gate-controller-sha }}
          TARGET_REF: ${{ inputs.target-ref }}
          TARGET_SHA: ${{ inputs.target-sha }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight-run-id }}
          TRANSACTION_OVERRIDE: ${{ inputs.publish-transaction-override }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_REPOSITORY" = "kungfu-systems/kungfu"
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_WORKFLOW_FILE" = "build.yml"
          test "$EXPECTED_WORKFLOW_NAME" = "Build"
          [[ "$EXPECTED_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CANDIDATE_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ ! "$RECOVERY_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resume-buildchain-runtime-sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$RECOVERY_GATE_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resume-publication-gate-controller-sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi
          test "$TARGET_REF" = "alpha/v4/v4.0"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
          test "$TRANSACTION_OVERRIDE" = "true"
          candidate_run_head_sha="$(
            gh api "repos/${CANDIDATE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
              --jq 'select(
              .repository.full_name == "kungfu-systems/kungfu" and
              .head_repository.full_name == "kungfu-systems/kungfu" and
              .status == "completed" and
              .conclusion == "success" and
              .event == "pull_request" and
              .path == ".github/workflows/build.yml" and
              .name == "Build"
            ) | .head_sha // empty'
          )"
          [[ "$candidate_run_head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${CANDIDATE_REPOSITORY}/git/commits/${CANDIDATE_SOURCE_SHA}" \
            --jq 'select(
              .sha == "'"$CANDIDATE_SOURCE_SHA"'" and
              .tree.sha == "'"$EXPECTED_SOURCE_TREE"'" and
              (
                .sha == "'"$candidate_run_head_sha"'" or
                any(.parents[]; .sha == "'"$candidate_run_head_sha"'")
              )
            ) | .sha' | grep -qx "$CANDIDATE_SOURCE_SHA"

      - name: Checkout immutable candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.resume-candidate-source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Resolve the pinned Alpha preflight source
        id: recovery-preflight
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight-run-id }}
        run: |
          set -euo pipefail
          preflight_source_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" \
              --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/alpha-promotion-preflight.yml") | .head_sha // empty'
          )"
          [[ "$preflight_source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source-sha=$preflight_source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact-name=alpha-promotion-preflight-$preflight_source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned Alpha preflight source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.recovery-preflight.outputs.source-sha }}
          path: .buildchain/alpha-preflight-source
          fetch-depth: 1
          persist-credentials: false

      - name: Download the pinned Alpha preflight receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight-run-id }}
          name: ${{ steps.recovery-preflight.outputs.artifact-name }}
          path: .buildchain/alpha-promotion-preflight

      - name: Verify the pinned Alpha preflight at its source
        working-directory: .buildchain/alpha-preflight-source
        env:
          EXPECTED_TREE: ${{ inputs.resume-expected-source-tree }}
          PREFLIGHT_SOURCE_SHA: ${{ steps.recovery-preflight.outputs.source-sha }}
        run: |
          set -euo pipefail
          ./shifu alpha:promotion:preflight verify \
            --receipt ../alpha-promotion-preflight/receipt.json \
            --source-commit "$PREFLIGHT_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

      - name: Verify promotion target preserves the candidate tree
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
          EXPECTED_TREE: ${{ inputs.resume-expected-source-tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git fetch --no-tags origin "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = "$EXPECTED_TREE"

  promote:
    needs: promotion-contract
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.resume-candidate-run-id == '') || github.event.pull_request.merged == true }}
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      issues: write
      id-token: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v3-alpha
    with:
      channel: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && 'alpha' || 'release' }}
      buildchain-channel: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && 'alpha' || 'stable' }}
      buildchain-ref: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && 'v3-alpha' || 'v3' }}
      target-ref: ${{ inputs.target-ref || github.event.pull_request.base.ref }}
      target-sha: ${{ inputs.target-sha || github.event.pull_request.merge_commit_sha || github.sha }}
      buildchain-contract-lock-path: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && '.buildchain/alpha-contract-lock.json' || '.buildchain/contract-lock.json' }}
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      release-candidate-wait-seconds: 10800
      publication-auto-admission: true
      publication-gate-command: node scripts/assemble-kungfu-publication-gate.mjs
      publication-consumer-qualification-command: node scripts/kungfu-release-qualification.mjs
      publication-consumer-predicate-id: kungfu.release-admission/v1
      publication-publisher-workflow-path: .github/workflows/release-new-version.yml
      publication-product: Kungfu Episodes
      publication-target: github-release:kungfu-systems/kungfu
      publication-package-name: ""
      package-manager: custom
      artifact-name: kungfu
      release-candidate-workflow-file: build.yml
      release-candidate-workflow-name: Build
      artifact-patterns: |
        kungfu-*
      required-status-check: build / Finalize build controller evidence
      publish-target: custom
      publish-artifact-kind: kungfu-product
      publish-command: node scripts/buildchain-custom-publish-evidence.mjs
      github-release-payload-patterns: |
        kungfu-episodes-cli-*.tar.gz
        kungfu-episodes-cli-*.zip
        kungfu-episodes-cli-*.qualification.json
        Kungfu-Episodes-*-macos-arm64.dmg
        Kungfu-Episodes-*-macos-arm64.zip
        Kungfu Episodes-*.AppImage
        Kungfu Episodes Setup *.exe
      publication-commit-command: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && 'node scripts/alpha-publication-commit.mjs' || '' }}
      publication-commit-evidence-path: .buildchain/publication-commit/evidence.json
      release-activation-command: ""
      release-activation-receipt-set-path: .buildchain/release-activation/receipt-set.json
      standalone-binary-distribution: false
      publish-mode: publish-final-version
      publish-dist-tag: ${{ startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') && 'alpha' || 'latest' }}
      publish-package-set-order: as-provided
      trusted-publishing: false
      runner-preset: kungfu-v4-native
      required-artifact-count: 5
      release-passport: true
      release-passport-product-name: Kungfu Episodes
      release-passport-kfd-1-witness-jsons: |
        .buildchain/kfd/kfd-1/contract-world.witness.json
        .buildchain/kfd/kfd-1/documentation-pack.witness.json
      release-passport-kfd-2-claim-jsons: |
        .buildchain/kfd/kfd-2/claims/agent-onboarding-pack.json
        .buildchain/kfd/kfd-2/claims/remote-fact-boundary.json
        .buildchain/kfd/kfd-2/claims/agent-work-state-contract.json
        .buildchain/kfd/kfd-2/claims/cross-language-authority-membrane.json
      release-passport-kfd-3-prebuild-witness-jsons: |
        .buildchain/kfd/kfd-3/collaboration-interface.prebuild.json
      release-passport-kfd-3-artifact-verify-command: node scripts/buildchain-kfd-evidence.mjs --write --json >/dev/null && node scripts/buildchain-kfd-evidence.mjs --artifact-witness --json
      release-passport-kfd-adopter-manifest-json: .buildchain/runtime/kfd-adopter/manifest.json
      release-passport-kfd-product-gate-jsons: |
        .buildchain/runtime/kfd-product-gates/kfd-4/gate.json
        .buildchain/runtime/kfd-product-gates/kfd-5/gate.json
        .buildchain/runtime/kfd-product-gates/kfd-7/gate.json
      release-passport-evidence-command: ""
      release-passport-evidence-path: .buildchain/release-evidence/ungfu-public-use.json
      release-passport-invariant-passport-command: >-
        node scripts/kungfu-invariant.mjs --collect-evidence .
        --passport product/release/qualification/invariant-passport.json --json
      github-artifact-attestation-policy-json: auto
      github-artifact-attestation-environment: buildchain-artifact-attestation
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
      BUILDCHAIN_PUBLICATION_COMMIT_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
      BUILDCHAIN_PUBLICATION_COMMIT_SIGNING_KEY: ${{ secrets.KUNGFU_ALPHA_CHANNEL_SIGNING_PRIVATE_KEY }}
      KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
      BUILDCHAIN_ISSUE_APP_ID: ${{ secrets.BUILDCHAIN_ISSUE_APP_ID }}
      BUILDCHAIN_ISSUE_APP_PRIVATE_KEY: ${{ secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}

  recover:
    name: Reuse sealed Alpha candidate
    needs: recovery-preflight
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.resume-candidate-run-id != '' && needs.recovery-preflight.result == 'success' }}
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      issues: write
      id-token: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v3-alpha
    with:
      buildchain-channel: auto
      buildchain-ref: ${{ inputs.resume-buildchain-runtime-sha }}
      channel: alpha
      target-ref: ${{ inputs.target-ref }}
      target-sha: ${{ inputs.target-sha }}
      buildchain-contract-lock-path: .buildchain/alpha-contract-lock.json
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      resume-candidate-repository: ${{ inputs.resume-candidate-repository }}
      resume-candidate-run-id: ${{ inputs.resume-candidate-run-id }}
      resume-expected-workflow-file: ${{ inputs.resume-expected-workflow-file }}
      resume-expected-workflow-name: ${{ inputs.resume-expected-workflow-name }}
      resume-expected-source-tree: ${{ inputs.resume-expected-source-tree }}
      resume-expected-candidate-runtime-sha: ${{ inputs.resume-expected-candidate-runtime-sha }}
      resume-buildchain-runtime-sha: ${{ inputs.resume-buildchain-runtime-sha }}
      resume-transaction-id: ${{ inputs.resume-transaction-id }}
      publish-transaction-override: ${{ inputs.publish-transaction-override }}
      release-candidate-wait-seconds: 10800
      publication-auto-admission: true
      publication-gate-command: node scripts/assemble-kungfu-publication-gate.mjs
      publication-gate-controller-sha: ${{ inputs.resume-publication-gate-controller-sha }}
      publication-consumer-qualification-command: node scripts/kungfu-release-qualification.mjs
      publication-consumer-predicate-id: kungfu.release-admission/v1
      publication-publisher-workflow-path: .github/workflows/release-new-version.yml
      publication-product: Kungfu Episodes
      publication-target: github-release:kungfu-systems/kungfu
      publication-package-name: ""
      package-manager: custom
      artifact-name: kungfu
      release-candidate-workflow-file: build.yml
      release-candidate-workflow-name: Build
      artifact-patterns: |
        kungfu-*
      required-status-check: build / Finalize build controller evidence
      publish-target: custom
      publish-artifact-kind: kungfu-product
      publish-command: node .buildchain/publication-controller/scripts/buildchain-custom-publish-evidence.mjs
      github-release-payload-patterns: |
        kungfu-episodes-cli-*.tar.gz
        kungfu-episodes-cli-*.zip
        kungfu-episodes-cli-*.qualification.json
        Kungfu-Episodes-*-macos-arm64.dmg
        Kungfu-Episodes-*-macos-arm64.zip
        Kungfu Episodes-*.AppImage
        Kungfu Episodes Setup *.exe
      publication-commit-command: BUILDCHAIN_PUBLICATION_COMMIT_PRODUCT_ROOT=$GITHUB_WORKSPACE BUILDCHAIN_PUBLICATION_COMMIT_CANDIDATE_SOURCE_SHA=${{ inputs.resume-candidate-source-sha }} node .buildchain/publication-controller/scripts/alpha-publication-commit.mjs
      publication-commit-evidence-path: .buildchain/publication-commit/evidence.json
      release-activation-command: ""
      release-activation-receipt-set-path: .buildchain/release-activation/receipt-set.json
      standalone-binary-distribution: false
      publish-mode: publish-final-version
      publish-dist-tag: alpha
      publish-package-set-order: as-provided
      trusted-publishing: false
      runner-preset: kungfu-v4-native
      required-artifact-count: 5
      release-passport: true
      release-passport-product-name: Kungfu Episodes
      release-passport-kfd-1-witness-jsons: |
        .buildchain/kfd/kfd-1/contract-world.witness.json
        .buildchain/kfd/kfd-1/documentation-pack.witness.json
      release-passport-kfd-2-claim-jsons: |
        .buildchain/kfd/kfd-2/claims/agent-onboarding-pack.json
        .buildchain/kfd/kfd-2/claims/remote-fact-boundary.json
        .buildchain/kfd/kfd-2/claims/agent-work-state-contract.json
        .buildchain/kfd/kfd-2/claims/cross-language-authority-membrane.json
      release-passport-kfd-3-prebuild-witness-jsons: |
        .buildchain/kfd/kfd-3/collaboration-interface.prebuild.json
      release-passport-kfd-3-artifact-verify-command: node "$GITHUB_WORKSPACE/.buildchain/publication-controller/scripts/buildchain-kfd-evidence.mjs" --write --json >/dev/null && node "$GITHUB_WORKSPACE/.buildchain/publication-controller/scripts/buildchain-kfd-evidence.mjs" --artifact-witness --json
      release-passport-kfd-adopter-manifest-json: .buildchain/runtime/kfd-adopter/manifest.json
      release-passport-kfd-product-gate-jsons: |
        .buildchain/runtime/kfd-product-gates/kfd-4/gate.json
        .buildchain/runtime/kfd-product-gates/kfd-5/gate.json
        .buildchain/runtime/kfd-product-gates/kfd-7/gate.json
      release-passport-evidence-command: ""
      release-passport-evidence-path: .buildchain/release-evidence/ungfu-public-use.json
      release-passport-invariant-passport-command: >-
        node scripts/kungfu-invariant.mjs --collect-evidence .
        --passport product/release/qualification/invariant-passport.json --json
      github-artifact-attestation-policy-json: ""
      github-artifact-attestation-environment: buildchain-artifact-attestation
      dry-run: false
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
      BUILDCHAIN_PUBLICATION_COMMIT_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
      BUILDCHAIN_PUBLICATION_COMMIT_SIGNING_KEY: ${{ secrets.KUNGFU_ALPHA_CHANNEL_SIGNING_PRIVATE_KEY }}
      KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
      BUILDCHAIN_ISSUE_APP_ID: ${{ secrets.BUILDCHAIN_ISSUE_APP_ID }}
      BUILDCHAIN_ISSUE_APP_PRIVATE_KEY: ${{ secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}

  github-release-latest:
    name: Finalize and verify GitHub Latest product discovery
    needs: [promotion-contract, promote, recover]
    if: ${{ always() && ((github.event_name == 'pull_request' && needs.promote.result == 'success') || needs.recover.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the exact publication controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.recover.result == 'success' && inputs.resume-publication-gate-controller-sha || needs.promotion-contract.outputs.promotion-sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Verify Latest points to the newest Kungfu product Publication Bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_URL: ${{ needs.promote.outputs.publication-commit-url || needs.recover.outputs.publication-commit-url }}
        run: |
          set -euo pipefail
          args=(--repository "$GITHUB_REPOSITORY")
          if [ -n "$PUBLICATION_URL" ]; then
            args+=(--expected-publication-url "$PUBLICATION_URL")
          else
            ./shifu release:github:metadata:apply-newest -- \
              --repository "$GITHUB_REPOSITORY"
          fi
          ./shifu release:github:latest:verify -- "${args[@]}"

  alpha-timeline:
    name: Alpha release timeline
    needs: [promotion-contract, promote]
    if: ${{ always() && needs.promotion-contract.result == 'success' && needs.promote.result == 'success' && startsWith(inputs.target-ref || github.event.pull_request.base.ref, 'alpha/') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: alpha-release-history-v1
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout immutable Alpha candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promotion-contract.outputs.candidate-source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Restore exact development qualification receipt
        uses: ./.github/actions/require-alpha-preflight
        with:
          source-sha: ${{ needs.promotion-contract.outputs.candidate-source-sha }}
          receipt-run-id: ${{ needs.promotion-contract.outputs.preflight-run-id }}

      - name: Collect source-bound workflow timelines
        id: timelines
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.promotion-contract.outputs.candidate-source-sha }}
          PREFLIGHT_RUN_ID: ${{ needs.promotion-contract.outputs.preflight-run-id }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .buildchain/alpha-release-timeline/runs
          collect_run() {
            local run_id="$1"
            local output="$2"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "${output}.run.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "${output}.jobs.json"
            jq -s '.[0] + {jobs: .[1].jobs}' \
              "${output}.run.json" "${output}.jobs.json" > "${output}.json"
          }
          candidate_run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${CANDIDATE_SHA}&status=success&per_page=100" \
              --jq '.workflow_runs | map(select(.event == "pull_request")) | sort_by(.run_number) | last | .id // empty'
          )"
          test -n "$candidate_run_id"
          echo "candidate-run-id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          collect_run "$PREFLIGHT_RUN_ID" \
            .buildchain/alpha-release-timeline/runs/preflight
          collect_run "$candidate_run_id" \
            .buildchain/alpha-release-timeline/runs/candidate
          collect_run "$PROMOTION_RUN_ID" \
            .buildchain/alpha-release-timeline/runs/promotion
          jq -n \
            --slurpfile preflight .buildchain/alpha-release-timeline/runs/preflight.json \
            --slurpfile candidate .buildchain/alpha-release-timeline/runs/candidate.json \
            --slurpfile promotion .buildchain/alpha-release-timeline/runs/promotion.json \
            '{preflight: $preflight[0], candidate: $candidate[0], promotion: $promotion[0]}' \
            > .buildchain/alpha-release-timeline/runs.json

      - name: Restore structured cache evidence from the exact candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.timelines.outputs.candidate-run-id }}
        run: |
          set -euo pipefail
          diagnostics_dir=".buildchain/alpha-release-timeline/cache-diagnostics"
          mkdir -p "$diagnostics_dir"
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "kungfu-diagnostics-*" \
            --dir "$diagnostics_dir"
          ./shifu alpha:cache:evidence write \
            --preflight .buildchain/alpha-promotion-preflight/receipt.json \
            --diagnostics "$diagnostics_dir" \
            --out .buildchain/alpha-release-timeline/cache-evidence.json
          ./shifu alpha:cache:evidence verify \
            --preflight .buildchain/alpha-promotion-preflight/receipt.json \
            --evidence .buildchain/alpha-release-timeline/cache-evidence.json

      - name: Materialize exact promotion evidence references
        env:
          CONTROLLER_RECEIPT_JSON: ${{ needs.promote.outputs.controller-receipt-json }}
          PUBLICATION_EVIDENCE_DIGEST: ${{ needs.promote.outputs.publication-commit-evidence-digest }}
          PUBLICATION_PAYLOAD_ROOT: ${{ needs.promote.outputs.publication-commit-payload-root }}
          PUBLICATION_URL: ${{ needs.promote.outputs.publication-commit-url }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CONTROLLER_RECEIPT_JSON" \
            > .buildchain/alpha-release-timeline/controller-receipt.json
          jq -n \
            --arg evidenceDigest "$PUBLICATION_EVIDENCE_DIGEST" \
            --arg payloadRoot "$PUBLICATION_PAYLOAD_ROOT" \
            --arg publicUrl "$PUBLICATION_URL" \
            '{evidenceDigest: $evidenceDigest, payloadRoot: $payloadRoot, publicUrl: $publicUrl}' \
            > .buildchain/alpha-release-timeline/publication.json

      - name: Checkout durable content-addressed Alpha history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: alpha-release-history/v1
          path: .buildchain/alpha-release-history-store
          fetch-depth: 1

      - name: Verify and export compatible durable Alpha samples
        run: |
          set -euo pipefail
          mkdir -p .buildchain/alpha-release-timeline/samples
          ./shifu alpha:release:history verify \
            --history .buildchain/alpha-release-history-store/history
          ./shifu alpha:release:history export \
            --history .buildchain/alpha-release-history-store/history \
            --out .buildchain/alpha-release-timeline/samples

      - name: Write and verify Alpha release timeline
        env:
          TIMELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'rehearsal' || 'release' }}
        run: |
          set -euo pipefail
          ./shifu alpha:release:timeline write \
            --preflight .buildchain/alpha-promotion-preflight/receipt.json \
            --source-commit "${{ needs.promotion-contract.outputs.candidate-source-sha }}" \
            --source-tree "${{ needs.promotion-contract.outputs.candidate-source-tree }}" \
            --promotion-commit "${{ needs.promotion-contract.outputs.promotion-sha }}" \
            --promotion-tree "${{ needs.promotion-contract.outputs.promotion-tree }}" \
            --runs .buildchain/alpha-release-timeline/runs.json \
            --controller .buildchain/alpha-release-timeline/controller-receipt.json \
            --cache-evidence .buildchain/alpha-release-timeline/cache-evidence.json \
            --candidate-artifact "${{ needs.promote.outputs.release-candidate-artifact }}" \
            --publication .buildchain/alpha-release-timeline/publication.json \
            --mode "$TIMELINE_MODE" \
            --out .buildchain/alpha-release-timeline/receipt.json
          ./shifu alpha:release:timeline verify \
            --receipt .buildchain/alpha-release-timeline/receipt.json
          cp .buildchain/alpha-release-timeline/receipt.json \
            .buildchain/alpha-release-timeline/samples/current.json
          ./shifu alpha:release:timeline slo \
            --inputs .buildchain/alpha-release-timeline/samples \
            --out .buildchain/alpha-release-timeline/slo.json

      - name: Append real release to durable Alpha history
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          history_checkout=".buildchain/alpha-release-history-store"
          ./shifu alpha:release:history append \
            --history "${history_checkout}/history" \
            --receipt .buildchain/alpha-release-timeline/receipt.json \
            --out .buildchain/alpha-release-timeline/history-append.json
          if test -n "$(git -C "$history_checkout" status --porcelain -- history)"; then
            git -C "$history_checkout" config user.name "github-actions[bot]"
            git -C "$history_checkout" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$history_checkout" add history
            git -C "$history_checkout" commit \
              -m "chore(alpha): append release timeline ${{ needs.promotion-contract.outputs.candidate-source-sha }}"
            git -C "$history_checkout" push origin HEAD:alpha-release-history/v1
          fi

      - name: Upload auditable Alpha timeline and SLO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-release-timeline-${{ github.run_id }}
          path: |
            .buildchain/alpha-release-timeline/receipt.json
            .buildchain/alpha-release-timeline/slo.json
            .buildchain/alpha-release-timeline/cache-evidence.json
            .buildchain/alpha-release-timeline/history-append.json
            .buildchain/alpha-release-history-store/history/manifest.json
          if-no-files-found: error
          retention-days: 90
