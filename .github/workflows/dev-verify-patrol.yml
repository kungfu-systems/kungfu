# SPDX-License-Identifier: Apache-2.0

# Dev Verify Patrol
#
# The heavy Build workflow only fires on alpha/release PRs, so the development
# mainline (this repository's default dev branch) has no standing
# verify signal: regressions can accumulate on dev and only surface at alpha
# promotion, forcing contributors to reproduce the baseline by hand to tell a
# green change from an already-red tree.
#
# This patrol gives dev an authoritative, attributable pass/fail through the
# Shifu Gate profile declared in shifu.gates.json. Buildchain expands the plan
# across the supported native runner matrix and aggregates source-bound
# receipts without owning Kungfu's concrete Gate ids or policy.

name: Dev Verify Patrol

on:
  schedule:
    # Daily at 20:00 UTC, which is 04:00 Asia/Shanghai on the following day.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain train or exact SHA for trusted manual validation"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      id-token: write
    uses: kungfu-systems/buildchain/.github/workflows/.gate-profile.yml@f8ef93be41b0badd75eb35cc1506c2be12198984
    with:
      # Keep the reviewed Gate workflow shell and its streamed runtime aligned
      # by default. Trusted manual runs may still supply an exact SHA or train
      # ref. Checkout
      # cache hits are optional: every source/runtime checkout verifies the
      # locked SHA and falls back to GitHub when a retained bundle is stale.
      buildchain-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.buildchain-ref || '' }}
      checkout-cache-mode: auto
      checkout-cache-fallback: github
      rust-toolchain: "1.96.0"
      rustup-dist-server: https://rsproxy.cn
      rustup-update-root: https://rsproxy.cn/rustup
      cargo-registry-index: ${{ vars.BUILDCHAIN_CARGO_REGISTRY_INDEX }}
      gate-profile: dev-patrol
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","platform":"linux","runner":"[\"self-hosted\",\"Linux\",\"X64\",\"kungfu-build-v4-linux-x64\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]},{"id":"macos-arm64","name":"macOS ARM64","platform":"macos","runner":"[\"self-hosted\",\"macOS\",\"ARM64\",\"kungfu-build-v4-macos-arm64\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]},{"id":"windows-x64","name":"Windows x64","platform":"windows","runner":"[\"self-hosted\",\"Windows\",\"X64\",\"kungfu-build-v4-windows-x64\"]","capabilities":["node","native-toolchain","product-artifacts","rust"]}]
      artifact-name: kungfu-dev-patrol-gates
      # Buildchain projects the cache profile as environment. Keep the Gate
      # argv direct so the controller can append `gate plan/run ...` safely.
      gate-command-json: >-
        {"linux":["./shifu"],"macos":["./shifu"],"windows":["./shifu.cmd"]}
      gate-environment-json: >-
        {"SHIFU_NATIVE":"1","KUNGFU_BUILDCHAIN_NO_OPTIONAL":"1",
        "KUNGFU_BUILDCHAIN_SOURCE_BUILD":"1","VSLANG":"1033"}
      shifu-cache-profile-ref: ${{ vars.SHIFU_CACHE_PROFILE_REF }}
      shifu-cache-profile-digest: ${{ vars.SHIFU_CACHE_PROFILE_DIGEST }}

  # Keep one tracking issue in sync with the patrol result: open or refresh it
  # when dev is red, close it when dev returns to green. This is the standing
  # "is dev green?" signal contributors read instead of reproducing the
  # baseline by hand.
  report:
    needs: verify
    # Always run so the tracking issue is closed on green and opened/refreshed
    # on red. This workflow only triggers on schedule / workflow_dispatch.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT: ${{ needs.verify.result }}
      HEAD_SHA: ${{ github.sha }}
      DEV_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AUTOMATION_LABELS: "kind/internal,area/buildchain,source/automation,state/blocked"
    steps:
      - name: Sync tracking issue with patrol result
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA:0:12}"
          issue_title="Dev verify patrol: ${DEV_BRANCH} verify is failing"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --state open --search "in:title \"${issue_title}\"" \
            --json number --jq '.[0].number // empty')"

          if [ "${RESULT}" = "success" ]; then
            if [ -n "${existing}" ]; then
              gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
                --add-label "${AUTOMATION_LABELS}"
              gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
                --body "Dev verify is green again at \`${short_sha}\`. Run: ${RUN_URL}. Closing."
              gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
                --reason completed
            fi
            echo "dev verify green at ${short_sha}"
            exit 0
          fi

          # Only a real verify failure is a dev-health signal. A cancelled or
          # skipped run (e.g. the single self-hosted runner was pre-empted by a
          # release build) says nothing about dev, so leave the tracking issue
          # untouched rather than raising a false red.
          if [ "${RESULT}" != "failure" ]; then
            echo "verify result '${RESULT}' is not a dev-health signal; leaving tracking issue unchanged"
            exit 0
          fi

          body="$(cat <<EOF
          <!-- kungfu-attention-source: automation -->

          The daily dev verify patrol found \`${DEV_BRANCH}\` failing.

          - Commit: \`${short_sha}\`
          - Run: ${RUN_URL}

          Open the run and read the \`[verify]\` summary line for the exact
          failing items. This issue is kept in sync automatically: it refreshes
          while dev stays red and closes when a later patrol run passes.
          EOF
          )"

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --add-label "${AUTOMATION_LABELS}"
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "refreshed tracking issue #${existing}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${issue_title}" --body "${body}" \
              --label "${AUTOMATION_LABELS}"
            echo "opened tracking issue"
          fi
