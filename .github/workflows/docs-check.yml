# SPDX-License-Identifier: Apache-2.0

name: Docs Check

on:
  pull_request:
    branches:
      - dev/v*/v*
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.mjs"
      - "docs.contract.json"
      - "docs/vocabulary.registry.json"
      - "scripts/check-docs.mjs"
      - "scripts/check-docs.test.mjs"
      - "scripts/run-docs-check.mjs"
      - "scripts/run-docs-prose-check.mjs"
      - "scripts/vocabulary-contract.mjs"
      - "scripts/vocabulary-contract.test.mjs"
      - "scripts/check.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  docs-check:
    name: Markdown structure + contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install root documentation tools
        run: ./shifu install --frozen-lockfile --filter @kungfu-tech/workspaces

      - name: Check Markdown documentation
        run: ./shifu docs:check

      - name: Enforce objective prose contracts
        run: ./shifu docs:prose:required

      - name: Report advisory prose policy
        continue-on-error: true
        run: ./shifu docs:prose
