# SPDX-License-Identifier: Apache-2.0

name: Embedding membrane spikes

on:
  pull_request:
    branches:
      - dev/v*/v*
    paths:
      - "framework/core/src/libkungfu/include/kungfu/embedding.h"
      - "framework/core/src/libkungfu/include/kungfu/embedding.hpp"
      - "framework/core/src/libkungfu/include/kungfu/native_storage.h"
      - "framework/core/src/libkungfu/src/runtime/embedding.cpp"
      - "framework/core/src/libkungfu/src/runtime/native_storage.cpp"
      - "framework/core/slices/shared-embedding-membrane/**"
      - "framework/core/slices/native-storage-closure/**"
      - "framework/core/slices/libwasm-shared-membrane/**"
      - "framework/core/slices/CMakeLists.txt"
      - "crates/libwasm-spike/**"
      - ".github/workflows/embedding-membrane-spike.yml"

permissions:
  contents: read

jobs:
  source-delta:
    name: Prepare immutable source delta
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    env:
      MIRROR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pack tree-verified source delta
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$MIRROR_BASE_SHA"
          mkdir -p "${RUNNER_TEMP}/embedding-source-delta"
          git diff --binary "$MIRROR_BASE_SHA" "$SOURCE_SHA" \
            > "${RUNNER_TEMP}/embedding-source-delta/source.patch"
          git rev-parse "${SOURCE_SHA}^{tree}" \
            > "${RUNNER_TEMP}/embedding-source-delta/source-tree-sha"
          test -s "${RUNNER_TEMP}/embedding-source-delta/source.patch"

      - name: Upload source delta
        uses: actions/upload-artifact@v4
        with:
          name: embedding-source-delta-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/embedding-source-delta
          if-no-files-found: error
          retention-days: 1

  native-membrane:
    name: ${{ matrix.name }}
    # Never execute untrusted fork code on the self-hosted build fleet.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: source-delta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: '["self-hosted","Linux","X64","kungfu-build-v4-linux-x64"]'
            source_mode: mirror
          - name: macOS ARM64
            runner: '"macos-15"'
            source_mode: github
          - name: Windows x64
            runner: '["self-hosted","Windows","X64","kungfu-build-v4-windows-x64"]'
            source_mode: mirror
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      KUNGFU_BUILDCHAIN_NO_OPTIONAL: "1"
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      KUNGFU_BUILD_SKIP_KUNGFU_NODE: "1"
      KUNGFU_BUILD_SKIP_PYKUNGFU: "1"
      SHIFU_NATIVE: "1"
      SHIFU_REQUIRE_MSVC: "1"
      MIRROR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MIRROR_REF: refs/heads/dev/v4/v4.0
      MIRROR_URL: http://192.168.100.222:8088/git-mirrors/kungfu.git
      SOURCE_MODE: ${{ matrix.source_mode }}
      SOURCE_ROOT: source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Expose Git Bash on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Download immutable source delta
        uses: actions/download-artifact@v4
        with:
          name: embedding-source-delta-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/embedding-source-delta

      # Prefer the LAN mirror for the pinned dev base. Its branch tip may
      # advance or briefly lag after the PR event, so fall back to fetching the
      # immutable base SHA from GitHub and compare Git tree ids before executing
      # any source from the PR.
      - name: Reconstruct and verify immutable PR head
        shell: bash
        run: |
          git init "$SOURCE_ROOT"
          if [ "$SOURCE_MODE" = "mirror" ]; then
            git -C "$SOURCE_ROOT" remote add mirror "$MIRROR_URL"
            git -C "$SOURCE_ROOT" fetch --no-tags mirror \
              "+${MIRROR_REF}:refs/embedding/base"
          fi
          if [ "$SOURCE_MODE" = "github" ] || \
            ! git -C "$SOURCE_ROOT" cat-file -e \
              "${MIRROR_BASE_SHA}^{commit}" 2>/dev/null; then
            git -C "$SOURCE_ROOT" remote add github \
              "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$SOURCE_ROOT" fetch --no-tags --depth=1 github \
              "$MIRROR_BASE_SHA"
          fi
          git -C "$SOURCE_ROOT" checkout --detach "$MIRROR_BASE_SHA"
          git -C "$SOURCE_ROOT" apply --index --binary \
            "${RUNNER_TEMP}/embedding-source-delta/source.patch"
          expected_tree="$(tr -d '\r\n' \
            < "${RUNNER_TEMP}/embedding-source-delta/source-tree-sha")"
          test "$(git -C "$SOURCE_ROOT" write-tree)" = "$expected_tree"
          test -f "$SOURCE_ROOT/shifu"

      - name: Verify pinned spike Rust toolchain
        shell: bash
        run: |
          cd "$SOURCE_ROOT/crates/libwasm-spike"
          rustc --version
          cargo --version

      - name: Install frozen workspace (POSIX)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: cd "$SOURCE_ROOT" && ./shifu install --frozen-lockfile --no-optional

      - name: Rebind frozen Python registry metadata
        if: ${{ matrix.source_mode == 'github' }}
        shell: bash
        run: |
          cd "$SOURCE_ROOT/framework/core"
          uv_version="$(tr -d '\r\n' < ../../.uv-version)"
          uv_bin="$HOME/.cache/kungfu/tools/uv/$uv_version/macos-aarch64/uv"
          test -x "$uv_bin"
          fingerprint() {
            python3 -c 'import hashlib,json,sys,tomllib; d=tomllib.load(open(sys.argv[1],"rb")); rows=[]; [(rows.append((p.get("name"),p.get("version"),("registry" if "registry" in p.get("source",{}) else json.dumps(p.get("source",{}),sort_keys=True)),sorted([x.get("hash","") for x in ([p.get("sdist",{})] if p.get("sdist") else [])+p.get("wheels",[])])))) for p in d.get("package",[])]; print(hashlib.sha256(json.dumps(sorted(rows),separators=(",",":")).encode()).hexdigest())' "$1"
          }
          before="$(fingerprint uv.lock)"
          "$uv_bin" lock --refresh --default-index https://pypi.org/simple
          after="$(fingerprint uv.lock)"
          test "$before" = "$after"

      - name: Install frozen workspace (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_ROOT
          .\shifu.cmd install --frozen-lockfile --no-optional

      - name: Generate core toolchain (POSIX)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: cd "$SOURCE_ROOT" && ./shifu --filter @kungfu-tech/core configure

      - name: Generate core toolchain (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_ROOT
          .\shifu.cmd --filter @kungfu-tech/core configure

      - name: Build and run native membrane consumers
        shell: bash
        run: |
          cd "$SOURCE_ROOT"
          spike_python="$PWD/framework/core/.venv/bin/python3"
          if [ "$RUNNER_OS" = "Windows" ]; then
            spike_python="$PWD/framework/core/.venv/Scripts/python.exe"
          fi
          # shifu-entry-contract: allow the isolated spike configure is not a product-level Shifu task
          cmake -S framework/core -B framework/core/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/framework/core/build/conan_toolchain.cmake" \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYTHON_EXECUTABLE="$spike_python" \
            -DKUNGFU_WITH_SLICES=ON \
            -DKF_LIBWASM_CARGO_REGISTRY='sparse+https://rsproxy.cn/index/'
          # shifu-entry-contract: allow the isolated spike targets are not product-level Shifu tasks
          cmake --build framework/core/build --config Release --parallel 2 \
            --target shared_embedding_host shared_embedding_native_kfx \
              native_storage_closure_host libwasm_shared_membrane_host
          if [ "$RUNNER_OS" = "macOS" ]; then
            test "$(uname -m)" = "arm64"
          fi
          # Keep the latency gate separate from sustained compiler load on the
          # build runner.  This is one fixed settle, not a benchmark retry.
          sleep 60
          # shifu-entry-contract: allow the spike harness must inspect platform-specific binaries directly
          node framework/core/slices/shared-embedding-membrane/run.mjs framework/core/build
          # shifu-entry-contract: allow the libwasm spike harness must inspect engine cdylibs directly
          node framework/core/slices/libwasm-shared-membrane/run.mjs framework/core/build
          # shifu-entry-contract: allow the native closure harness must inspect platform-specific binaries directly
          node framework/core/slices/native-storage-closure/run.mjs framework/core/build
