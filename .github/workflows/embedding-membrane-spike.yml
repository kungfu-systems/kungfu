# SPDX-License-Identifier: Apache-2.0

name: Embedding membrane spike

on:
  pull_request:
    branches:
      - dev/v*/v*
    paths:
      - "framework/core/src/libkungfu/include/kungfu/embedding.h"
      - "framework/core/src/libkungfu/include/kungfu/embedding.hpp"
      - "framework/core/src/libkungfu/src/runtime/embedding.cpp"
      - "framework/core/slices/shared-embedding-membrane/**"
      - "framework/core/slices/CMakeLists.txt"
      - ".github/workflows/embedding-membrane-spike.yml"

permissions:
  contents: read

jobs:
  source-snapshot:
    name: Prepare immutable source snapshot
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pack source snapshot
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tar --exclude=.git -czf "${RUNNER_TEMP}/kungfu-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: embedding-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kungfu-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  native-membrane:
    name: ${{ matrix.name }}
    # Never execute untrusted fork code on the self-hosted build fleet.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: source-snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: '["self-hosted","Linux","X64","kungfu-build-v4-linux-x64"]'
          - name: macOS ARM64
            runner: '["self-hosted","macOS","ARM64","kungfu-build-v4-macos-arm64"]'
          - name: Windows x64
            runner: '["self-hosted","Windows","X64","kungfu-build-v4-windows-x64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      KUNGFU_BUILDCHAIN_NO_OPTIONAL: "1"
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      SHIFU_NATIVE: "1"
      SHIFU_REQUIRE_MSVC: "1"
      SOURCE_ROOT: source-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Expose Git Bash on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Download immutable PR head snapshot
        uses: actions/download-artifact@v4
        with:
          name: embedding-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/embedding-source

      # Use a per-SHA directory so no runner cleanup or overwrite is required.
      - name: Extract immutable PR head snapshot
        shell: bash
        run: |
          mkdir -p "$SOURCE_ROOT"
          tar -xzf "${RUNNER_TEMP}/embedding-source/kungfu-source.tar.gz" \
            -C "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/shifu"

      - name: Install frozen workspace
        shell: bash
        run: cd "$SOURCE_ROOT" && ./shifu install --frozen-lockfile --no-optional

      - name: Seed core build
        shell: bash
        run: cd "$SOURCE_ROOT" && ./shifu build:core

      - name: Build and run shared membrane consumers
        shell: bash
        run: |
          cd "$SOURCE_ROOT"
          # shifu-entry-contract: allow the isolated spike configure is not a product-level Shifu task
          cmake -S framework/core -B framework/core/build -DKUNGFU_WITH_SLICES=ON
          # shifu-entry-contract: allow the isolated spike targets are not product-level Shifu tasks
          cmake --build framework/core/build --target shared_embedding_host shared_embedding_native_kfx
          # shifu-entry-contract: allow the spike harness must inspect platform-specific binaries directly
          node framework/core/slices/shared-embedding-membrane/run.mjs framework/core/build
