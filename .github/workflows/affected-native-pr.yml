# SPDX-License-Identifier: Apache-2.0

name: Core affected native

on:
  push:
    branches:
      - dev/v*/v*
  pull_request:
    branches:
      - dev/v*/v*
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  affected-native:
    name: affected-native / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Resolve affected native revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              base_sha="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.after' "$GITHUB_EVENT_PATH")"
              ;;
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$event_head_sha" "$head_sha" || {
            echo "checked-out source does not contain event head $event_head_sha" >&2
            exit 1
          }
          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Plan affected native closure from source
        id: plan
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          plan_path="product/qualification/affected-native/plan.json"
          # shifu-entry-contract: allow build-free native planning before Gate dependencies are runnable
          node scripts/run-core-affected-native.mjs \
            --plan-out "$plan_path" \
            --json
          if [ "$(jq '.closureComponents | length' "$plan_path")" -gt 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No native impact; dependency and compiler bootstrap are skipped."
            # shifu-entry-contract: allow tier-none receipt writing without dependency bootstrap
            node scripts/run-core-affected-native.mjs \
              --plan-input "$plan_path" \
              --execute
          fi
      - name: Install pinned source acceptance tools
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        env:
          BUILDCHAIN_CHECK_MODE: source
        # shifu-entry-contract: allow source-tool bootstrap before Gate dependencies are runnable
        run: node scripts/buildchain-install.mjs
      - name: Ensure compiler cache tool
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          ccache --version
      - name: Write portable cache manifests
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: |
          # shifu-entry-contract: allow Buildchain cache planning before Gate dependencies are runnable
          node scripts/write-affected-native-cache-manifests.mjs \
            --plan product/qualification/affected-native/plan.json \
            --output-dir product/qualification/affected-native/cache
      - name: Plan dependency cache
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: dependency-plan
        shell: bash
        run: >-
          ./node_modules/.bin/buildchain portable-cache plan
          --manifest product/qualification/affected-native/cache/dependency.manifest.json
          --output product/qualification/affected-native/cache/dependency.plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.dependency-plan.outputs.cache-paths }}
          key: ${{ steps.dependency-plan.outputs.cache-key }}
          restore-keys: ${{ steps.dependency-plan.outputs.restore-keys }}
      - name: Plan compiler cache
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: compiler-plan
        shell: bash
        run: >-
          ./node_modules/.bin/buildchain portable-cache plan
          --manifest product/qualification/affected-native/cache/compiler.manifest.json
          --output product/qualification/affected-native/cache/compiler.plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.compiler-plan.outputs.cache-paths }}
          key: ${{ steps.compiler-plan.outputs.cache-key }}
          restore-keys: ${{ steps.compiler-plan.outputs.restore-keys }}
      - name: Enable compiler cache when available
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              echo "CCACHE_NOHASHDIR=true"
              echo "CCACHE_COMPRESS=true"
              echo "CCACHE_MAXSIZE=1G"
            } >> "$GITHUB_ENV"
          else
            echo "ccache unavailable; the current build remains the cold authority"
          fi
      - name: Reset compiler cache statistics
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: ccache --zero-stats
      - name: Install frozen workspace
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: ./shifu install --frozen-lockfile
      - name: Run affected native closure
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: native-gate
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
          KUNGFU_AFFECTED_NATIVE_PLAN: product/qualification/affected-native/plan.json
        run: ./shifu gate run source.changed-scope --capability native-toolchain
      - name: Record compiler cache statistics
        if: ${{ always() && steps.plan.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/qualification/affected-native/cache
          ccache --show-stats --verbose | tee product/qualification/affected-native/cache/compiler-stats.txt
      - name: Seal portable cache receipts
        if: ${{ steps.native-gate.outcome == 'success' }}
        shell: bash
        env:
          DEPENDENCY_MATCHED_KEY: ${{ steps.dependency-cache.outputs.cache-matched-key }}
          DEPENDENCY_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
          COMPILER_MATCHED_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
          COMPILER_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          seal() {
            layer="$1"
            matched_key="$2"
            cache_hit="$3"
            fallback_status="not-run"
            if [ -z "$matched_key" ]; then fallback_status="passed"; fi
            ./node_modules/.bin/buildchain portable-cache receipt \
              --plan "product/qualification/affected-native/cache/${layer}.plan.json" \
              --matched-key "$matched_key" \
              --cache-hit "$cache_hit" \
              --validation-status pass \
              --cold-fallback-status "$fallback_status" \
              --output "product/qualification/affected-native/cache/${layer}.receipt.json"
          }
          seal dependency "$DEPENDENCY_MATCHED_KEY" "$DEPENDENCY_HIT"
          seal compiler "$COMPILER_MATCHED_KEY" "$COMPILER_HIT"
      - name: Save dependency cache
        if: ${{ steps.native-gate.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.dependency-plan.outputs.cache-paths }}
          key: ${{ steps.dependency-plan.outputs.cache-key }}
      - name: Save compiler cache
        if: ${{ steps.native-gate.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.compiler-plan.outputs.cache-paths }}
          key: ${{ steps.compiler-plan.outputs.cache-key }}
      - name: Upload raw plan, receipt, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-affected-native-${{ github.sha }}
          path: product/qualification/affected-native
          if-no-files-found: warn
          retention-days: 14
