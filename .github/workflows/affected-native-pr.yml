# SPDX-License-Identifier: Apache-2.0

name: Core affected native

on:
  pull_request:
    branches:
      - dev/v*/v*
  merge_group:
    types: [checks_requested]

concurrency:
  group: core-affected-native-${{ github.event.merge_group.head_sha || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

env:
  # Public, immutable bootstrap cache. Shifu still verifies the exact official
  # release digest before extracting the archive.
  KUNGFU_FNM_DIST_MIRROR: ${{ vars.KUNGFU_FNM_DIST_MIRROR }}
  KUNGFU_FNM_SHA256: ${{ vars.KUNGFU_FNM_SHA256 }}

jobs:
  dco:
    name: Candidate DCO
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit sign-offs
        env:
          EXPECTED_EVENT_NAME: pull_request
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "$EXPECTED_EVENT_NAME" ]; then
            echo "DCO admission only accepts pull_request events." >&2
            exit 1
          fi
          BASE_SHA="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          missing=0
          commits="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            echo "No commits to check."
            exit 0
          fi
          for commit in ${commits}; do
            subject="$(git log -1 --format=%s "${commit}")"
            if git log -1 --format=%B "${commit}" | grep -Eiq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$'; then
              continue
            fi
            parents="$(git log -1 --format=%P "${commit}")"
            parent_count="$(wc -w <<< "${parents}" | tr -d ' ')"
            committer="$(git log -1 --format='%cn <%ce>' "${commit}")"
            if [ "${parent_count}" -eq 2 ] && \
              [ "${committer}" = "GitHub <noreply@github.com>" ] && \
              grep -Eq '^Merge pull request #[0-9]+ from kungfu-systems/[A-Za-z0-9._/-]+$' <<< "${subject}"; then
              continue
            fi
            echo "::error title=Missing DCO sign-off::${commit} ${subject}"
            missing=1
          done
          if [ "${missing}" -ne 0 ]; then
            echo "One or more commits are missing a DCO Signed-off-by line."
            exit 1
          fi
          echo "All commits include DCO sign-offs."

  source_acceptance:
    name: Candidate source acceptance
    # Protected Buildchain merge 1342b7d preserves exact proof reuse when
    # GitHub omits a PR backlink while retaining every rooted source binding.
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@1342b7d68936ab3c31b58b255df1de49c234bc02
    with:
      buildchain-ref: 1342b7d68936ab3c31b58b255df1de49c234bc02
      mode: source
      upload-artifacts: true
      source-proof-reuse: true
      source-proof-policy-paths-json: '[".github/workflows/affected-native-pr.yml"]'
      source-proof-closure-paths-json: '[".buildchain/buildchain.toml","shifu","scripts/source-acceptance.mjs","scripts/require-shifu.mjs"]'
      source-proof-dependency-paths-json: '["package.json","pnpm-lock.yaml"]'
      source-proof-required-contexts-json: '["Candidate source acceptance / check"]'

  cancel_after_source_failure:
    name: Stop selected lanes after source failure
    needs: source_acceptance
    if: ${{ always() && needs.source_acceptance.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel this failed source workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  candidate_buildchain_config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate .buildchain/buildchain.toml
        uses: kungfu-systems/buildchain/actions/validate-config@58e48d73ae7fef0dd06ae02baf6d090e4da5487d
        with:
          require-version-state: "true"
          require-lifecycle-stages: "install,check,build,verify"

  candidate_preflight:
    name: Candidate governance preflight / linux
    needs: candidate_buildchain_config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native-required: ${{ steps.plan.outputs.native-required }}
      sdk-required: ${{ steps.plan.outputs.sdk-required }}
      shifu-required: ${{ steps.plan.outputs.shifu-required }}
      kfd-required: ${{ steps.plan.outputs.kfd-required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected merge-queue replay
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          ./shifu project-cut:queue-admission -- \
            --base "$base_sha" \
            --head "$head_sha"
      - name: Verify exact Initiative-family queue lease
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          pr_number="$(sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$MERGE_GROUP_HEAD_REF")"
          if [ -z "$pr_number" ]; then
            echo "Unable to resolve the exact pull request from merge-group head_ref." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/family-pr.json"
          pr_head="$(jq -r '.head.sha' "$RUNNER_TEMP/family-pr.json")"
          jq -r '.body // ""' "$RUNNER_TEMP/family-pr.json" > "$RUNNER_TEMP/family-pr-body.txt"
          gh api "repos/$GITHUB_REPOSITORY/commits/$pr_head/status" > "$RUNNER_TEMP/family-status.json"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          ./shifu project-cut:queue-admission -- \
            --verify-family-marker "$RUNNER_TEMP/family-pr-body.txt" \
            --status-file "$RUNNER_TEMP/family-status.json" \
            --expected-pr-head "$pr_head" \
            --expected-dev-head "$MERGE_GROUP_BASE_SHA" \
            --candidate-tree "$candidate_tree"
      - name: Verify ADR delivery intent
        run: ./shifu gate run governance.adr-delivery
      - name: Rehearse alpha and stable promotion contracts
        run: ./shifu gate run governance.promotion-rehearsal
      - name: Plan exact dev candidate qualification
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$event_head_sha" "$head_sha"
          mkdir -p product/qualification/dev-candidate
          export GITHUB_BASE_SHA="$base_sha"
          export GITHUB_HEAD_SHA="$head_sha"
          # shifu-entry-contract: allow build-free candidate planning before Gate dependencies are runnable
          node scripts/run-core-affected-native.mjs \
            --plan-out product/qualification/dev-candidate/plan.json \
            --json
          plan=product/qualification/dev-candidate/plan.json
          native_required=false
          if [ "$(jq '.closureComponents | length' "$plan")" -gt 0 ]; then
            native_required=true
          fi
          {
            echo "native-required=${native_required}"
            echo "sdk-required=$(jq -r '.sdkQualification.required' "$plan")"
            echo "shifu-required=$(jq -r '.devQueueQualification.shifuWorkspace.required' "$plan")"
            echo "kfd-required=$(jq -r '.devQueueQualification.kfdVerifier.required' "$plan")"
          } >> "$GITHUB_OUTPUT"
      - name: Upload candidate preflight plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-candidate-plan-${{ github.sha }}
          path: product/qualification/dev-candidate/plan.json
          if-no-files-found: error
          retention-days: 14

  proof_probe:
    name: affected-native proof probe / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.decision.outputs.reuse }}
      producer-run-id: ${{ steps.decision.outputs.producer-run-id }}
      producer-event: ${{ steps.decision.outputs.producer-event }}
      producer-head-sha: ${{ steps.decision.outputs.producer-head-sha }}
      artifact-name: ${{ steps.descriptor.outputs.artifact-name }}
      proof-id: ${{ steps.descriptor.outputs.proof-id }}
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Resolve affected native revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$event_head_sha" "$head_sha" || {
            echo "checked-out source does not contain event head $event_head_sha" >&2
            exit 1
          }
          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Capture exact family delivery binding
        id: delivery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          binding=product/qualification/affected-native/proof-probe/delivery-binding.json
          mkdir -p "$(dirname "$binding")"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              pr_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/family-pr-body.txt"
              printf '{"statuses":[]}\n' > "$RUNNER_TEMP/family-status.json"
              base_branch="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              pr_number="$(sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$(jq -r '.merge_group.head_ref' "$GITHUB_EVENT_PATH")")"
              test -n "$pr_number"
              gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/family-pr.json"
              pr_head="$(jq -r '.head.sha' "$RUNNER_TEMP/family-pr.json")"
              jq -r '.body // ""' "$RUNNER_TEMP/family-pr.json" > "$RUNNER_TEMP/family-pr-body.txt"
              gh api "repos/$GITHUB_REPOSITORY/commits/$pr_head/status" > "$RUNNER_TEMP/family-status.json"
              base_branch="$(jq -r '.base.ref' "$RUNNER_TEMP/family-pr.json")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          encoded_branch="$(jq -rn --arg value "$base_branch" '$value | @uri')"
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/$encoded_branch" > "$RUNNER_TEMP/effective-rules.json"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          queue_context="$(jq -r '.requiredContext' docs/qualification/gates/dev-queue-admission.contract.json)"
          # shifu-entry-contract: allow immutable delivery identity capture before Gate dependencies are runnable
          node scripts/affected-native-proof.mjs bind-delivery \
            --event "$GITHUB_EVENT_NAME" \
            --pull-request "$pr_number" \
            --pull-request-head "$pr_head" \
            --dev-head "$GITHUB_BASE_SHA" \
            --candidate-head "$GITHUB_HEAD_SHA" \
            --candidate-tree "$candidate_tree" \
            --pr-body "$RUNNER_TEMP/family-pr-body.txt" \
            --status-file "$RUNNER_TEMP/family-status.json" \
            --rules-file "$RUNNER_TEMP/effective-rules.json" \
            --queue-admission-context "$queue_context" \
            --output "$binding" \
            --github-output "$GITHUB_OUTPUT"
          if ! git cat-file -e "${pr_head}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$pr_head"
          fi
          source_tree="$(git rev-parse "${pr_head}^{tree}")"
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            source_tree="$(jq -er '.source.replayedTree' "$binding")"
          fi
          echo "source-tree=${source_tree}" >> "$GITHUB_OUTPUT"
      - name: Describe exact affected-native proof identity
        id: descriptor
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p product/qualification/affected-native/proof-probe
          # shifu-entry-contract: allow build-free native planning before Gate dependencies are runnable
          node scripts/run-core-affected-native.mjs \
            --plan-out product/qualification/affected-native/proof-probe/plan.json \
            --json
          # shifu-entry-contract: allow hosted toolchain identity capture before Gate dependencies are runnable
          node scripts/affected-native-proof.mjs toolchain \
            --compiler "$CXX" \
            --output product/qualification/affected-native/proof-probe/toolchain.json
          # shifu-entry-contract: allow source-only proof identity calculation before Gate dependencies are runnable
          node scripts/affected-native-proof.mjs describe \
            --plan product/qualification/affected-native/proof-probe/plan.json \
            --toolchain product/qualification/affected-native/proof-probe/toolchain.json \
            --delivery-binding product/qualification/affected-native/proof-probe/delivery-binding.json \
            --source-tree "${{ steps.delivery.outputs.source-tree }}" \
            --output product/qualification/affected-native/proof-probe/descriptor.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload current proof descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-affected-native-proof-descriptor-${{ github.run_id }}
          path: product/qualification/affected-native/proof-probe
          if-no-files-found: error
          retention-days: 14
      - name: Find one exact prior producer proof
        id: lookup
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            (steps.descriptor.outputs.native-required == 'true' ||
             steps.descriptor.outputs.sdk-required == 'true')
          }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # shifu-entry-contract: allow source-only proof lookup before Gate dependencies are runnable
          node scripts/affected-native-proof.mjs lookup \
            --descriptor product/qualification/affected-native/proof-probe/descriptor.json \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download exact prior producer proof
        id: download
        if: ${{ steps.lookup.outputs.reusable == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.descriptor.outputs.artifact-name }}
          path: product/qualification/affected-native/proof-reuse
          repository: ${{ github.repository }}
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify exact prior producer proof
        id: verify
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          descriptor=product/qualification/affected-native/proof-probe/descriptor.json
          bundle=product/qualification/affected-native/proof-reuse
          producer_base="$(jq -er '.source.base' "$bundle"/partition-*.receipt.json | sort -u)"
          current_base="$(jq -er '.identity.base' "$descriptor")"
          delta_args=()
          if [ "$producer_base" != "$current_base" ]; then
            export GITHUB_BASE_SHA="$producer_base"
            export GITHUB_HEAD_SHA="$current_base"
            # shifu-entry-contract: allow source-only dev-delta classification before Gate dependencies are runnable
            node scripts/run-core-affected-native.mjs \
              --plan-out product/qualification/affected-native/proof-probe/dev-delta-plan.json \
              --json
            delta_args=(--dev-delta-plan product/qualification/affected-native/proof-probe/dev-delta-plan.json)
          fi
          # shifu-entry-contract: allow source-only proof verification before Gate dependencies are runnable
          node scripts/affected-native-proof.mjs verify \
            --descriptor "$descriptor" \
            --bundle "$bundle" \
            --repository "$GITHUB_REPOSITORY" \
            --producer-run-id "${{ steps.lookup.outputs.run-id }}" \
            --producer-event "${{ steps.lookup.outputs.producer-event }}" \
            --producer-head-sha "${{ steps.lookup.outputs.producer-head-sha }}" \
            "${delta_args[@]}"
      - name: Select authoritative queue execution
        id: decision
        if: ${{ always() }}
        shell: bash
        env:
          NATIVE_REQUIRED: ${{ steps.descriptor.outputs.native-required }}
          SDK_REQUIRED: ${{ steps.descriptor.outputs.sdk-required }}
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
          LOOKUP_REUSABLE: ${{ steps.lookup.outputs.reusable }}
          PRODUCER_RUN_ID: ${{ steps.lookup.outputs.run-id }}
          PRODUCER_EVENT: ${{ steps.lookup.outputs.producer-event }}
          PRODUCER_HEAD_SHA: ${{ steps.lookup.outputs.producer-head-sha }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          reuse=false
          producer_run_id=""
          producer_event=""
          producer_head_sha=""
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ] && \
             { [ "$NATIVE_REQUIRED" = "true" ] || [ "$SDK_REQUIRED" = "true" ]; } && \
             [ "$LOOKUP_OUTCOME" = "success" ] && \
             [ "$LOOKUP_REUSABLE" = "true" ] && \
             [ "$DOWNLOAD_OUTCOME" = "success" ] && \
             [ "$VERIFY_OUTCOME" = "success" ]; then
            reuse=true
            producer_run_id="$PRODUCER_RUN_ID"
            producer_event="$PRODUCER_EVENT"
            producer_head_sha="$PRODUCER_HEAD_SHA"
          fi
          {
            echo "reuse=${reuse}"
            echo "producer-run-id=${producer_run_id}"
            echo "producer-event=${producer_event}"
            echo "producer-head-sha=${producer_head_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Exact PR or same-SHA queue proof reuse=${reuse}."

  warrant_admission:
    name: Provisional Delivery Warrant admission / linux
    needs:
      - candidate_preflight
      - proof_probe
    if: >-
      ${{
        needs.candidate_preflight.result == 'success' &&
        needs.proof_probe.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull-request: ${{ steps.identity.outputs.pull-request }}
      source-head: ${{ steps.identity.outputs.source-head }}
      protected-base: ${{ steps.identity.outputs.protected-base }}
      qualified-base: ${{ steps.identity.outputs.qualified-base }}
      toolchain-root: ${{ steps.identity.outputs.toolchain-root }}
      environment-root: ${{ steps.identity.outputs.environment-root }}
      allowed-phases: ${{ steps.identity.outputs.allowed-phases }}
    steps:
      - name: Check out exact Buildchain Warrant runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kungfu-systems/buildchain
          # Use the protected v4 read-only compatibility runtime while the
          # mutating dev-pr-auto-merge scheduler retains its v3 authority.
          ref: 0f4004d0d2b2474c2135a3e88d29d9c85bc37834
          path: .buildchain/dev-delivery-runtime
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install exact Buildchain Warrant runtime
        working-directory: .buildchain/dev-delivery-runtime
        run: |
          # shifu-entry-contract: allow exact pinned Buildchain dependency bootstrap before its CLI is runnable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the exact active Warrant before expensive qualification
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              pull_request="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              source_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              protected_base="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
              qualified_base="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              allowed_phase='^(provisional|qualified)$'
              ;;
            merge_group)
              pull_request="$(sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$(jq -r '.merge_group.head_ref' "$GITHUB_EVENT_PATH")")"
              test -n "$pull_request"
              source_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request" --jq .head.sha)"
              protected_base="$(jq -r '.merge_group.base_ref' "$GITHUB_EVENT_PATH" | sed 's#^refs/heads/##')"
              qualified_base="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              allowed_phase='^qualified$'
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          runtime=.buildchain/dev-delivery-runtime
          # shifu-entry-contract: allow exact pinned Buildchain state-ref readback before expensive Gate execution
          node "$runtime/bin/buildchain.mjs" dev warrant observe \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$protected_base" \
            --output .buildchain/warrant-observation.json
          jq -e \
            --argjson pullRequest "$pull_request" \
            --arg sourceHead "$source_head" \
            --arg allowedPhase "$allowed_phase" \
            '.observation.activeWarrant.pullRequestNumber == $pullRequest
             and .observation.activeWarrant.sourceHead == $sourceHead
             and (.observation.activeCandidate.toolchainRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.observation.activeCandidate.environmentRoot | test("^sha256:[0-9a-f]{64}$"))
             and (.observation.activeWarrant.phase | test($allowedPhase))' \
            .buildchain/warrant-observation.json >/dev/null
          {
            echo "pull-request=$pull_request"
            echo "source-head=$source_head"
            echo "protected-base=$protected_base"
            echo "qualified-base=$qualified_base"
            echo "toolchain-root=$(jq -er '.observation.activeCandidate.toolchainRoot' .buildchain/warrant-observation.json)"
            echo "environment-root=$(jq -er '.observation.activeCandidate.environmentRoot' .buildchain/warrant-observation.json)"
            if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
              echo "allowed-phases=qualified"
            else
              echo "allowed-phases=provisional,qualified"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Exact $GITHUB_EVENT_NAME Warrant admitted for PR #$pull_request at $source_head."

  affected_native_shards:
    name: affected-native shard ${{ matrix.partition }} of 2 / linux
    needs:
      - candidate_preflight
      - proof_probe
      - warrant_admission
    if: >-
      ${{
        needs.candidate_preflight.result == 'success' &&
        needs.proof_probe.result == 'success' &&
        needs.warrant_admission.result == 'success' &&
        needs.proof_probe.outputs.reuse != 'true' &&
        (needs.candidate_preflight.outputs.native-required == 'true' ||
         needs.candidate_preflight.outputs.sdk-required == 'true')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        partition: [0, 1]
    env:
      KUNGFU_BUILDCHAIN_SOURCE_BUILD: "1"
      KUNGFU_AFFECTED_NATIVE_PARTITION_COUNT: "2"
      KUNGFU_AFFECTED_NATIVE_PARTITION_INDEX: ${{ matrix.partition }}
      CC: gcc-14
      CXX: g++-14
      KUNGFU_CANDIDATE_GATE_ID: source.changed-scope
      KUNGFU_CANDIDATE_TIMELINE_EVENTS: ${{ github.workspace }}/product/qualification/affected-native/candidate-events.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Resolve affected native revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$event_head_sha" "$head_sha" || {
            echo "checked-out source does not contain event head $event_head_sha" >&2
            exit 1
          }
          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Plan affected native closure from source
        id: plan
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          plan_path="product/qualification/affected-native/plan.json"
          # shifu-entry-contract: allow build-free native planning before Gate dependencies are runnable
          node scripts/run-core-affected-native.mjs \
            --plan-out "$plan_path" \
            --json
          native_required=false
          sdk_required="$(jq -r '.sdkQualification.required' "$plan_path")"
          if [ "$(jq '.closureComponents | length' "$plan_path")" -gt 0 ]; then
            native_required=true
          else
            echo "No native impact; the native closure and portable-cache path are skipped."
            # shifu-entry-contract: allow tier-none receipt writing without dependency bootstrap
            node scripts/run-core-affected-native.mjs \
              --plan-input "$plan_path" \
              --execute
          fi
          required=false
          if [ "$native_required" = "true" ] || [ "$sdk_required" = "true" ]; then
            required=true
          fi
          {
            echo "required=${required}"
            echo "native-required=${native_required}"
            echo "sdk-required=${sdk_required}"
          } >> "$GITHUB_OUTPUT"
      - name: Install pinned source acceptance tools
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        env:
          BUILDCHAIN_CHECK_MODE: source
        # shifu-entry-contract: allow source-tool bootstrap before Gate dependencies are runnable
        run: node scripts/buildchain-install.mjs
      - name: Ensure compiler cache tool
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            installed=false
            for attempt in 1 2; do
              if sudo timeout --signal=TERM 120s apt-get \
                   -o Acquire::Retries=2 \
                   -o Acquire::http::Timeout=30 \
                   -o Acquire::https::Timeout=30 \
                   -o DPkg::Lock::Timeout=30 \
                   update -qq \
                 && sudo timeout --signal=TERM 120s apt-get \
                   -o Acquire::Retries=2 \
                   -o Acquire::http::Timeout=30 \
                   -o Acquire::https::Timeout=30 \
                   -o DPkg::Lock::Timeout=30 \
                   install -y ccache; then
                installed=true
                break
              fi
              echo "ccache installation attempt ${attempt} failed" >&2
            done
            if [ "$installed" != true ]; then
              echo "ccache installation failed after two bounded attempts" >&2
              exit 1
            fi
          fi
          ccache --version
      - name: Write portable cache manifests
        if: ${{ steps.plan.outputs.native-required == 'true' }}
        shell: bash
        run: |
          # shifu-entry-contract: allow Buildchain cache planning before Gate dependencies are runnable
          node scripts/write-affected-native-cache-manifests.mjs \
            --plan product/qualification/affected-native/plan.json \
            --output-dir product/qualification/affected-native/cache
      - name: Plan dependency cache
        if: ${{ steps.plan.outputs.native-required == 'true' }}
        id: dependency-plan
        shell: bash
        run: >-
          ./node_modules/.bin/buildchain portable-cache plan
          --manifest product/qualification/affected-native/cache/dependency.manifest.json
          --output product/qualification/affected-native/cache/dependency.plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        if: ${{ steps.plan.outputs.native-required == 'true' }}
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.dependency-plan.outputs.cache-paths }}
          key: ${{ steps.dependency-plan.outputs.cache-key }}
          restore-keys: ${{ steps.dependency-plan.outputs.restore-keys }}
      - name: Plan compiler cache
        if: ${{ steps.plan.outputs.native-required == 'true' }}
        id: compiler-plan
        shell: bash
        run: >-
          ./node_modules/.bin/buildchain portable-cache plan
          --manifest product/qualification/affected-native/cache/compiler.manifest.json
          --output product/qualification/affected-native/cache/compiler.plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        if: ${{ steps.plan.outputs.native-required == 'true' }}
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.compiler-plan.outputs.cache-paths }}
          key: ${{ steps.compiler-plan.outputs.cache-key }}
          restore-keys: ${{ steps.compiler-plan.outputs.restore-keys }}
      - name: Enable compiler cache when available
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              echo "CCACHE_NOHASHDIR=true"
              echo "CCACHE_COMPRESS=true"
              echo "CCACHE_MAXSIZE=1G"
            } >> "$GITHUB_ENV"
          else
            echo "ccache unavailable; the current build remains the cold authority"
          fi
      - name: Reset compiler cache statistics
        if: ${{ steps.plan.outputs.required == 'true' }}
        shell: bash
        run: ccache --zero-stats
      - name: Run all expensive native qualification under the live Warrant
        if: ${{ steps.plan.outputs.required == 'true' }}
        id: native-gate
        uses: ./.github/actions/native-execution-under-warrant
        with:
          pull-request: ${{ needs.warrant_admission.outputs.pull-request }}
          source-head: ${{ needs.warrant_admission.outputs.source-head }}
          protected-base: ${{ needs.warrant_admission.outputs.protected-base }}
          qualified-base: ${{ needs.warrant_admission.outputs.qualified-base }}
          toolchain-root: ${{ needs.warrant_admission.outputs.toolchain-root }}
          environment-root: ${{ needs.warrant_admission.outputs.environment-root }}
          allowed-phases: ${{ needs.warrant_admission.outputs.allowed-phases }}
          output: product/qualification/affected-native/warrant-execution-${{ matrix.partition }}.json
          command: |
            set -euo pipefail
            export GITHUB_BASE_SHA='${{ steps.revisions.outputs.base_sha }}'
            export GITHUB_HEAD_SHA='${{ steps.revisions.outputs.head_sha }}'
            export KUNGFU_AFFECTED_NATIVE_PLAN=product/qualification/affected-native/plan.json
            ./shifu install --frozen-lockfile
            if [ '${{ steps.plan.outputs.sdk-required }}' = true ] && [ '${{ matrix.partition }}' = 0 ]; then
              cmake_js_bin=""
              for candidate in node_modules/.pnpm/cmake-js@*/node_modules/cmake-js/bin/cmake-js; do
                if [ -x "$candidate" ]; then cmake_js_bin="$candidate"; break; fi
              done
              test -n "$cmake_js_bin"
              export PATH="$GITHUB_WORKSPACE/$(dirname "$cmake_js_bin"):$PATH"
              cmake-js --version
              ./shifu build:core:sdk
              ./shifu pack:sdk
              ./shifu layers:qualify:sdk -- --report product/qualification/affected-native/layered-sdk-report.json
            fi
            if [ '${{ steps.plan.outputs.native-required }}' = true ]; then
              ./shifu gate run source.changed-scope --omit-dependency source.acceptance --capability native-toolchain
            fi
      - name: Record compiler cache statistics
        if: ${{ always() && steps.plan.outputs.native-required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/qualification/affected-native/cache
          ccache --show-stats --verbose | tee product/qualification/affected-native/cache/compiler-stats.txt
      - name: Seal portable cache receipts
        if: ${{ steps.native-gate.outcome == 'success' }}
        shell: bash
        env:
          DEPENDENCY_MATCHED_KEY: ${{ steps.dependency-cache.outputs.cache-matched-key }}
          DEPENDENCY_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
          COMPILER_MATCHED_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
          COMPILER_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          seal() {
            layer="$1"
            matched_key="$2"
            cache_hit="$3"
            fallback_status="not-run"
            if [ -z "$matched_key" ]; then fallback_status="passed"; fi
            ./node_modules/.bin/buildchain portable-cache receipt \
              --plan "product/qualification/affected-native/cache/${layer}.plan.json" \
              --matched-key "$matched_key" \
              --cache-hit "$cache_hit" \
              --validation-status pass \
              --cold-fallback-status "$fallback_status" \
              --output "product/qualification/affected-native/cache/${layer}.receipt.json"
          }
          seal dependency "$DEPENDENCY_MATCHED_KEY" "$DEPENDENCY_HIT"
          seal compiler "$COMPILER_MATCHED_KEY" "$COMPILER_HIT"
      - name: Seal cache promotion payload
        if: >-
          ${{
            (github.event_name == 'pull_request' ||
             github.event_name == 'merge_group') &&
            steps.native-gate.outcome == 'success'
          }}
        shell: bash
        run: |
          set -euo pipefail
          qualification="product/qualification/affected-native"
          payload="${qualification}/cache/payload"
          mkdir -p "$payload"
          test -d "$HOME/.cache/ccache"
          tar --format=ustar -cf "$payload/compiler.tar" -C "$HOME" .cache/ccache
          dependency_args=()
          if [ "$KUNGFU_AFFECTED_NATIVE_PARTITION_INDEX" = "0" ]; then
            test -d "$HOME/.conan2/p"
            tar --format=ustar -cf "$payload/dependency.tar" -C "$HOME" .conan2/p
            dependency_args=(
              --dependency-archive "$payload/dependency.tar"
            )
          fi
          # shifu-entry-contract: allow sealing post-build cache transport evidence without re-entering the Gate
          node scripts/write-affected-native-cache-manifests.mjs seal \
            --qualification-dir "$qualification" \
            --output "$payload/payload.manifest.json" \
            --partition-index "$KUNGFU_AFFECTED_NATIVE_PARTITION_INDEX" \
            --partition-count "$KUNGFU_AFFECTED_NATIVE_PARTITION_COUNT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --event "$GITHUB_EVENT_NAME" \
            --head-sha "$GITHUB_SHA" \
            --compiler-archive "$payload/compiler.tar" \
            "${dependency_args[@]}"
      - name: Upload raw plan, receipt, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-affected-native-${{ github.sha }}-partition-${{ matrix.partition }}-of-2
          path: product/qualification/affected-native
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  shifu_workspace:
    name: Shifu workspace / linux
    needs:
      - candidate_preflight
      - proof_probe
      - warrant_admission
    if: >-
      ${{
        needs.candidate_preflight.result == 'success' &&
        needs.proof_probe.result == 'success' &&
        needs.warrant_admission.result == 'success' &&
        needs.proof_probe.outputs.reuse != 'true' &&
        needs.candidate_preflight.outputs.shifu-required == 'true'
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - name: Run required Linux Shifu workspace Gate
        uses: ./.github/actions/native-execution-under-warrant
        with:
          pull-request: ${{ needs.warrant_admission.outputs.pull-request }}
          source-head: ${{ needs.warrant_admission.outputs.source-head }}
          protected-base: ${{ needs.warrant_admission.outputs.protected-base }}
          qualified-base: ${{ needs.warrant_admission.outputs.qualified-base }}
          toolchain-root: ${{ needs.warrant_admission.outputs.toolchain-root }}
          environment-root: ${{ needs.warrant_admission.outputs.environment-root }}
          allowed-phases: ${{ needs.warrant_admission.outputs.allowed-phases }}
          output: product/qualification/affected-native/shifu-warrant-execution.json
          command: |
            ./shifu install --frozen-lockfile
            ./shifu gate run shifu.workspace --capability rust

  kfd_verifier:
    name: KFD verifier / linux
    needs:
      - candidate_preflight
      - proof_probe
      - warrant_admission
    if: >-
      ${{
        needs.candidate_preflight.result == 'success' &&
        needs.proof_probe.result == 'success' &&
        needs.warrant_admission.result == 'success' &&
        needs.proof_probe.outputs.reuse != 'true' &&
        needs.candidate_preflight.outputs.kfd-required == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Verify product-owned fixtures under the live Warrant
        uses: ./.github/actions/native-execution-under-warrant
        with:
          pull-request: ${{ needs.warrant_admission.outputs.pull-request }}
          source-head: ${{ needs.warrant_admission.outputs.source-head }}
          protected-base: ${{ needs.warrant_admission.outputs.protected-base }}
          qualified-base: ${{ needs.warrant_admission.outputs.qualified-base }}
          toolchain-root: ${{ needs.warrant_admission.outputs.toolchain-root }}
          environment-root: ${{ needs.warrant_admission.outputs.environment-root }}
          allowed-phases: ${{ needs.warrant_admission.outputs.allowed-phases }}
          output: product/qualification/affected-native/kfd-warrant-execution.json
          command: |
            ./shifu install --frozen-lockfile
            ./shifu kfd:verify-owned-fixtures

  affected_native:
    name: affected-native / linux
    if: ${{ always() }}
    needs:
      - dco
      - source_acceptance
      - candidate_preflight
      - proof_probe
      - warrant_admission
      - affected_native_shards
      - shifu_workspace
      - kfd_verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: read
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed without the exact active Warrant
        if: ${{ needs.warrant_admission.result != 'success' }}
        shell: bash
        run: |
          echo "Expensive native qualification requires the exact active Delivery Warrant." >&2
          exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kungfu-systems/buildchain
          # Read the scheduler's legacy v3 queue through the protected v4
          # compatibility path without moving mutation authority.
          ref: 0f4004d0d2b2474c2135a3e88d29d9c85bc37834
          path: .buildchain/dev-delivery-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Install pinned Buildchain proof runtime
        working-directory: .buildchain/dev-delivery-runtime
        run: |
          # shifu-entry-contract: allow exact pinned Buildchain dependency bootstrap before its CLI is runnable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Admit staged candidate dependency graph
        shell: bash
        env:
          DCO_RESULT: ${{ needs.dco.result }}
          SOURCE_RESULT: ${{ needs.source_acceptance.result }}
          PREFLIGHT_RESULT: ${{ needs.candidate_preflight.result }}
          PROBE_RESULT: ${{ needs.proof_probe.result }}
          REUSE: ${{ needs.proof_probe.outputs.reuse }}
          NATIVE_REQUIRED: ${{ needs.candidate_preflight.outputs.native-required }}
          SDK_REQUIRED: ${{ needs.candidate_preflight.outputs.sdk-required }}
          SHIFU_REQUIRED: ${{ needs.candidate_preflight.outputs.shifu-required }}
          KFD_REQUIRED: ${{ needs.candidate_preflight.outputs.kfd-required }}
          NATIVE_RESULT: ${{ needs.affected_native_shards.result }}
          SHIFU_RESULT: ${{ needs.shifu_workspace.result }}
          KFD_RESULT: ${{ needs.kfd_verifier.result }}
        run: |
          set -euo pipefail
          require_result() {
            label="$1"
            expected="$2"
            actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "$label must be $expected, got $actual" >&2
              exit 1
            fi
          }
          require_result "source acceptance" success "$SOURCE_RESULT"
          require_result "candidate preflight" success "$PREFLIGHT_RESULT"
          require_result "impact probe" success "$PROBE_RESULT"
          require_optional_gate() {
            label="$1"
            required="$2"
            actual="$3"
            expected=skipped
            if [ "$required" = "true" ]; then expected=success; fi
            require_result "$label" "$expected" "$actual"
          }
          native_or_sdk=false
          if [ "$NATIVE_REQUIRED" = "true" ] || [ "$SDK_REQUIRED" = "true" ]; then
            native_or_sdk=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            require_result "PR DCO" success "$DCO_RESULT"
            require_optional_gate "PR affected-native" "$native_or_sdk" "$NATIVE_RESULT"
            require_optional_gate "PR Shifu workspace" "$SHIFU_REQUIRED" "$SHIFU_RESULT"
            require_optional_gate "PR KFD verifier" "$KFD_REQUIRED" "$KFD_RESULT"
            echo "PR staged qualification passed."
          elif [ "$REUSE" = "true" ]; then
            require_result "queue DCO" skipped "$DCO_RESULT"
            require_result "reused queue affected-native" skipped "$NATIVE_RESULT"
            require_result "reused queue Shifu workspace" skipped "$SHIFU_RESULT"
            require_result "reused queue KFD verifier" skipped "$KFD_RESULT"
          else
            require_result "queue DCO" skipped "$DCO_RESULT"
            require_optional_gate "queue affected-native" "$native_or_sdk" "$NATIVE_RESULT"
            require_optional_gate "queue Shifu workspace" "$SHIFU_REQUIRED" "$SHIFU_RESULT"
            require_optional_gate "queue KFD verifier" "$KFD_REQUIRED" "$KFD_RESULT"
          fi
          echo "Staged candidate qualification passed."
      - name: Download current proof descriptor
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-affected-native-proof-descriptor-${{ github.run_id }}
          path: product/qualification/affected-native/proof-admission/probe
      - name: Revalidate exact affected-native source binding
        shell: bash
        env:
          PROBE_ARTIFACT_NAME: ${{ needs.proof_probe.outputs.artifact-name }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
              event_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$event_head_sha" "$head_sha"
          admission=product/qualification/affected-native/proof-admission
          descriptor="$admission/probe/descriptor.json"
          toolchain="$admission/probe/toolchain.json"
          test -s "$descriptor"
          test -s "$toolchain"
          export GITHUB_BASE_SHA="$base_sha"
          export GITHUB_HEAD_SHA="$head_sha"
          # shifu-entry-contract: allow build-free native planning before Gate dependencies are runnable
          node scripts/run-core-affected-native.mjs \
            --plan-out "$admission/plan.json" \
            --json
          binding="$admission/probe/delivery-binding.json"
          binding_state="$(jq -er '.state' "$binding")"
          case "$binding_state" in
            bound)
              source_tree="$(jq -er '.source.replayedTree' "$binding")"
              test "$(git rev-parse 'HEAD^{tree}')" = "$source_tree"
              ;;
            unbound)
              source_head="$(jq -er '.source.pullRequestHead' "$binding")"
              if ! git cat-file -e "${source_head}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$source_head"
              fi
              source_tree="$(git rev-parse "${source_head}^{tree}")"
              ;;
            *)
              echo "unsupported affected-native delivery binding state: $binding_state" >&2
              exit 1
              ;;
          esac
          # Preserve the probe's exact hosted image and toolchain facts while
          # independently rechecking this checkout's base, source tree, and plan.
          # shifu-entry-contract: allow source-only proof revalidation after dependency admission
          node scripts/affected-native-proof.mjs describe \
            --plan "$admission/plan.json" \
            --toolchain "$toolchain" \
            --delivery-binding "$admission/probe/delivery-binding.json" \
            --source-tree "$source_tree" \
            --output "$admission/recomputed-descriptor.json"
          cmp "$descriptor" "$admission/recomputed-descriptor.json"
          test "$PROBE_ARTIFACT_NAME" = "$(jq -r '.artifactName' "$descriptor")"
          cp "$descriptor" "$admission/descriptor.json"
      - name: Download admitted producer proof
        if: ${{ needs.proof_probe.outputs.reuse == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.proof_probe.outputs.artifact-name }}
          path: product/qualification/affected-native/proof-reuse
          repository: ${{ github.repository }}
          run-id: ${{ needs.proof_probe.outputs.producer-run-id }}
          github-token: ${{ github.token }}
      - name: Download current partition evidence
        if: >-
          ${{
            needs.proof_probe.outputs.reuse != 'true' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-affected-native-${{ github.sha }}-partition-*-of-2
          path: product/qualification/affected-native/proof-input
      - name: Admit exact producer partition set
        id: admit
        shell: bash
        env:
          PARTITION_RESULT: ${{ needs.affected_native_shards.result }}
          NATIVE_REQUIRED: ${{ needs.candidate_preflight.outputs.native-required }}
          SDK_REQUIRED: ${{ needs.candidate_preflight.outputs.sdk-required }}
          REUSE: ${{ needs.proof_probe.outputs.reuse }}
          PRODUCER_RUN_ID: ${{ needs.proof_probe.outputs.producer-run-id }}
          PRODUCER_EVENT: ${{ needs.proof_probe.outputs.producer-event }}
          PRODUCER_HEAD_SHA: ${{ needs.proof_probe.outputs.producer-head-sha }}
        run: |
          set -euo pipefail
          descriptor=product/qualification/affected-native/proof-admission/descriptor.json
          if [ "$NATIVE_REQUIRED" != "true" ] && [ "$SDK_REQUIRED" != "true" ]; then
            echo "The source-impact plan explicitly requires no native or SDK qualification."
            echo "proof-created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REUSE" = "true" ]; then
            if [ "$PARTITION_RESULT" != "skipped" ]; then
              echo "reused affected-native partitions must be skipped: $PARTITION_RESULT" >&2
              exit 1
            fi
            bundle=product/qualification/affected-native/proof-reuse
            producer_base="$(jq -er '.source.base' "$bundle"/partition-*.receipt.json | sort -u)"
            current_base="$(jq -er '.identity.base' "$descriptor")"
            delta_args=()
            if [ "$producer_base" != "$current_base" ]; then
              export GITHUB_BASE_SHA="$producer_base"
              export GITHUB_HEAD_SHA="$current_base"
              # shifu-entry-contract: allow source-only dev-delta classification after aggregate dependency admission
              node scripts/run-core-affected-native.mjs \
                --plan-out product/qualification/affected-native/proof-admission/dev-delta-plan.json \
                --json
              delta_args=(--dev-delta-plan product/qualification/affected-native/proof-admission/dev-delta-plan.json)
            fi
            # shifu-entry-contract: allow source-bound proof verification after aggregate dependency admission
            node scripts/affected-native-proof.mjs verify \
              --descriptor "$descriptor" \
              --bundle "$bundle" \
              --repository "$GITHUB_REPOSITORY" \
              --producer-run-id "$PRODUCER_RUN_ID" \
              --producer-event "$PRODUCER_EVENT" \
              --producer-head-sha "$PRODUCER_HEAD_SHA" \
              "${delta_args[@]}"
            echo "proof-created=false" >> "$GITHUB_OUTPUT"
            echo "Exact successful producer proof admitted; repeated heavy gates remained skipped."
            exit 0
          fi
          if [ "$PARTITION_RESULT" != "success" ]; then
            echo "affected-native partition set is not complete: $PARTITION_RESULT" >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request) trigger_head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")" ;;
            merge_group) trigger_head_sha="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")" ;;
            *) echo "unsupported producer event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          # shifu-entry-contract: allow source-bound proof sealing after both native partitions passed
          node scripts/affected-native-proof.mjs seal \
            --descriptor "$descriptor" \
            --input-dir product/qualification/affected-native/proof-input \
            --output-dir product/qualification/affected-native/proof-bundle \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --event "$GITHUB_EVENT_NAME" \
            --trigger-head-sha "$trigger_head_sha" \
            --checkout-sha "$(git rev-parse HEAD)"
          echo "proof-created=true" >> "$GITHUB_OUTPUT"
          echo "All affected-native partitions passed."
      - name: Project exact PR qualification into Buildchain Source Proof
        id: source_proof
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        shell: bash
        env:
          REUSE: ${{ needs.proof_probe.outputs.reuse }}
        run: |
          set -euo pipefail
          admission=product/qualification/affected-native
          bundle="$admission/proof-bundle"
          if [ "$REUSE" = "true" ]; then bundle="$admission/proof-reuse"; fi
          native_receipt="$(find "$bundle" -name '*.receipt.json' -type f | LC_ALL=C sort | head -n 1)"
          test -n "$native_receipt"
          output=.buildchain/dev-delivery-warrant/source
          mkdir -p "$output"
          source_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          pull_request="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          protected_base="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
          # shifu-entry-contract: allow exact qualification projection after native proof admission
          node scripts/affected-native-proof.mjs source-input \
            --repository "$GITHUB_REPOSITORY" \
            --protected-base "$protected_base" \
            --pull-request "$pull_request" \
            --source-head "$source_head" \
            --descriptor "$admission/proof-admission/descriptor.json" \
            --proof "$bundle/proof.json" \
            --native-receipt "$native_receipt" \
            --output "$output/input.json"
          jq -n \
            --argjson number "$pull_request" \
            --arg head "$source_head" \
            --arg base "$protected_base" \
            '{number:$number,head:{sha:$head},base:{ref:$base}}' \
            > "$output/pull-request.json"
          # Keep Source Proof roots identical to the protected Warrant caller.
          # shifu-entry-contract: allow exact Warrant contract projection after native proof admission
          node scripts/dev-delivery-warrant-input.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$output/pull-request.json" \
            --descriptor "$admission/proof-admission/descriptor.json" \
            --plan "$admission/proof-admission/plan.json" \
            --output "$output/warrant-input.json"
          # shifu-entry-contract: allow exact pinned Buildchain Source Proof creation in CI
          node .buildchain/dev-delivery-runtime/bin/buildchain.mjs dev proof source \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$protected_base" \
            --source-identity-root "$(jq -er '.sourceIdentityRoot' "$output/warrant-input.json")" \
            --source-head "$source_head" \
            --source-patch-root "$(jq -er '.sourcePatchRoot' "$output/warrant-input.json")" \
            --plan-root "$(jq -er '.planRoot' "$output/warrant-input.json")" \
            --closure-root "$(jq -er '.closureRoot' "$output/warrant-input.json")" \
            --dependency-root "$(jq -er '.dependencyRoot' "$output/warrant-input.json")" \
            --toolchain-root "$(jq -er '.toolchainRoot' "$output/warrant-input.json")" \
            --affected-paths-json "$(jq -c '.affectedPaths' "$output/warrant-input.json")" \
            --shard-evidence-roots-json "$(jq -c '.shardEvidenceRoots' "$output/warrant-input.json")" \
            --qualified-at "$(jq -er '.producer.createdAt' "$bundle/proof.json")" \
            --output "$output/proof.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg protectedBase "$protected_base" \
            --argjson pullRequestNumber "$pull_request" \
            --arg sourceHeadSha "$source_head" \
            --arg sourceBaseSha "$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")" \
            --arg nativeProofRoot "$(jq -r '.proofRoot' "$bundle/proof.json")" \
            '{schema:"kungfu.dev-delivery-source-coordinate/v1",
              repository:$repository, protectedBase:$protectedBase,
              pullRequestNumber:$pullRequestNumber, sourceHeadSha:$sourceHeadSha,
              sourceBaseSha:$sourceBaseSha, nativeProofRoot:$nativeProofRoot}' \
            > "$output/coordinate.json"
          echo "source-head=$source_head" >> "$GITHUB_OUTPUT"
      - name: Upload exact Buildchain Source Proof
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-dev-delivery-source-proof-${{ steps.source_proof.outputs.source-head }}
          path: .buildchain/dev-delivery-warrant/source
          if-no-files-found: error
          retention-days: 14
      - name: Seal reconstructable family delivery attempt
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        shell: bash
        env:
          REUSE: ${{ needs.proof_probe.outputs.reuse }}
        run: |
          set -euo pipefail
          admission=product/qualification/affected-native
          decision=fresh
          bundle="$admission/proof-bundle"
          if [ "$REUSE" = "true" ]; then
            decision=reused
            bundle="$admission/proof-reuse"
          fi
          delta_args=()
          delta_plan="$admission/proof-admission/dev-delta-plan.json"
          if [ -f "$delta_plan" ]; then
            delta_args=(--dev-delta-plan "$delta_plan")
          fi
          # shifu-entry-contract: allow attempt sealing after exact proof admission
          node scripts/affected-native-proof.mjs seal-attempt \
            --descriptor "$admission/proof-admission/descriptor.json" \
            --bundle "$bundle" \
            --decision "$decision" \
            --output-dir "$admission/delivery-attempt" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --event "$GITHUB_EVENT_NAME" \
            --trigger-head-sha "$GITHUB_SHA" \
            --checkout-sha "$(git rev-parse HEAD)" \
            "${delta_args[@]}"
      - name: Consume Warrant and record exact Integration Delivery Proof
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)- ]]; then
            pull_request="${BASH_REMATCH[1]}"
          else
            echo "Cannot resolve one PR from merge-group head ref: $MERGE_GROUP_HEAD_REF" >&2
            exit 1
          fi
          source_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request" --jq .head.sha)"
          protected_base="$(jq -r '.merge_group.base_ref' "$GITHUB_EVENT_PATH" | sed 's#^refs/heads/##')"
          output=.buildchain/dev-delivery-warrant/integration
          mkdir -p "$output"
          runtime=.buildchain/dev-delivery-runtime
          # shifu-entry-contract: allow exact pinned Buildchain state-ref readback in CI
          node "$runtime/bin/buildchain.mjs" dev warrant observe \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$protected_base" \
            --output "$output/warrant-result.json"
          # shifu-entry-contract: allow exact Warrant consumer verification in CI
          node scripts/affected-native-proof.mjs queue-lease-verify \
            --view "$output/warrant-result.json" \
            --pull-request "$pull_request" \
            --source-head "$source_head" \
            --output "$output/queue-lease-receipt.json"
          read -r owner repo <<<"${GITHUB_REPOSITORY//\// }"
          query='query($owner:String!,$repo:String!,$branch:String!){repository(owner:$owner,name:$repo){mergeQueue(branch:$branch){entries(first:100){nodes{id state pullRequest{number headRefOid}}}}}}'
          gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" \
            -f branch="$protected_base" > "$output/queue.json"
          jq --argjson number "$pull_request" --arg head "$source_head" \
            '.data.repository.mergeQueue.entries.nodes
             | map(select(.pullRequest.number == $number and .pullRequest.headRefOid == $head))
             | if length == 1 then .[0] else error("exact merge queue entry not found") end
             | {id, state, pullRequestNumber: .pullRequest.number,
                pullRequestHeadSha: .pullRequest.headRefOid}' \
            "$output/queue.json" > "$output/queue-entry.json"
          # shifu-entry-contract: allow exact merge-group proof input projection in CI
          node scripts/affected-native-proof.mjs integration-input \
            --view "$output/warrant-result.json" \
            --delivery-attempt product/qualification/affected-native/delivery-attempt/delivery-attempt.json \
            --queue-entry "$output/queue-entry.json" \
            --queue-lease-receipt "$output/queue-lease-receipt.json" \
            --pull-request "$pull_request" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --output "$output/input.json"
          # shifu-entry-contract: allow exact pinned Buildchain Integration Proof creation in CI
          node "$runtime/bin/buildchain.mjs" dev proof integration \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$protected_base" \
            --source-proof-root "$(jq -er '.proofInput.sourceProofRoot' "$output/input.json")" \
            --warrant-result "$output/warrant-result.json" \
            --current-base "$(jq -er '.proofInput.currentBase' "$output/input.json")" \
            --replay-tree "$(jq -er '.proofInput.replayTree' "$output/input.json")" \
            --merge-group-head "$(jq -er '.proofInput.mergeGroupHead' "$output/input.json")" \
            --merge-group-tree "$(jq -er '.proofInput.mergeGroupTree' "$output/input.json")" \
            --required-context-roots-json "$(jq -c '.proofInput.requiredContextRoots' "$output/input.json")" \
            --verified-at "$(jq -er '.proofInput.verifiedAt' "$output/input.json")" \
            --output "$output/proof.json"
      - name: Upload exact Integration Delivery Proof
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-dev-delivery-integration-proof-${{ github.sha }}
          path: .buildchain/dev-delivery-warrant/integration
          if-no-files-found: error
          retention-days: 14
      - name: Upload reconstructable family delivery attempt
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            (needs.candidate_preflight.outputs.native-required == 'true' ||
             needs.candidate_preflight.outputs.sdk-required == 'true')
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-affected-native-delivery-attempt-${{ github.sha }}
          path: product/qualification/affected-native/delivery-attempt
          if-no-files-found: error
          retention-days: 14
      - name: Seal reused-proof cache promotion authority
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            needs.proof_probe.outputs.reuse == 'true'
          }}
        shell: bash
        env:
          PRODUCER_RUN_ID: ${{ needs.proof_probe.outputs.producer-run-id }}
          PRODUCER_EVENT: ${{ needs.proof_probe.outputs.producer-event }}
          PRODUCER_HEAD_SHA: ${{ needs.proof_probe.outputs.producer-head-sha }}
        run: |
          set -euo pipefail
          admission=product/qualification/affected-native
          delta_args=()
          delta_plan="$admission/proof-admission/dev-delta-plan.json"
          if [ -f "$delta_plan" ]; then
            delta_args=(--dev-delta-plan "$delta_plan")
          fi
          # shifu-entry-contract: allow sealing post-admission cache transport authority
          node scripts/affected-native-proof.mjs seal-cache-authority \
            --descriptor "$admission/proof-admission/descriptor.json" \
            --bundle "$admission/proof-reuse" \
            --output-dir "$admission/cache-promotion-authority" \
            --repository "$GITHUB_REPOSITORY" \
            --target-run-id "$GITHUB_RUN_ID" \
            --target-head-sha "$GITHUB_SHA" \
            --target-source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-event "$PRODUCER_EVENT" \
            --producer-head-sha "$PRODUCER_HEAD_SHA" \
            "${delta_args[@]}"
      - name: Upload authoritative producer proof
        if: ${{ steps.admit.outputs.proof-created == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.proof_probe.outputs.artifact-name }}
          path: product/qualification/affected-native/proof-bundle
          if-no-files-found: error
          retention-days: 14
      - name: Upload reused-proof cache promotion authority
        if: >-
          ${{
            github.event_name == 'merge_group' &&
            needs.proof_probe.outputs.reuse == 'true'
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-affected-native-cache-promotion-authority-${{ github.run_id }}
          path: product/qualification/affected-native/cache-promotion-authority
          if-no-files-found: error
          retention-days: 14
