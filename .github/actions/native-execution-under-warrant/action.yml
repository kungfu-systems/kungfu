# SPDX-License-Identifier: Apache-2.0

name: Run native execution under Delivery Warrant
description: Observe, heartbeat, and continuously fence one native command with the exact protected Buildchain runtime.

inputs:
  command:
    description: Native command executed only while the exact Warrant remains live.
    required: true
  pull-request:
    description: Exact Delivery Warrant pull request number.
    required: true
  source-head:
    description: Exact Delivery Warrant source head.
    required: true
  protected-base:
    description: Exact protected dev branch.
    required: true
  qualified-base:
    description: Exact protected base commit used by the native execution.
    required: true
  toolchain-root:
    description: Exact native toolchain contract root.
    required: true
  environment-root:
    description: Exact native execution environment contract root.
    required: true
  allowed-phases:
    description: Comma-separated Warrant phases admitted for this execution.
    required: true
  output:
    description: Consumer receipt path.
    required: true

runs:
  using: composite
  steps:
    - name: Check out protected Buildchain Warrant runtime
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: kungfu-systems/buildchain
        ref: 507d8e17099d2cd02fb38aa5bb49a5c06addfbe3
        path: .buildchain/dev-delivery-native-runtime
        fetch-depth: 1
        persist-credentials: false
    - name: Install protected Buildchain Warrant runtime
      shell: bash
      working-directory: .buildchain/dev-delivery-native-runtime
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 507d8e17099d2cd02fb38aa5bb49a5c06addfbe3
        if [ ! -d node_modules ]; then
          # shifu-entry-contract: allow exact pinned Buildchain dependency bootstrap before its CLI is runnable
          corepack pnpm install --frozen-lockfile --ignore-scripts
        fi
    - name: Execute only under the live fenced Warrant
      shell: bash
      env:
        # This marker is set by the checked-in protected action, then paired
        # with the GitHub-hosted Linux /proc ancestry proof in Buildchain.
        BUILDCHAIN_CREDENTIAL_ANCESTRY_BOUNDARY: github-actions-runner-worker/v1
        KUNGFU_NATIVE_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        runtime=.buildchain/dev-delivery-native-runtime
        warrant=.buildchain/dev-delivery-native-runtime/warrant.json
        # Provider credential use is confined to sibling heartbeat processes.
        # It must never be inherited by the candidate native process or any of
        # that process's ancestors.
        GITHUB_TOKEN='${{ github.token }}' node "$runtime/scripts/dev-delivery-warrant.mjs" observe \
          --repository "$GITHUB_REPOSITORY" \
          --branch "${{ inputs.protected-base }}" \
          --output "$warrant"
        jq -e \
          --argjson pr '${{ inputs.pull-request }}' \
          --arg head '${{ inputs.source-head }}' \
          --arg phases '${{ inputs.allowed-phases }}' \
          '.observation.activeWarrant.pullRequestNumber == $pr
           and .observation.activeCandidate.pullRequestNumber == $pr
           and .observation.activeWarrant.sourceHead == $head
           and .observation.activeCandidate.sourceHead == $head
           and (.observation.activeWarrant.phase | IN($phases | split(",")[]))' \
          "$warrant" >/dev/null
        fence="$(jq -er '.observation.activeWarrant.fencingToken' "$warrant")"
        generation="$(jq -er '.observation.activeWarrant.generation' "$warrant")"
        heartbeat() {
          GITHUB_TOKEN='${{ github.token }}' node "$runtime/scripts/dev-delivery-warrant.mjs" heartbeat \
            --repository "$GITHUB_REPOSITORY" \
            --branch "${{ inputs.protected-base }}" \
            --fencing-token "$fence" \
            --lease-generation "$generation" \
            --lease-seconds 5400 \
            --execute
        }
        heartbeat
        setsid env -u GITHUB_TOKEN \
          BUILDCHAIN_CREDENTIAL_ANCESTRY_BOUNDARY="$BUILDCHAIN_CREDENTIAL_ANCESTRY_BOUNDARY" \
          KUNGFU_NATIVE_COMMAND="$KUNGFU_NATIVE_COMMAND" \
          node framework/dev-delivery/native-under-warrant.mjs \
          --repository "$GITHUB_REPOSITORY" \
          --target-branch "${{ inputs.protected-base }}" \
          --pull-request "${{ inputs.pull-request }}" \
          --expected-head "${{ inputs.source-head }}" \
          --status-context 'affected-native / linux' \
          --output "${{ inputs.output }}" &
        native_pid=$!
        (
          while sleep 300; do
            if ! heartbeat; then
              kill -TERM -- "-$native_pid" || true
              exit 75
            fi
          done
        ) &
        heartbeat_pid=$!
        set +e
        wait "$native_pid"
        native_status=$?
        kill "$heartbeat_pid" 2>/dev/null
        wait "$heartbeat_pid"
        heartbeat_status=$?
        set -e
        if [ "$heartbeat_status" -eq 75 ]; then
          echo 'native Warrant heartbeat failed and fenced the candidate process' >&2
          exit 1
        fi
        if [ "$native_status" -ne 0 ]; then exit "$native_status"; fi
        heartbeat
