# SPDX-License-Identifier: Apache-2.0

name: Build Qualified Core candidate
description: Build and seal one exact platform row from a protected source checkout.

inputs:
  row:
    description: Qualified Core platform row.
    required: true
  runner-label:
    description: Exact GitHub-hosted runner label.
    required: true
  runner-os:
    description: Exact GitHub runner operating-system identity.
    required: true
  runner-arch:
    description: Exact GitHub runner architecture identity.
    required: true
  node-platform:
    description: Expected Node platform.
    required: true
  node-arch:
    description: Expected Node architecture.
    required: true
  cc:
    description: Optional exact C compiler command required by this row.
    required: false
    default: ""
  cxx:
    description: Optional exact C++ compiler command required by this row.
    required: false
    default: ""
  native-already-built:
    description: Skip native build commands when a live Warrant wrapper already completed them.
    required: false
    default: "false"
  producer-event:
    description: GitHub Actions event that owns this candidate transport.
    required: false
    default: merge_group
  producer-workflow-path:
    description: Repository-relative workflow path that owns this candidate transport.
    required: false
    default: .github/workflows/affected-native-pr.yml

runs:
  using: composite
  steps:
    - name: Build and seal on POSIX
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = "${{ inputs.runner-os }}"
        test "$RUNNER_ARCH" = "${{ inputs.runner-arch }}"
        test "$(node -p process.platform)" = "${{ inputs.node-platform }}"
        test "$(node -p process.arch)" = "${{ inputs.node-arch }}"
        if [ -n "${{ inputs.cc }}" ] || [ -n "${{ inputs.cxx }}" ]; then
          test -n "${{ inputs.cc }}"
          test -n "${{ inputs.cxx }}"
          command -v "${{ inputs.cc }}" >/dev/null
          command -v "${{ inputs.cxx }}" >/dev/null
          export CC="${{ inputs.cc }}"
          export CXX="${{ inputs.cxx }}"
        fi
        if [ "${{ inputs.native-already-built }}" != "true" ]; then
          ./shifu install --frozen-lockfile
          ./shifu rebuild:core
          ./shifu test:node-watcher-runtime-boundary
          ./shifu test:agent-session-peer-transport:native
        fi
        node product/release/qualified-assignment-core-artifact.mjs seal \
          --repository-root . \
          --payload-root framework/core/dist/kungfu \
          --plan product/qualification/qualified-core/input/plan.json \
          --output-dir product/qualification/qualified-core/candidate \
          --repository "$GITHUB_REPOSITORY" \
          --run-id "$GITHUB_RUN_ID" \
          --event "${{ inputs.producer-event }}" \
          --workflow-path "${{ inputs.producer-workflow-path }}" \
          --platform-row "${{ inputs.row }}" \
          --runner-label "${{ inputs.runner-label }}" \
          --runner-environment github-hosted \
          --runner-os "$RUNNER_OS" \
          --runner-arch "$RUNNER_ARCH" \
          --runner-image-os "${ImageOS:-}" \
          --runner-image-version "${ImageVersion:-}" \
          --profile "$KUNGFU_BUILD_PROFILE" \
          --github-output "$GITHUB_OUTPUT"
    - name: Build and seal on Windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne "${{ inputs.runner-os }}") { throw "runner OS drift" }
        if ($env:RUNNER_ARCH -ne "${{ inputs.runner-arch }}") { throw "runner architecture drift" }
        if ((node -p process.platform) -ne "${{ inputs.node-platform }}") { throw "Node platform drift" }
        if ((node -p process.arch) -ne "${{ inputs.node-arch }}") { throw "Node architecture drift" }
        if ("${{ inputs.native-already-built }}" -ne "true") {
          .\shifu.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\shifu.cmd rebuild:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\shifu.cmd test:node-watcher-runtime-boundary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\shifu.cmd test:agent-session-peer-transport:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        node product/release/qualified-assignment-core-artifact.mjs seal `
          --repository-root . `
          --payload-root framework/core/dist/kungfu `
          --plan product/qualification/qualified-core/input/plan.json `
          --output-dir product/qualification/qualified-core/candidate `
          --repository "$env:GITHUB_REPOSITORY" `
          --run-id "$env:GITHUB_RUN_ID" `
          --event "${{ inputs.producer-event }}" `
          --workflow-path "${{ inputs.producer-workflow-path }}" `
          --platform-row "${{ inputs.row }}" `
          --runner-label "${{ inputs.runner-label }}" `
          --runner-environment github-hosted `
          --runner-os "$env:RUNNER_OS" `
          --runner-arch "$env:RUNNER_ARCH" `
          --runner-image-os "$env:ImageOS" `
          --runner-image-version "$env:ImageVersion" `
          --profile "$env:KUNGFU_BUILD_PROFILE" `
          --github-output "$env:GITHUB_OUTPUT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
