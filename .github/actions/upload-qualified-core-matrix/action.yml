# SPDX-License-Identifier: Apache-2.0

name: Upload Qualified Core matrix
description: Upload the matrix index and each independently qualified platform transport.

inputs:
  target-sha:
    description: Exact protected source commit.
    required: true
  darwin-arm64-available:
    description: Whether the Darwin ARM64 row is qualified.
    required: true
  linux-x86-64-available:
    description: Whether the Linux x86_64 row is qualified.
    required: true
  windows-x86-64-available:
    description: Whether the Windows x86_64 row is qualified.
    required: true

runs:
  using: composite
  steps:
    - name: Upload matrix index
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: qualified-assignment-core-matrix-${{ inputs.target-sha }}
        path: product/qualification/qualified-core/matrix-index.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Upload Darwin ARM64 transport
      if: ${{ inputs.darwin-arm64-available == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: qualified-assignment-core-${{ inputs.target-sha }}-darwin-arm64-cp313
        path: product/qualification/qualified-core/promoted/darwin-arm64-cp313
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Upload Linux x86_64 transport
      if: ${{ inputs.linux-x86-64-available == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: qualified-assignment-core-${{ inputs.target-sha }}-linux-x86_64-cp313
        path: product/qualification/qualified-core/promoted/linux-x86_64-cp313
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Upload Windows x86_64 transport
      if: ${{ inputs.windows-x86-64-available == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: qualified-assignment-core-${{ inputs.target-sha }}-windows-x86_64-cp313
        path: product/qualification/qualified-core/promoted/windows-x86_64-cp313
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
