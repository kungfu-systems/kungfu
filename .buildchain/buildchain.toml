schema = 1

# Kungfu monorepo onboarding to buildchain v2.
# Stage 1: declare version-state and lifecycle, validated in CI by
# actions/validate-config@v2 (no lifecycle execution yet).
#
# Version single source of truth is lerna.json; per-package package.json
# versions are propagated by lerna. How buildchain version-state interacts with
# lerna propagation is wired in a later stage (bump/publish).

[version]
required = true
strategy = "semver"
next = "auto"

[[version.files]]
type = "json"
path = "lerna.json"
key = "version"

# Lifecycle commands run through ./shifu, the pinned-toolchain entrypoint
# (fnm + uv). Declared here for stage 1; buildchain execution (via the reusable
# build workflow) and the runner preset that provides the fnm/uv/conan
# prerequisites are wired in a later stage.
[lifecycle.install]
command = "node scripts/buildchain-run-shifu.mjs install --frozen-lockfile --no-optional"

[lifecycle.build]
command = "node scripts/buildchain-run-shifu.mjs dist"

[lifecycle.verify]
command = "node scripts/buildchain-run-shifu.mjs verify"

[lifecycle.publish]
command = "node scripts/buildchain-custom-publish-evidence.mjs"

[badges]
release_passport = "https://github.com/kungfu-systems/kungfu/releases/latest/download/buildchain.release.json"
kfd_standards = "developer/sdk/node_modules/@kungfu-tech/kfd/standards.json"
kfd_1 = "declared"
kfd_2 = "declared"
kfd_3 = "declared"
kfd_4 = "declared"
platforms = ["macOS", "Linux", "Windows"]
workflows = ["buildchain-validate.yml", "dco.yml"]
