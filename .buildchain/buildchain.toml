schema = 1

# Kungfu monorepo lifecycle contract for Buildchain v3. Development PRs run
# lifecycle.check as a GitHub-hosted source gate; promotion keeps the existing
# install, build, and verify stages.
#
# Version single source of truth is lerna.json; per-package package.json
# versions are propagated by lerna. How buildchain version-state interacts with
# lerna propagation is wired in a later stage (bump/publish).

[version]
required = true
strategy = "semver"
next = "auto"

[[version.files]]
type = "json"
path = "lerna.json"
key = "version"

# Lifecycle commands run through the platform's shifu shim, the
# pinned-toolchain entrypoint. The small Node dispatcher chooses ./shifu or
# shifu.cmd without requiring Git Bash on Windows. The shim resolves the native
# launcher — cached binary, then
# prebuilt release download, then cargo, then the in-script bootstrap (the
# runner preset's own fnm/uv) as the last fallback. The launcher bootstraps
# missing prerequisites and loads the MSVC environment on Windows itself.
[lifecycle.env]
KUNGFU_BUILDCHAIN_NO_OPTIONAL = "1"
KUNGFU_BUILDCHAIN_SOURCE_BUILD = "1"
# Exercise the native launcher path in CI (dogfood; regressions fail here first).
SHIFU_NATIVE = "1"
# Fail fast on Windows when MSVC cannot be located (no-op elsewhere).
SHIFU_REQUIRE_MSVC = "1"
# Reusable source-check workflows do not preserve GITHUB_BASE_REF for the
# repository lifecycle. Keep the protected v4 delivery lane explicit here;
# source acceptance still validates it against the dev-channel contract.
KUNGFU_DEV_BRANCH = "dev/v4/v4.0"

[lifecycle.install]
# shifu-entry-contract: allow Buildchain mode selection before repository lifecycle dispatch
command = "node scripts/buildchain-install.mjs"

[lifecycle.check]
shell = "bash"
command = "./shifu check:source"

[lifecycle.build]
# shifu-entry-contract: allow the cross-platform dispatcher to enter the canonical shifu shim
command = "node scripts/run-shifu-lifecycle.mjs buildchain-build"

[lifecycle.verify]
# shifu-entry-contract: allow the cross-platform dispatcher to enter the canonical shifu shim
command = "node scripts/run-shifu-lifecycle.mjs cache-apply verify"

[lifecycle.signing-finalization]
# shifu-entry-contract: allow Buildchain's GitHub-hosted finalizer to rebind consumer qualification to imported signed bytes
command = "node product/scripts/verify-cli-surface-qualification.mjs --qualification product/release/cli/kungfu-episodes-cli-darwin-arm64.qualification.json --archive product/release/cli/kungfu-episodes-cli-darwin-arm64.tar.gz --platform darwin-arm64 --signing-result .buildchain/artifacts/signing/macos-arm64/kungfu-cli-macos-arm64/result.json --signing-receipt .buildchain/artifacts/signing/macos-arm64/kungfu-cli-macos-arm64/receipt.json --signing-provider-evidence .buildchain/artifacts/signing/macos-arm64/kungfu-cli-macos-arm64/provider-evidence.json && node product/scripts/upgrade-manifest.mjs finalize-macos-release-artifacts"

[lifecycle.publish]
# shifu-entry-contract: allow Buildchain publish adapter bootstraps before repository lifecycle dispatch
command = "node scripts/buildchain-custom-publish-evidence.mjs"

[release.stable]
strategy = "latest-qualified-alpha"
timezone = "Asia/Shanghai"
publish_at = "03:00"
minimum_soak_seconds = 86400
required_checks = ["alpha-release"]
ledger_ref = "buildchain/candidate-ledger/v4/v4.0"
auto_promote = true
auto_merge = true

[badges]
release_passport = "https://github.com/kungfu-systems/kungfu/releases/latest/download/buildchain.release.json"
kfd_standards = "developer/sdk/node_modules/@kungfu-tech/kfd/standards.json"
kfd_1 = "declared"
kfd_2 = "declared"
kfd_3 = "declared"
kfd_4 = "declared"
platforms = ["macOS", "Linux", "Windows"]
workflows = ["source-acceptance.yml", "buildchain-validate.yml", "dco.yml"]

[[signing.artifacts]]
id = "kungfu-cli-macos-arm64"
path = "product/release/cli/kungfu-episodes-cli-darwin-arm64.tar.gz"
profile = "auto"
kind = "archive"
platforms = ["macos-arm64"]
required = true
entitlements_profile = "jit-executable-v1"
entitlements_paths = [
  "kungfu-episodes-cli-darwin-arm64/runtime/kungfu",
  "kungfu-episodes-cli-darwin-arm64/runtime/python/bin/python3",
  "kungfu-episodes-cli-darwin-arm64/runtime/python/bin/python3.13",
]

[[signing.artifacts]]
id = "kungfu-desktop-macos-arm64"
path = "product/dist/desktop/mac-arm64/Kungfu Episodes.app"
profile = "auto"
kind = "app-bundle"
platforms = ["macos-arm64"]
required = true
